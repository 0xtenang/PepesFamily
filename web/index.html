<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https: wss: http://127.0.0.1:8545 http://localhost:8545; base-uri 'none'; form-action 'none'; object-src 'none'" />
<meta name="referrer" content="no-referrer" />
<title>PepesFamily</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js" integrity="sha512-V3xRGsQMQ8CG4l2gVN44TCDmNY5cdlxbSvejrgmWxcLKHft0Q3XQDbeuJ9aot14mpNuRWGtI//WKraedDGNZ+g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  // theme before first paint: saved choice, else the system setting
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #ffffff; --panel: #fafafa; --panel-2: #f1f1f1; --line: #dcdcdc; --strong: #000000;
  --text: #000000; --muted: #666666; --dim: #9a9a9a; --inv: #ffffff;
  --accent: #0a8f3c; --down: #d23c3c; --warn: #b8860b;
  --frame: #e8e8e5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --panel: #070707; --panel-2: #111111; --line: #2a2a2a; --strong: #ffffff;
    --text: #ffffff; --muted: #8c8c8c; --dim: #555555; --inv: #000000;
    --accent: #3ddc84; --down: #ff5a4f; --warn: #f5c542;
    --frame: #1c221c;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --panel: #070707; --panel-2: #111111; --line: #2a2a2a; --strong: #ffffff;
  --text: #ffffff; --muted: #8c8c8c; --dim: #555555; --inv: #000000;
  --accent: #3ddc84; --down: #ff5a4f; --warn: #f5c542;
  --frame: #1c221c;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 13px/1.6 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; padding-bottom: 44px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: inherit; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); }
header .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; border: 1.5px solid var(--strong); font-size: 13px; letter-spacing: .18em; height: 32px; }
.logo .mk { display: grid; place-items: center; width: 32px; border-right: 1.5px solid var(--strong); font-weight: 600; letter-spacing: 0; }
.logo .nm { display: grid; place-items: center; padding: 0 12px; background: var(--strong); color: var(--inv); font-weight: 500; }
nav.top { display: flex; gap: 4px; }
nav.top a { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; }
nav.top a:hover { color: var(--muted); }
nav.top a.on { background: var(--strong); color: var(--inv); }
.spacer { flex: 1; }
#connect { white-space: nowrap; }
button.icon { border: 0; background: none; color: var(--text); font-size: 15px; padding: 6px; cursor: pointer; }
@media (max-width: 600px) {
  header .wrap { gap: 8px; }
  .logo .nm { display: none; }
  .logo .mk { border-right: 0; }
  nav.top a { padding: 5px 6px; font-size: 11px; }
  #connect { padding: 7px 10px; }
  #connect.addr { text-transform: none; letter-spacing: 0; }
  h1 { font-size: 24px; }
  .stats:not(.q) { grid-template-columns: 1fr; }
}
@media (max-width: 360px) {
  header .wrap { gap: 4px; }
  nav.top { gap: 0; }
  nav.top a { padding: 4px 3px; font-size: 10px; }
  button.icon { padding: 4px; }
  #connect { padding: 6px 7px; font-size: 11px; }
  #connect .a1 { display: none; }
}

/* controls */
button, .btn {
  font: inherit; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  border: 1px solid var(--strong); background: var(--bg); color: var(--text); padding: 8px 14px; display: inline-block;
}
button:hover, .btn:hover { background: var(--panel-2); }
button.primary, .btn.primary { background: var(--strong); color: var(--inv); }
button.primary:hover, .btn.primary:hover { opacity: .85; }
button:disabled { opacity: .35; cursor: not-allowed; }
input, textarea {
  font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input:focus, textarea:focus { outline: none; border-color: var(--strong); }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }

/* layout */
main { padding: 30px 0 60px; }
h1 { font-weight: 400; font-size: 30px; letter-spacing: -.01em; margin: 0; }
h2 { font-weight: 500; font-size: 20px; margin: 0; }
h3 { font-weight: 500; font-size: 14px; }
.hero { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; margin-bottom: 26px; }
.hero p { margin: 8px 0 0; color: var(--muted); }
.sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.sec .n { color: var(--muted); }
.sec .t { font-weight: 600; }
.sec .rule { flex: 1; height: 1px; background: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); }
.seg button.on { background: var(--strong); color: var(--inv); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.grid > .card { border-top: 0; border-left: 0; }
.card { background: var(--bg); border: 1px solid var(--line); padding: 16px; }
.tcard { display: flex; gap: 12px; transition: background .12s; }
.tcard:hover { background: var(--panel-2); }
.avatar { width: 60px; height: 60px; background: var(--panel-2); object-fit: cover; flex: none; border: 1px solid var(--line);
  display: grid; place-items: center; font-weight: 600; color: var(--muted); overflow: hidden; }
.avatar.lg { width: 88px; height: 88px; }
.tcard .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border: 1px solid currentColor; text-transform: uppercase; }
.pill.eth { color: var(--text); } .pill.imd { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--text); font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 360px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; margin-top: 16px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.stats .card { padding: 14px 16px; border-top: 0; border-left: 0; }
.stats.q { grid-template-columns: repeat(2, 1fr); }
.stats .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stats .v { font-weight: 500; font-size: 20px; margin-top: 2px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 14px; border: 1px solid var(--line); }
.tabs button { border: 0; color: var(--muted); }
.tabs button.on.buy { background: var(--accent); color: #000; }
.tabs button.on.sell { background: var(--down); color: #fff; }
.quick { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.quick button { padding: 3px 9px; font-size: 11px; border-color: var(--line); }
.preview { margin: 12px 0; font-size: 12px; color: var(--muted); }
.full { width: 100%; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.b { color: var(--accent); } .s { color: var(--down); }
.chart { width: 100%; height: 200px; display: block; }
.toast { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); background: var(--strong); color: var(--inv);
  padding: 10px 16px; font-size: 12px; max-width: calc(100% - 32px); z-index: 20; display: none; }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); }
.fees { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.desc { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.links a { text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.ext .btn { padding: 4px 10px; font-size: 11px; }
.scroll-x { overflow-x: auto; }
.share-img { width: 100%; aspect-ratio: 1200 / 675; display: block; border: 1px solid var(--line); background: #000; }
#rf input { flex: 1; min-width: 0; }
.imgrow { display: flex; gap: 12px; align-items: flex-start; }
.imgprev { width: 60px; height: 60px; flex: none; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--dim); overflow: hidden; }
.imgprev img { width: 100%; height: 100%; object-fit: cover; }
.imgrow.drag .imgprev { border-color: var(--accent); }
.stat.ok { color: var(--accent); } .stat.warn { color: var(--warn); }
.sharegrid { grid-template-columns: minmax(0, 600px) 1fr; }
@media (max-width: 860px) { .sharegrid { grid-template-columns: 1fr; } }
.h { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }

/* bottom status bar */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .6); display: grid; place-items: center; }
.modal .card { width: min(340px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
.wopt { display: flex; align-items: center; gap: 10px; text-align: left; text-transform: none; letter-spacing: 0; font-size: 13px; }
.wopt img { width: 22px; height: 22px; }
.status { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; align-items: center; font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.status > span { padding: 0 16px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; gap: 6px; }
.status > span:last-child { border-right: 0; border-left: 1px solid var(--line); margin-left: auto; }
.status b { color: var(--text); font-weight: 500; }
.status .dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; }
/* home scene: control wall + live screen + frog */
.scene { position: relative; height: clamp(380px, 50vw, 560px); margin: 6px 0 28px; border: 1.5px solid var(--strong); overflow: hidden; background: var(--panel-2); }
.scene canvas.wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.screen { position: absolute; left: 50%; top: 6%; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); height: 60%;
  background: #050605; border: 5px solid var(--frame); outline: 1.5px solid #1b1b1b; color: #9aa79a; font-size: 12px;
  display: flex; flex-direction: column; z-index: 1; }
.scr-head { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #1d261d; color: #6f7d6f; white-space: nowrap; overflow: hidden; }
.scr-head b { color: #3ddc84; font-weight: 500; }
.scr-head .pulse { color: #3ddc84; animation: blink 2s steps(1) infinite; }
.scr-log { flex: 1; overflow: hidden; padding: 6px 12px; display: flex; flex-direction: column; justify-content: flex-end; }
.scr-log .ln { display: grid; grid-template-columns: 12px 44px 50px minmax(72px, max-content) 1fr; gap: 8px; white-space: nowrap; line-height: 1.8; color: #8e9b8e; }
.scr-log a.ln:hover { background: #0e170e; }
.scr-log .ln > span { overflow: hidden; text-overflow: ellipsis; }
.scr-log .gt { color: #3ddc84; }
.scr-log .ev.launch { color: #ffffff; } .scr-log .ev.buy { color: #3ddc84; } .scr-log .ev.sell { color: #ff7b72; }
.scr-log .sym { color: #e6ede6; }
.scr-log .new { animation: appear .5s ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.scr-input { margin: 0 12px 10px; border: 1px solid #1f5e35; padding: 5px 10px; color: #3ddc84; font-size: 12px; }
.scr-input:hover { background: #0e170e; }
.cur { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.crowd { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pepe { position: absolute; }
.pepe svg { width: 100%; height: auto; display: block; transform-origin: 50% 100%; animation: bob var(--dur, 5s) ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-2px) rotate(1.5deg); } }
@media (prefers-reduced-motion: reduce) { .pepe svg, .cur, .scr-head .pulse, .scr-log .new { animation: none; } }
@media (max-width: 600px) {
  .screen { top: 4%; height: 64%; font-size: 11px; }
  .scr-log .ln { grid-template-columns: 40px 38px minmax(60px, max-content) 1fr; gap: 6px; }
  .scr-log .ln .gt { display: none; }
  .scr-head .wide { display: none; }
}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#/" aria-label="PepesFamily home"><span class="mk">P</span><span class="nm">PEPESFAMILY</span></a>
    <nav class="top">
      <a href="#/" data-nav="/">Tokens</a>
      <a href="#/create" data-nav="/create">Launch</a>
      <a href="#/rewards" data-nav="/rewards">Rewards</a>
      <a href="#/admin" data-nav="/admin" id="adminlink" style="display:none">Admin</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon" id="theme" aria-label="Toggle light / dark">◐</button>
    <button id="connect">Connect</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<footer class="status">
  <span><b id="sb-vol">…</b> volume</span>
  <span><b id="sb-hold">…</b> paid to holders</span>
  <span>ETH <b id="sb-eth">…</b></span>
  <span>IMD <b id="sb-imd">…</b></span>
  <span><i class="dot"></i> Robinhood Chain</span>
</footer>

<script>
// ---------------------------------------------------------------- Config
// Robinhood Chain mainnet deployments (see contracts/deployments/).
const CONFIG = {
  chainId: 4663,
  chainName: "Robinhood Chain",
  rpc: "https://robinhood-rpc.publicnode.com",       // reads; swap in a paid RPC for heavy traffic
  walletRpc: "https://rpc.mainnet.chain.robinhood.com", // added to wallets that don't know the chain yet
  explorer: "https://robinhoodchain.blockscout.com",
  blockscoutApi: "https://robinhoodchain.blockscout.com/api/v2", // trade history
  // Launchpads, newest first. New tokens launch on the first one that is live on-chain; tokens from every
  // version stay listed and tradable. v2+: owner() = 0x0 (renounced), standard approvals + permit; v3 also blocks flash-held reward capture.
  pads: [
    { version: 3, pad: "0xC5a1f48C03635b83D79667463785bC2c6BcE28cC", router: "0x8A9b6A990d13f25F6393aCacfB013F980c763a27", ethRouter: "0x891B710b36D0bDb1D6B53CB979696EbE43c2d129", permit: true },
    { version: 2, pad: "0x072Fb5A1B65F30d59BcD11BEeD99803675bCE8CC", router: "0x85D6695CBE0BaF221a4BBd39F0b368B893e70D4b", ethRouter: "0xce3540Bf1D4b219B7B2055508A83B09A0e1df9eF", permit: true },
    { version: 1, pad: "0x2d7689E48Fd71D9A0f225C673D7b8F8A693368CC", router: "0xA73604EA3C393B47573986ff9Ce5A9EAb61883dC", ethRouter: "0x79eeE0C12C1284bc046e4494Eea6180695F5028A", permit: false },
  ],
  imd: "0x5F7Bb59365ce557C26dbcAa4EE9d39A4b95B7127",
  // Independent audits by the IMD Swarm (reports are public on explorer.imd.fun).
  audits: {
    launchpad: {
      url: "https://explorer.imd.fun/jobs/a3e708e2-fb57-43ea-a163-d93b916694a2",
      title: "PepesFamily launchpad",
      result: "7 findings: 1 medium, 3 low, 3 info",
      note: "Medium: a third-party swap with a tight price limit that only partly fills pays 4% of the requested amount. Our routers always fill fully and are not affected.",
    },
    tokens: {
      "0xe2c46c7068566740a33a4c93f5445b07bcfe5644": {
        url: "https://explorer.imd.fun/jobs/46a0c47b-d3ad-4c50-973e-369203a488ce",
        title: "Pepes token",
        result: "Scanner warnings confirmed false positives",
        note: "\"Possible honeypot\", \"owner can change balance\" and \"suspicious function\" were all confirmed false positives. Its high finding (rewards captured with flash-borrowed tokens) is fixed in v3; for v1 tokens like Pepes, waiting holder fees are paid out promptly so nothing is left to capture.",
      },
    },
  },
  quoter: "0x8dc178efb8111bb0973dd9d722ebeff267c98f94", // Uniswap V4Quoter on Robinhood Chain
  stateView: "0xf3334192d15450cdd385c8b70e03f9a6bd9e673b", // Uniswap v4 StateView (pool prices)
  // USD prices come from on-chain Uniswap v4 pools, no off-chain price API.
  ethUsdPoolId: "0xbac3aa3b91584a53a579b3c999a56756e954e59247e497bad1d25a4334bde551", // ETH/USDG (6 decimals)
  imdEthPoolId: "0xd2fc01ee6f8400b6b4ea3b341a188568f2bd6c72b07b96741a82396fa6eb8f02", // ETH/IMD
  imdEthKey: ["0x0000000000000000000000000000000000000000", "0x5F7Bb59365ce557C26dbcAa4EE9d39A4b95B7127", 10000, 100, "0x0000000000000000000000000000000000000000"],
};

const KEY_T = "tuple(address currency0, address currency1, uint24 fee, int24 tickSpacing, address hooks)";
const INFO_T = "tuple(address token, string name, string symbol, string metadata, address quote, address creator, uint64 createdAt, uint64 createdBlock, bool quoteIsCurrency0, bytes32 poolId, uint160 sqrtPriceX96, uint256 marketCap, uint256 pendingHolderFees, uint256 totalDividendsDistributed)";
const PAD_ABI = [
  "function tokenCount() view returns (uint256)",
  "function startTick(address) view returns (int24)",
  "function owner() view returns (address)",
  "function feeRecipient() view returns (address)",
  "function pendingProtocolFees(address quote) view returns (uint256)",
  "function collectProtocolFees(address quote)",
  "function flush(address token)",
  "event ProtocolFeesCollected(address indexed quote, address indexed to, uint256 amount)",
  `function poolKey(address token) view returns (${KEY_T})`,
  `function getTokens(uint256 offset, uint256 limit) view returns (${INFO_T}[])`,
  `function getTokenInfo(address token) view returns (${INFO_T})`,
  "event TokenLaunched(address indexed token, address indexed creator, address indexed quote, string name, string symbol, string metadata, bytes32 poolId, int24 startTick)",
  "event Trade(address indexed token, address indexed trader, bool isBuy, uint256 quoteAmount, uint256 tokenAmount, uint256 fee, uint160 sqrtPriceX96)",
];
const ROUTER_ABI = [
  "function launch(string name, string symbol, string metadata, address quote, uint256 initialBuy, uint256 minTokensOut) payable returns (address, uint256)",
  "function buy(address token, uint256 amountIn, uint256 minTokensOut, uint256 deadline) payable returns (uint256)",
  "function sell(address token, uint256 tokenAmount, uint256 minQuoteOut, uint256 deadline) returns (uint256)",
  "function sellWithPermit(address token, uint256 tokenAmount, uint256 minQuoteOut, uint256 deadline, uint8 v, bytes32 r, bytes32 s) returns (uint256)",
];
// Uniswap's deployed V4Quoter: simulates the swap through the pool and our hook, so the 4% fee is included.
const ETH_ROUTER_ABI = [
  "function buyWithEth(address token, uint256 minTokensOut, uint256 deadline) payable returns (uint256)",
  "function sellForEth(address token, uint256 tokenAmount, uint256 minEthOut, uint256 deadline) returns (uint256)",
  "function sellForEthWithPermit(address token, uint256 tokenAmount, uint256 minEthOut, uint256 deadline, uint8 v, bytes32 r, bytes32 s) returns (uint256)",
];
const QUOTER_ABI = [
  `function quoteExactInputSingle(tuple(${KEY_T} poolKey, bool zeroForOne, uint128 exactAmount, bytes hookData) params) returns (uint256 amountOut, uint256 gasEstimate)`,
];
const TOKEN_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function withdrawableDividendOf(address) view returns (uint256)",
  "function withdrawnDividends(address) view returns (uint256)",
  "function claim() returns (uint256)",
  "function accountedBalance() view returns (uint256)",
  "function distribute() returns (uint256)",
];
const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address, address) view returns (uint256)",
  "function approve(address, uint256) returns (bool)",
  "function name() view returns (string)",
  "function nonces(address) view returns (uint256)",
];
const ZERO = ethers.ZeroAddress;
const SUPPLY = 10n ** 27n;
const ONE = 10n ** 18n;

const reader = new ethers.JsonRpcProvider(CONFIG.rpc, CONFIG.chainId, { staticNetwork: true });
const quoterR = new ethers.Contract(CONFIG.quoter, QUOTER_ABI, reader);
let signer = null, account = null;

// Each launchpad version with a read-only contract. `live` is filled at startup from on-chain code, so a version
// is only used once it is actually deployed (nothing is ever sent to an address without code).
const PADS = CONFIG.pads.map((p) => ({ ...p, c: new ethers.Contract(p.pad, PAD_ABI, reader), live: false, ethLive: false }));

/// Tokens out (buy) or quote out (sell) for exact-in `amount`, via Uniswap's V4Quoter.
async function quoteSwap(P, token, quoteIsCurrency0, isBuy, amount) {
  const key = [...(await P.c.poolKey(token))]; // plain copy: ethers results are read-only
  return quoteExact(key, isBuy === quoteIsCurrency0, amount);

/// Same, but paying/receiving ETH on an IMD pair: routes through the IMD/ETH pool (as PepesFamilyEthRouter does).
async function quoteSwapEth(P, token, quoteIsCurrency0, isBuy, amount) {
  if (isBuy) return quoteSwap(P, token, quoteIsCurrency0, true, await quoteExact(CONFIG.imdEthKey, true, amount));
  return quoteExact(CONFIG.imdEthKey, false, await quoteSwap(P, token, quoteIsCurrency0, false, amount));

/// Gets `spender` allowed to pull `amount` of `token` for a sale. Returns permit {v,r,s} when the user signed one
/// (v2 tokens: no extra transaction), or null when an allowance is in place (existing, or via an approve tx).
async function authorizeSell(P, token, spender, amount, dl) {
  const tok = new ethers.Contract(token, ERC20_ABI, signer);
  if ((await tok.allowance(account, spender)) >= amount) return null;
  if (P.permit) {
    try {
      const [name, nonce] = await Promise.all([tok.name(), tok.nonces(account)]);
      toast("Sign the approval in your wallet (no gas)…", 8000);
      const sig = await signer.signTypedData(
        { name, version: "1", chainId: CONFIG.chainId, verifyingContract: token },
        { Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }] },
        { owner: account, spender, value: amount, nonce, deadline: dl },
      );
      const s = ethers.Signature.from(sig);
      return { v: s.v, r: s.r, s: s.s };
    } catch (e) {
      if (e?.code === "ACTION_REJECTED" || e?.code === 4001) throw e; // user said no
      // wallet can't sign typed data: fall back to a normal approval
    }
  }
  toast("Approve the token for selling in your wallet…", 8000);
  await (await tok.approve(spender, amount)).wait();
  return null;
}

const STATEVIEW_ABI = ["function getSlot0(bytes32 poolId) view returns (uint160 sqrtPriceX96, int24 tick, uint24 protocolFee, uint24 lpFee)"];
const prices = { ethUsd: 0, imdEth: 0 };
async function loadPrices() {

const quoteUsd = (q) => (q === ZERO ? prices.ethUsd : prices.imdEth * prices.ethUsd);
function fmtUsd(n) {
  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  if (n >= 1) return "$" + n.toFixed(2);
  if (n <= 0) return "$0";
  return "$" + n.toFixed(Math.min(18, 1 - Math.floor(Math.log10(n)))); // 2 significant digits
}
/// Quote-denominated wei amount as USD, falling back to the quote asset if prices are unavailable.
function usd(wei, q) {
  const u = quoteUsd(q);
  return u ? fmtUsd(Number(ethers.formatUnits(wei, 18)) * u) : `${fmt(wei)} ${qsym(q)}`;
}

function fmt(wei, max = 4) {
  const n = Number(ethers.formatUnits(wei, 18));
  if (n === 0) return "0";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";

/// Quote per token from a v4 sqrtPriceX96 (price = currency1 per currency0).
function priceOf(sqrtPriceX96, quoteIsCurrency0) {
  const r = Number(sqrtPriceX96) / 2 ** 96;
  const p = r * r;
  return quoteIsCurrency0 ? 1 / p : p;
}
/// Starting market cap (quote wei) for a start tick (tick of tokens per quote).
const startMcap = (tick) => BigInt(Math.floor(1e9 / Math.pow(1.0001, Number(tick)) * 1e6)) * 10n ** 12n;
const ago = (ts) => {

function meta(json) { try { const m = JSON.parse(json); return typeof m === "object" && m ? m : {}; } catch { return {}; } }
function safeUrl(u) {
  if (typeof u !== "string") return "";
  if (u.startsWith("ipfs://")) return IPFS_GATEWAYS[0] + u.slice(7);
  return /^https:\/\//i.test(u) ? u : "";
}
// ipfs.io no longer serves files to other websites, so IPFS images load through these public gateways in order.
const IPFS_GATEWAYS = ["https://ipfs.filebase.io/ipfs/", "https://gateway.pinata.cloud/ipfs/", "https://ipfs.io/ipfs/"];
/// "<cid>[/path]" from ipfs://… or any https gateway link (…/ipfs/<cid> or <cid>.ipfs.host), else "".
function ipfsPath(u) {
  let p = "";
  if (u.startsWith("ipfs://")) p = u.slice(7).replace(/^ipfs\//, "");
  else {
    try {
      const x = new URL(u);
      const sub = x.hostname.match(/^([a-z0-9]{46,})\.ipfs\./i);
      p = x.pathname.startsWith("/ipfs/") ? x.pathname.slice(6) : sub ? sub[1] + x.pathname.replace(/^\/$/, "") : "";
    } catch {}
  }
  return /^[A-Za-z0-9]{46,}(\/[A-Za-z0-9._~%-]+)*$/.test(p) ? p : "";
}
function avatar(info, cls = "") {
  const raw = meta(info.metadata).image;
  const ipfs = typeof raw === "string" ? ipfsPath(raw.trim()) : "";
  const img = ipfs ? IPFS_GATEWAYS[0] + ipfs : safeUrl(raw);
  const letter = esc((info.symbol || "?").slice(0, 2));
  return img ? `<img class="avatar ${cls}" src="${esc(img)}" alt="${letter}" loading="lazy" referrerpolicy="no-referrer"${ipfs ? ` data-ipfs="${esc(ipfs)}" data-gw="0"` : ""}>`
             : `<div class="avatar ${cls}">${letter}</div>`;
}
// Broken images try the next IPFS gateway, then fall back to the ticker letters (no inline handlers: names and
// tickers are user input).
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("avatar")) return;
  const gw = Number(img.dataset.gw) + 1;
  if (img.dataset.ipfs && gw < IPFS_GATEWAYS.length) { img.dataset.gw = String(gw); img.src = IPFS_GATEWAYS[gw] + img.dataset.ipfs; return; }
  const div = document.createElement("div");
  div.className = img.className;
  div.textContent = img.alt;
  img.replaceWith(div);
}, true);
function toast(msg, ms = 4000) {

// Wallet discovery via EIP-6963, so MetaMask, Phantom, Rabby, OKX, ... can all be installed side by side and the
// visitor picks one. Falls back to window.ethereum for wallets that don't announce themselves.
const WALLETS = [];
window.addEventListener("eip6963:announceProvider", (e) => {
  const { info, provider } = e.detail || {};
  if (info?.uuid && provider && !WALLETS.some((w) => w.info.uuid === info.uuid)) WALLETS.push({ info, provider });
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

let WALLET = null, walletName = "Your wallet", listening = null;

function pickWallet() {
  if (WALLETS.length === 0) return Promise.resolve(window.ethereum ? { provider: window.ethereum, info: { name: "Your wallet" } } : null);
  if (WALLETS.length === 1) return Promise.resolve(WALLETS[0]);
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="card"><span class="h">Connect a wallet</span>
      ${WALLETS.map((w, i) => `<button class="wopt" data-i="${i}">${/^data:image\//.test(w.info.icon || "") ? `<img src="${esc(w.info.icon)}" alt="" />` : ""}<span>${esc(w.info.name)}</span></button>`).join("")}
      <button class="wopt" data-cancel="1">Cancel</button></div>`;
    m.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b && ev.target !== m) return; // click inside the card, not on a button
      m.remove();
      resolve(b && b.dataset.i != null ? WALLETS[Number(b.dataset.i)] : null);
    };
    document.body.appendChild(m);
  });
}

function listen(eth) {
  if (listening === eth) return;
  listening = eth;
  eth.on?.("accountsChanged", (accs) => {
    signer = null; account = null; $("#connect").textContent = "Connect"; $("#connect").classList.remove("addr");
    if (accs?.length) connect().catch(() => {});
  });
  // Switching network inside the wallet: drop the session if it leaves Robinhood Chain (no page reload).
  eth.on?.("chainChanged", (id) => {
    if (Number(id) !== CONFIG.chainId) { signer = null; account = null; $("#connect").textContent = "Connect"; $("#connect").classList.remove("addr"); }
  });
}

async function connect() {
  const picked = WALLET ? { provider: WALLET, info: { name: walletName } } : await pickWallet();
  if (!picked) {
    if (!WALLETS.length && !window.ethereum) toast("No wallet found. Install a browser wallet such as MetaMask, Rabby or Phantom.");
    return;
  }
  const eth = picked.provider;
  walletName = picked.info?.name || "Your wallet";
  // Ask for the account first: some wallets (Phantom) reject every other request until the site is authorized.
  await eth.request({ method: "eth_requestAccounts" });
  const hex = "0x" + CONFIG.chainId.toString(16);
  if ((await eth.request({ method: "eth_chainId" })) !== hex) {
    try {
      await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
    } catch (e) {
      const code = e?.code ?? e?.data?.originalError?.code;
      if (code === 4001) throw e; // user said no
      try {
        await eth.request({ method: "wallet_addEthereumChain", params: [{
          chainId: hex, chainName: CONFIG.chainName, rpcUrls: [CONFIG.walletRpc],
          nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, blockExplorerUrls: [CONFIG.explorer],
        }] });
      } catch (e2) {
        if ((e2?.code ?? 0) === 4001) throw e2;
        throw new Error(`${walletName} couldn't switch to Robinhood Chain. Select Robinhood Chain in ${walletName} (chain ID ${CONFIG.chainId}) and try again.`);
      }
    }
  }
  WALLET = eth;
  listen(eth);
  const provider = new ethers.BrowserProvider(eth);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  // account is a checksummed hex address (safe as HTML); the first part is hidden on very narrow screens
  $("#connect").innerHTML = `<span class="a1">${account.slice(0, 6)}</span>…${account.slice(-4)}`;
  $("#connect").classList.add("addr");
  showAdminLink().catch(() => {});
  route();
}
async function requireWallet() {
  if (!signer) await connect();
  if (!signer) throw new Error("Connect a wallet first");
  const net = await signer.provider.getNetwork();
  if (Number(net.chainId) !== CONFIG.chainId) await connect();
}
$("#connect").onclick = () => connect().catch((e) => toast(errMsg(e), 7000));

const Scene = (() => {

      const h = Math.min(cell * (2 + Math.floor(r() * 4)), wallH - y - 3);
      for (let x = 3; x < W - cell; ) {
        const w = Math.min(cell * (2 + Math.floor(r() * 6)), W - x - 3);
        mods.push({ x, y, w: w - 3, h: h - 3, t: TYPES[Math.floor(r() * TYPES.length)], s: r(), hl: r() < 0.07 });
        x += w;

      y += h;

    specks = Array.from({ length: Math.round(W / 2.5) }, () => [r(), r(), r()]);
  }

  function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill ? ctx.fill() : ctx.stroke(); }

  function mod(m, t) {
    const { x, y, w, h, s } = m;

    ctx.lineWidth = 1.5; ctx.strokeStyle = m.hl ? C.green : C.ink; ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);

        for (let i = 0; i < n; i++) {

          circle(cx, cy, r);

        }

      }
      case "leds": {
        const sz = 5, g = 4, cols = Math.floor(iw / (sz + g)), rows = Math.floor(ih / (sz + g));
        for (let i = 0; i < cols * rows; i++) {
          const lx = ix + (i % cols) * (sz + g), ly = iy + Math.floor(i / cols) * (sz + g);
          if (h01(i + s * 999 + Math.floor(t * 1.5 + s * 7)) < 0.28) { ctx.fillStyle = m.hl ? C.green : C.lit; ctx.fillRect(lx, ly, sz, sz); }

        }
        break;
      }
      case "meter": {
        const cx = ix + iw / 2, cy = iy + ih * 0.9, r = Math.min(iw / 2, ih * 0.8);
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

      case "scope": {

        ctx.strokeStyle = C.green; ctx.lineWidth = 1.4; ctx.beginPath();

      }
      case "digits": {
        ctx.fillStyle = C.dark; ctx.fillRect(ix, iy, iw, ih);
        ctx.fillStyle = C.green; ctx.font = `${Math.max(8, Math.min(ih * 0.62, 18))}px "IBM Plex Mono", monospace`;
        ctx.textBaseline = "middle";
        const d = new Date(), txt = s < 0.5
          ? [d.getHours(), d.getMinutes(), d.getSeconds()].map((v) => String(v).padStart(2, "0")).join(":")
          : String(Math.floor(s * 900000 + t * 3)).slice(-6);
        ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip(); ctx.fillText(txt, ix + 4, iy + ih / 2 + 1); ctx.restore();
        break;
      }
      case "sliders": {
        const n = Math.max(2, Math.floor(iw / 12));
        for (let i = 0; i < n; i++) {
          const sx = ix + (i + 0.5) * (iw / n);
          ctx.beginPath(); ctx.moveTo(sx, iy); ctx.lineTo(sx, iy + ih); ctx.stroke();
          const ky = iy + ih * (0.15 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 2.1 + s * 9)));
          ctx.fillRect(sx - 4, ky - 2, 8, 4);
        }
        break;
      }
      case "grill": for (let yy = iy + 2; yy < iy + ih; yy += 5) { ctx.beginPath(); ctx.moveTo(ix, yy); ctx.lineTo(ix + iw, yy); ctx.stroke(); } break;
      case "dial": {
        const cx = ix + iw / 2, cy = iy + ih / 2, r = Math.min(iw, ih) / 2 - 1;
        circle(cx, cy, r);
        for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.82); ctx.stroke(); }
        const a = t * 0.6 + s * 10;
        ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7); ctx.stroke();
        break;
      }
      case "buttons": {
        const bw = 12, n = Math.max(1, Math.floor(iw / (bw + 4))), on = Math.floor(h01(s * 77 + Math.floor(t / 3)) * n);
        for (let i = 0; i < n; i++) {
          const bx = ix + i * (bw + 4), bh = Math.min(10, ih);
          if (i === on) { ctx.fillStyle = m.hl ? C.green : C.lit; ctx.fillRect(bx, iy + (ih - bh) / 2, bw, bh); }
          else ctx.strokeRect(bx + 0.5, iy + (ih - bh) / 2 + 0.5, bw - 1, bh - 1);
        }
        break;
      }
    }
  }

  function draw(t) {
    C = isDark() ? DARK : LIGHT;
    const wallH = H - floorH();
    ctx.fillStyle = C.wall; ctx.fillRect(0, 0, W, wallH);
    for (const m of mods) mod(m, t);
    // a dark baseboard, then a speckled floor
    ctx.fillStyle = "#121212"; ctx.fillRect(0, wallH, W, Math.max(8, floorH() * 0.3));
    const fy = wallH + Math.max(8, floorH() * 0.3);
    ctx.fillStyle = "#f2f2ef"; ctx.fillRect(0, fy, W, H - fy);
    ctx.fillStyle = "#2a2a2a";
    for (const [a, b, c] of specks) ctx.fillRect(a * W, fy + b * (H - fy), 1 + c * 2, 1);
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!visible || document.hidden || now - last < 110) return;
    last = now;
    draw(now / 1000);
  }

  function size() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(); crowd(); draw(performance.now() / 1000);
  }

  // The Pepes: two rows of frogs on the floor, back row smaller, each swaying on its own rhythm.
  function crowd() {
    if (!crowdEl) return;
    const r = rng(11), base = Math.max(38, Math.min(80, W * 0.062)), out = [];
    for (const [row, scale, lift] of [[0, 0.8, 0.07], [1, 1, 0.008]]) {
      const w = base * scale;
      for (let x = -w * 0.35 + r() * w * 0.4 + row * w * 0.6; x < W - w * 0.45; x += w * (1.12 + r() * 0.4)) {
        const s = scale * (0.9 + r() * 0.2);
        out.push(`<div class="pepe" style="left:${(x + (r() - 0.5) * w * 0.2).toFixed(1)}px;bottom:${(lift * H + r() * 3).toFixed(1)}px;width:${(base * s).toFixed(1)}px;--d:-${(r() * 5).toFixed(2)}s;--dur:${(4 + r() * 3).toFixed(2)}s">${FROG_SVG}</div>`);
      }
    }
    crowdEl.innerHTML = out.join("");
  }

  function mount(root) {
    unmount();
    canvas = root.querySelector("canvas.wall");
    crowdEl = root.querySelector(".crowd");
    ctx = canvas.getContext("2d");
    size();
    ro = new ResizeObserver(() => size()); ro.observe(canvas);
    io = new IntersectionObserver(([e]) => (visible = e.isIntersecting)); io.observe(canvas);
    if (!reduce) raf = requestAnimationFrame(frame);
  }

  function unmount() {
    cancelAnimationFrame(raf); raf = 0;
    ro?.disconnect(); io?.disconnect(); ro = io = null;
  }

  return { mount, unmount };
})();

/// Live terminal: recent launches and trades across every launchpad version, polled every 20 s.
const Feed = (() => {
  let timer = 0, seen = new Set(), tokens = new Map();
  const hhmm = (sec) => new Date(sec * 1000).toTimeString().slice(0, 5);

  async function loadTokens() {
    const lists = await Promise.all(livePads().map(async (P) => {
      const n = Number(await P.c.tokenCount());
      const out = [];
      for (let off = 0; off < n; off += 100) out.push(...(await P.c.getTokens(off, 100)));
      return out;
    }));
    for (const t of lists.flat().filter(isListed)) tokens.set(t.token.toLowerCase(), t);
    const n = $("#scr-n"); if (n) n.textContent = String(tokens.size);
  }

  async function recentTrades() {
    const out = [];
    await Promise.all(livePads().map(async (P) => {
      const topic = P.c.interface.getEvent("Trade").topicHash;
      try {
        const r = await fetch(`${CONFIG.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic}`, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return;
        for (const i of (await r.json()).items) {
          if (i.topics[0] !== topic) continue;
          const a = P.c.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args;
          out.push({ key: i.transaction_hash + ":" + i.index, ts: Date.parse(i.block_timestamp) / 1000, kind: a.isBuy ? "buy" : "sell", token: a.token, a });
        }
      } catch {}
    }));
    return out;
  }

  function line(e, fresh) {
    const t = tokens.get(e.token.toLowerCase());
    if (!t) return "";
    const sym = "$" + esc(t.symbol);
    const detail = e.kind === "launch"
      ? `${qsym(t.quote)} pair · MC ${usd(t.marketCap, t.quote)}`
      : `${fmt(e.a.tokenAmount)} · ${usd(e.a.quoteAmount, t.quote)}`;
    return `<a class="ln${fresh ? " new" : ""}" href="#/t/${t.token}"><span class="gt">&gt;</span><span>${hhmm(e.ts)}</span><span class="ev ${e.kind}">${e.kind}</span><span class="sym">${sym}</span><span>${esc(detail)}</span></a>`;
  }

  async function tick(first) {
    const log = $("#scr-log");
    if (!log) return stop();
    try {
      await loadTokens();
      const events = [
        ...[...tokens.values()].map((t) => ({ key: "launch:" + t.token, ts: Number(t.createdAt), kind: "launch", token: t.token })),
        ...(await recentTrades()),
      ].sort((x, y) => x.ts - y.ts);
      const fresh = events.filter((e) => !seen.has(e.key));
      fresh.forEach((e) => seen.add(e.key));
      if (first) {
        log.innerHTML = events.slice(-28).map((e) => line(e, false)).join("") || `<div class="ln"><span></span><span></span><span class="ev">idle</span><span>no activity yet</span></div>`;
      } else if (fresh.length) {
        log.insertAdjacentHTML("beforeend", fresh.map((e) => line(e, true)).join(""));
        while (log.children.length > 40) log.firstElementChild.remove();
      }
    } catch (e) {
      if (first) log.innerHTML = `<div class="ln"><span></span><span></span><span class="ev sell">error</span><span>${esc(errMsg(e))}</span></div>`;
    }
  }

  function start() { stop(); seen = new Set(); tick(true); timer = setInterval(() => tick(false), 20000); }
  function stop() { clearInterval(timer); timer = 0; }
  return { start, stop };
})();

// ---------------------------------------------------------------- Platform totals
/// All-time totals across every launchpad version, summed per quote asset (ETH / IMD) and shown in USD.
///   Holders:  for each token, dividends already distributed + holder fees still waiting to be flushed.
///   Protocol: fees already collected (ProtocolFeesCollected events) + fees pending in each launchpad.
async function loadTotals() {
  const holders = { [ZERO]: 0n, [CONFIG.imd]: 0n };
  const protocol = { [ZERO]: 0n, [CONFIG.imd]: 0n };
  let protocolExact = true;

  await Promise.all(livePads().map(async (P) => {
    const n = Number(await P.c.tokenCount());
    for (let off = 0; off < n; off += 100) {
      for (const t of await P.c.getTokens(off, 100)) {
        holders[t.quote] = (holders[t.quote] ?? 0n) + t.totalDividendsDistributed + t.pendingHolderFees;
      }
    }
    const [pe, pi] = await Promise.all([P.c.pendingProtocolFees(ZERO), P.c.pendingProtocolFees(CONFIG.imd)]);
    protocol[ZERO] += pe; protocol[CONFIG.imd] += pi;
    try {
      for (const ev of await fetchPadLogs(P, P.c.interface.getEvent("ProtocolFeesCollected").topicHash)) {
        const { quote, amount } = P.c.interface.parseLog(ev).args;
        protocol[quote] = (protocol[quote] ?? 0n) + amount;
      }
    } catch { protocolExact = false; }
  }));

  const toUsd = (m) => Object.entries(m).reduce((s, [q, wei]) => s + Number(ethers.formatUnits(wei, 18)) * quoteUsd(q), 0);
  const parts = (m) => Object.entries(m).filter(([, w]) => w > 0n).map(([q, w]) => `${fmt(w)} ${qsym(q)}`).join(" + ") || "nothing yet";
  // If collection history is unavailable, the fixed 1% / 3% split gives the same total from holder earnings.
  const proto = protocolExact ? protocol : Object.fromEntries(Object.entries(holders).map(([q, w]) => [q, w / 3n]));
  // The protocol fee is exactly 1% of each trade's quote amount, so volume = protocol fees × 100.
  const volume = Object.fromEntries(Object.entries(proto).map(([q, w]) => [q, w * 100n]));
  const approx = protocolExact ? "" : "≈ ";

  // bottom status bar (every page)
  $("#sb-vol").textContent = approx + fmtUsd(toUsd(volume));
  $("#sb-hold").textContent = fmtUsd(toUsd(holders));
  if ($("#scr-vol")) { $("#scr-vol").textContent = $("#sb-vol").textContent; $("#scr-hold").textContent = $("#sb-hold").textContent; }

  if (!$("#tot-holders")) return; // not on the home page
  $("#tot-holders").textContent = fmtUsd(toUsd(holders));
  $("#tot-holders-sub").textContent = `3% of every trade · ${parts(holders)}`;
  $("#tot-protocol").textContent = approx + fmtUsd(toUsd(proto));
  $("#tot-protocol-sub").textContent = `1% of every trade · ${parts(proto)}`;
  $("#tot-volume").textContent = approx + fmtUsd(toUsd(volume));
  $("#tot-volume-sub").textContent = `all time · ${parts(volume)}`;
}

/// All logs a launchpad emitted with `topic0`, via Blockscout's API (paginated).
async function fetchPadLogs(P, topic0) {
  const url = `${CONFIG.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic0}`;
  const items = [];
  let next = null;
  for (let page = 0; page < 20; page++) {
    const r = await fetch(url + (next ? "&" + new URLSearchParams(next).toString() : ""), { signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error("blockscout " + r.status);
    const j = await r.json();
    items.push(...j.items.filter((i) => i.topics[0] === topic0).map((i) => ({ topics: i.topics.filter(Boolean), data: i.data })));
    if (!j.next_page_params) break;
    next = j.next_page_params;
  }
  return items;
}

      const infos = [];

      // Per token: rewards paid out to holders but not yet claimed (accountedBalance, held by the token contract),

      const tokens = await Promise.all(infos.map(async (t) => {

  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

  // logo
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(60, 56, 44, 44);
  g.fillStyle = "#fff"; g.fillRect(104, 56, 214, 44);
  g.font = F(600, 22); g.textAlign = "center"; g.fillText("P", 82, 79);
  g.fillStyle = "#000"; g.font = F(500, 18); g.fillText("PEPESFAMILY", 211, 79);
  g.textAlign = "left";
  g.fillStyle = "#8c8c8c"; g.font = F(500, 22); g.fillText("HOLDER REWARDS EARNED", 60, 172);
  g.fillStyle = "#3ddc84"; fit(total, 600, 128, W - 120); g.fillText(total, 54, 252);
  g.fillStyle = "#fff"; fit(sub, 400, 26, W - 120); g.fillText(sub, 60, 336);
  top.forEach((t, i) => {
    const y = 404 + i * 42;
    g.font = F(500, 26);

  g.fillStyle = "#8c8c8c"; g.font = F(400, 20); g.fillText("3% of every trade goes to holders", 60, floor + 36);
  g.fillStyle = "#fff"; g.font = F(600, 20); g.textAlign = "right"; g.fillText("pepesfamily.fun", W - 60, floor + 36);

}

// ---------------------------------------------------------------- Launch image
/// Turns common share links into direct image links (IPFS gateway links -> ipfs://, Dropbox -> raw file, GitHub
/// file page -> raw file, Google Drive file -> image). Anything else is returned as typed.
function fixImageLink(u) {
  u = u.trim();
  if (!u) return "";
  const ipfs = ipfsPath(u);
  if (ipfs) return "ipfs://" + ipfs;
  try {
    const x = new URL(u);
    if (/(^|\.)dropbox\.com$/.test(x.hostname) && x.searchParams.has("dl")) {
      x.searchParams.delete("dl"); x.searchParams.set("raw", "1"); return x.href;
    }
    if (x.hostname === "github.com") {
      const m = x.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
      if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
    }
    if (x.hostname === "drive.google.com") {
      const id = x.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || x.searchParams.get("id");
      if (id && /^[\w-]+$/.test(id)) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    }
  } catch {}
  return u;
}
function loadImage(src, ms = 15000) {
  return new Promise((resolve) => {
    const im = new Image();
    im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => { im.src = ""; resolve(false); }, ms);
    im.onload = () => { clearTimeout(t); resolve(im.naturalWidth > 0); };
    im.onerror = () => { clearTimeout(t); resolve(false); };
    im.src = src;
  });
}
/// The URL the site will show for `link` if it really is an image (IPFS: first gateway that serves it), else "".
async function imageLoads(link) {
  const p = ipfsPath(link);
  if (p) { for (const g of IPFS_GATEWAYS) if (await loadImage(g + p)) return g + p; return ""; }
  const s = safeUrl(link);
  return s && (await loadImage(s)) ? s : "";
}
/// Reads an image file and scales it to fit 512×512 (small GIFs are kept as they are, so they stay animated).
async function shrinkImage(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) throw new Error("Use a PNG, JPG, GIF or WEBP image");
  const dataUrl = await new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(r.result); r.onerror = () => bad(new Error("Couldn't read that file"));
    r.readAsDataURL(file);
  });
  if (file.type === "image/gif" && file.size <= 1024 * 1024) return dataUrl;
  const im = new Image();
  await new Promise((ok, bad) => { im.onload = ok; im.onerror = () => bad(new Error("That file isn't a valid image")); im.src = dataUrl; });
  const k = Math.min(1, 512 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  let out = c.toDataURL("image/webp", 0.88);
  if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png"); // browsers without WEBP encoding
  if (out.length > 1.3e6) out = c.toDataURL("image/jpeg", 0.85);
  return out;
}

/// The launch form's image field: live preview and check of pasted links, plus upload to IPFS (file picker, drag and
/// drop, or paste) when /api/upload is configured. ready() resolves to an error message, or "" when it's fine to launch.
function setupImageField() {
  const inp = $("#img"), prev = $("#imgprev"), msg = $("#imgmsg");
  const HINT = "Tip: open the image (an X profile picture, any picture online), right-click it and choose \"Copy image address\", then paste it here.";
  let st = { link: "", ok: true, busy: null };
  const say = (text, cls = "") => { msg.textContent = text; msg.className = "stat" + (cls ? " " + cls : ""); };
  const show = (src) => { prev.innerHTML = src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : "?"; };
  say(HINT);

  function check() {
    const link = fixImageLink(inp.value);
    if (link !== inp.value.trim()) inp.value = link;
    if (link === st.link) return st.busy || Promise.resolve();
    if (!link) { st = { link: "", ok: true, busy: null }; show(""); say(HINT); return Promise.resolve(); }
    if (!ipfsPath(link) && !/^https:\/\//i.test(link)) {
      st = { link, ok: false, busy: null }; show(""); say("Use a link that starts with https:// or ipfs://", "warn");
      return Promise.resolve();
    }
    say("Checking the image…");
    const busy = imageLoads(link).then((src) => {
      if (st.link !== link) return;
      st = { link, ok: !!src, busy: null };
      show(src);
      if (src) say("✓ Image found", "ok");
      else say("This link isn't an image, it's probably a web page. " + HINT, "warn");
    });
    st = { link, ok: false, busy };
    return busy;
  }
  let timer = 0;
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(check, 600); };
  inp.onchange = () => { clearTimeout(timer); check(); };

  let canUpload = false;
  async function upload(file) {
    if (!canUpload) return say("Uploading isn't available right now: paste an image link instead.", "warn");
    const job = (async () => {
      try {
        say("Preparing the image…");
        const dataUrl = await shrinkImage(file);
        show(dataUrl);
        say("Uploading to IPFS…");
        const [, type, data] = dataUrl.match(/^data:([^;]+);base64,(.*)$/);
        const r = await fetch("/api/upload", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type, data }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || typeof j.url !== "string" || !ipfsPath(j.url)) throw new Error(j.error || "Upload failed, please try again");
        inp.value = j.url;
        st = { link: j.url, ok: true, busy: null };
        say("✓ Uploaded to IPFS", "ok");
      } catch (e) {
        st = { link: "", ok: true, busy: null }; // whatever link is left in the field gets checked again on launch
        show(""); say(errMsg(e), "warn");
      }
    })();
    st = { ...st, busy: job };
    return job;
  }
  fetch("/api/upload", { signal: AbortSignal.timeout(8000) }).then((r) => r.json()).then((j) => {
    if (!j?.enabled || !$("#imgupbox")) return;
    canUpload = true;
    $("#imgupbox").hidden = false;
    $("#imgup").onclick = () => $("#imgfile").click();
    $("#imgfile").onchange = () => { const f = $("#imgfile").files[0]; if (f) upload(f); $("#imgfile").value = ""; };
    const row = $("#imgrow");
    row.ondragover = (e) => { e.preventDefault(); row.classList.add("drag"); };
    row.ondragleave = () => row.classList.remove("drag");
    row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drag"); const f = e.dataTransfer?.files?.[0]; if (f) upload(f); };
  }).catch(() => {});
  // Pasting a copied image (not a link) anywhere in the form uploads it.
  $("#cf").addEventListener("paste", (e) => {
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
    if (f) { e.preventDefault(); upload(f); }
  });

  return {
    async ready() {
      await check();
      if (st.busy) await st.busy;
      if (st.link && !st.ok) return "The image doesn't load. Fix the link, upload an image, or leave the field empty.";
      return "";
    },
  };
}

        <label for="ib" style="margin-top:0">Amount (IMD, optional): buy first, in the same transaction</label><input id="ib" inputmode="decimal" placeholder="0" />
        <div class="preview" id="ibp"></div>
        <div class="stat">The launch-time buy is paid in IMD. After launch, anyone can buy with ETH too.</div>
        ${sec(4, "Launch")}
        <button class="primary full" id="go" type="submit">Launch token</button>
      </form>
      <div class="card" style="margin-top:26px">
        <span class="h">How it works</span>
        <p class="muted">Your token gets a Uniswap v4 pool against IMD holding the entire supply, tradable from the first block here, in the Uniswap app, or through any v4 router. The liquidity is owned by the launchpad contract, which has no way to remove it: it is locked forever.</p>
        <div class="fees"><b style="color:var(--text)">4% fee on every buy and sell</b><br/>1% protocol · 3% shared by all holders, pro rata to their balance, paid in IMD. Holders claim anytime.</div>
        <div class="fees" id="startmc"></div>
      </div>
    </div>`;
  const updStart = async () => {
    try {
      const v = startMcap(await padR.startTick(quote));
      $("#startmc").innerHTML = `Starting market cap: <b style="color:var(--text)">≈ ${usd(v, quote)}</b> <span class="muted">(${fmt(v)} ${qsym(quote)})</span>`;
    } catch {}
  };
  const updPreview = () => {
    const v = $("#ib").value.trim();
    let amt = 0n; try { amt = v ? ethers.parseUnits(v, 18) : 0n; } catch {}
    if (!amt) return ($("#ibp").textContent = "");
    padR.startTick(quote).then((tick) => {
      const vq = startMcap(tick); // the pool behaves like x*y=k with this much virtual quote
      const net = amt - (amt * 400n) / 10000n;
      const out = (SUPPLY * net) / (vq + net);
      $("#ibp").textContent = `≈ ${fmt(out)} tokens (${(Number((out * 10000n) / SUPPLY) / 100).toFixed(2)}% of supply)`;
    }).catch(() => {});
  };
  $("#ib").oninput = updPreview;
  updStart();
  const image = setupImageField();

  $("#cf").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true;
    try {
      const imgErr = await image.ready(); // never launch with an image link that doesn't load: it can't be changed later
      if (imgErr) throw new Error(imgErr);
      await requireWallet();
      const m = {};
      const put = (k, id) => { const v = $(id).value.trim(); if (v) m[k] = v; };
      put("image", "#img"); put("description", "#d"); put("website", "#w"); put("x", "#x"); put("telegram", "#tg");
      const ibv = $("#ib").value.trim();
      const initialBuy = ibv ? ethers.parseUnits(ibv, 18) : 0n;
      if (quote !== ZERO && initialBuy > 0n) await ensureImdAllowance(initialBuy, LAUNCH.router);
      const router = new ethers.Contract(LAUNCH.router, ROUTER_ABI, signer);
      toast("Confirm the launch in your wallet…", 8000);
      const tx = await router.launch($("#n").value.trim(), $("#s").value.trim(), JSON.stringify(m), quote, initialBuy, 0n,
        { value: quote === ZERO ? initialBuy : 0n });
      toast("Launching…", 15000);
      const rc = await tx.wait();
      const ev2 = rc.logs.map((l) => { try { return padR.interface.parseLog(l); } catch { return null; } }).find((l) => l?.name === "TokenLaunched");
      toast("Token launched");
      location.hash = ev2 ? "#/t/" + ev2.args.token : "#/";
    } catch (e) { toast(errMsg(e), 7000); }
    btn.disabled = false;
  };
}

// ---------------------------------------------------------------- Token page
let tradeSide = "buy";
async function renderToken(addr) {
  if (!ethers.isAddress(addr)) return ($("#app").innerHTML = `<div class="card empty">Invalid token address</div>`);
  const app = $("#app");
  app.innerHTML = `<div class="muted">Loading…</div>`;
  // find which launchpad version created this token (getTokenInfo reverts for tokens it doesn't know)
  let info, P;
  for (const cand of livePads()) {
    try { info = await cand.c.getTokenInfo(addr); P = cand; break; } catch {}
  }
  if (!P) return (app.innerHTML = `<div class="card empty">Token not found on this launchpad.</div>`);
  const p = info, q = info.quote, Q = qsym(q), m = meta(info.metadata);
  const links = [["website", "Website"], ["x", "X"], ["telegram", "Telegram"]]
    .map(([k, l]) => safeUrl(m[k]) ? `<a href="${esc(safeUrl(m[k]))}" target="_blank" rel="noopener noreferrer">${l} ↗</a>` : "").filter(Boolean).join(" · ");

  app.innerHTML = `
    <div class="two">
      <div>
        <div class="card">
          <div class="row" style="gap:14px;align-items:flex-start;flex-wrap:nowrap">
            ${avatar(info, "lg")}
            <div style="min-width:0">
              <div class="row"><h2 style="margin:0">${esc(info.name)}</h2>${pill(q)}</div>
              <div class="mono muted">$${esc(info.symbol)} · <a href="${CONFIG.explorer}/token/${addr}" target="_blank" rel="noopener">${short(addr)} ↗</a></div>
              <div class="stat">Created by <a class="mono" href="${CONFIG.explorer}/address/${p.creator}" target="_blank" rel="noopener">${short(p.creator)}</a> · ${ago(p.createdAt)} · launchpad v${P.version}</div>
              ${links ? `<div class="links">${links}</div>` : ""}
              <div class="row ext" style="margin-top:8px">
                <a class="btn" href="https://gmgn.ai/robinhood/token/${addr}" target="_blank" rel="noopener noreferrer">GMGN ↗</a>
                <a class="btn" href="https://dexscreener.com/robinhood/${addr}" target="_blank" rel="noopener noreferrer">DexScreener ↗</a>
                <a class="btn" href="${(CONFIG.audits.tokens[addr.toLowerCase()] || CONFIG.audits.launchpad).url}" target="_blank" rel="noopener noreferrer" title="${esc((CONFIG.audits.tokens[addr.toLowerCase()] || CONFIG.audits.launchpad).result)}">Audit ↗</a>
              </div>
            </div>
          </div>
          ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ""}
        </div>
        <div class="stats q">
          <div class="card"><div class="k">Market cap</div><div class="v">${usd(info.marketCap, q)}</div><div class="stat">${fmt(info.marketCap)} ${Q}</div></div>
          <div class="card"><div class="k">Price</div><div class="v">${quoteUsd(q) ? fmtUsd(priceOf(info.sqrtPriceX96, info.quoteIsCurrency0) * quoteUsd(q)) : priceOf(info.sqrtPriceX96, info.quoteIsCurrency0).toPrecision(4) + " " + Q}</div></div>
          <div class="card"><div class="k">Liquidity</div><div class="v">Locked forever</div></div>
          <div class="card"><div class="k">Earned by holders</div><div class="v">${usd(info.totalDividendsDistributed + info.pendingHolderFees, q)}</div><div class="stat">paid in ${Q}</div></div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="row"><span class="h" style="margin:0">Price</span><span class="spacer"></span><span class="stat">USD per token</span></div>
          <svg class="chart" id="chart" viewBox="0 0 600 200" preserveAspectRatio="none"></svg>
        </div>
        <div class="card" style="margin-top:14px">
          <span class="h">Trades</span>
          <div class="scroll-x"><table><thead><tr><th>Type</th><th>Trader</th><th>Value</th><th>Tokens</th><th>Tx</th></tr></thead>
          <tbody id="trades"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody></table></div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="tabs"><button class="buy" data-s="buy">Buy</button><button class="sell" data-s="sell">Sell</button></div>
          ${q !== ZERO ? `<div class="row" style="margin-bottom:10px"><span class="stat" id="vial">Pay with</span><span class="spacer"></span><div class="seg" id="via"><button type="button" data-v="eth">ETH</button><button type="button" data-v="imd">IMD</button></div></div>` : ""}
          <label for="amt" style="margin-top:0" id="amtl"></label>
          <input id="amt" inputmode="decimal" placeholder="0.0" />
          <div class="quick" id="quick"></div>
          <div class="stat" id="bal" style="margin-top:8px"></div>
          <div class="preview" id="pv">&nbsp;</div>
          <label for="slip">Max slippage (%)</label><input id="slip" value="5" inputmode="decimal" />
          <button class="primary full" id="trade" style="margin-top:14px"></button>
          <div class="fees">4% fee: 1% protocol, 3% to holders of $${esc(info.symbol)}.</div>
        </div>
        <div class="card" style="margin-top:14px">
          <span class="h">Your holder rewards</span>
          <div id="pos" class="stat" style="margin-top:6px">Connect a wallet to see your balance and rewards.</div>
          <button class="full" id="claim" disabled>Claim</button>
          <a class="stat" href="#/rewards" style="display:block;margin-top:10px;text-decoration:underline;text-underline-offset:3px">All my rewards →</a>
        </div>
      </div>
    </div>`;

  const routerW = () => new ethers.Contract(P.router, ROUTER_ABI, signer);
  const tokR = new ethers.Contract(addr, TOKEN_ABI, reader);
  let tokBal = 0n, quoteBal = 0n, ethBal = 0n;
  // IMD pairs can be traded with ETH through PepesFamilyEthRouter (ETH <-> IMD <-> token in one tx).
  // Only offered once the router's code is confirmed on-chain, so ETH can never be sent to an empty address.
  let viaEth = q !== ZERO && P.ethLive;
  if (q !== ZERO && !viaEth) $("#via")?.parentElement.remove();
  const payUnit = () => (q === ZERO || viaEth ? "ETH" : "IMD");
  const ethRouterW = () => new ethers.Contract(P.ethRouter, ETH_ROUTER_ABI, signer);

  async function loadPosition() {
    if (!account) return;
    const qBalP = q === ZERO ? reader.getBalance(account) : new ethers.Contract(q, ERC20_ABI, reader).balanceOf(account);
    const [b, d, w, qb, eb] = await Promise.all([tokR.balanceOf(account), tokR.withdrawableDividendOf(account), tokR.withdrawnDividends(account), qBalP, reader.getBalance(account)]);
    tokBal = b; quoteBal = qb; ethBal = eb;
    const share = Number((b * 1000000n) / SUPPLY) / 10000;
    $("#pos").innerHTML = `Holding <b>${fmt(b)}</b> $${esc(info.symbol)} (${share}% of supply)<br/>
      Claimable: <b>${fmt(d, 6)} ${Q}</b> · Claimed so far: ${fmt(w, 6)} ${Q}`;
    $("#claim").disabled = d === 0n;
    setSide(tradeSide);
  }

  function setSide(s) {
    tradeSide = s;
    app.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
    const buying = s === "buy";
    app.querySelectorAll("#via button").forEach((b) => b.classList.toggle("on", (b.dataset.v === "eth") === viaEth));
    if ($("#vial")) $("#vial").textContent = buying ? "Pay with" : "Receive in";
    $("#amtl").textContent = buying ? `Amount (${payUnit()})` : `Amount ($${info.symbol})`;
    $("#trade").textContent = buying ? `Buy $${info.symbol}` : `Sell $${info.symbol}`;
    const payBal = payUnit() === "ETH" ? ethBal : quoteBal;
    $("#bal").textContent = account ? `Balance: ${fmt(buying ? payBal : tokBal)} ${buying ? payUnit() : "$" + info.symbol}` : "";
    const opts = buying ? (payUnit() === "ETH" ?["0.01", "0.05", "0.1", "0.5"] : ["1", "5", "10", "50"]) : ["25%", "50%", "75%", "100%"];
    $("#quick").innerHTML = opts.map((o) => `<button type="button">${o}</button>`).join("");
    $("#quick").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const t = b.textContent;
      $("#amt").value = t.endsWith("%") ? ethers.formatUnits((tokBal * BigInt(parseInt(t))) / 100n, 18) : t;
      preview();
    });
    preview();
  }
  app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { $("#amt").value = ""; setSide(b.dataset.s); });
  app.querySelectorAll("#via button").forEach((b) => b.onclick = () => { viaEth = b.dataset.v === "eth"; $("#amt").value = ""; setSide(tradeSide); });

  let pvSeq = 0;
  async function preview() {
    const seq = ++pvSeq;
    let amt = 0n; try { amt = ethers.parseUnits($("#amt").value.trim() || "0", 18); } catch {}
    if (!amt) return ($("#pv").innerHTML = "&nbsp;");
    try {
      const buying = tradeSide === "buy";
      const out = q !== ZERO && viaEth
        ? await quoteSwapEth(P, addr, info.quoteIsCurrency0, buying, amt)
        : await quoteSwap(P, addr, info.quoteIsCurrency0, buying, amt);
      if (seq === pvSeq) $("#pv").textContent = `You receive ≈ ${fmt(out, 6)} ${buying ? "$" + info.symbol : payUnit()}`;
    } catch (e) { if (seq === pvSeq) $("#pv").textContent = "Can't quote this amount"; }
  }
  $("#amt").oninput = preview;

  $("#trade").onclick = async () => {
    const btn = $("#trade"); btn.disabled = true;
    try {
      await requireWallet();
      const amt = ethers.parseUnits($("#amt").value.trim() || "0", 18);
      if (!amt) throw new Error("Enter an amount");
      const slipBps = Math.round(Math.min(50, Math.max(0, parseFloat($("#slip").value) || 0)) * 100);
      let tx;
      if (q !== ZERO && viaEth) {
        const buying = tradeSide === "buy";
        const expected = await quoteSwapEth(P, addr, info.quoteIsCurrency0, buying, amt);
        if (buying) {
          toast("Confirm in your wallet…", 8000);
          tx = await ethRouterW().buyWithEth(addr, withSlippage(expected, slipBps), deadline(), { value: amt });
        } else {
          const dl = deadline();
          const sig = await authorizeSell(P, addr, P.ethRouter, amt, dl);
          toast("Confirm in your wallet…", 8000);
          tx = sig
            ? await ethRouterW().sellForEthWithPermit(addr, amt, withSlippage(expected, slipBps), dl, sig.v, sig.r, sig.s)
            : await ethRouterW().sellForEth(addr, amt, withSlippage(expected, slipBps), dl);
        }
      } else if (tradeSide === "buy") {
        const expected = await quoteSwap(P, addr, info.quoteIsCurrency0, true, amt);
        if (q !== ZERO) await ensureImdAllowance(amt, P.router);
        toast("Confirm in your wallet…", 8000);
        tx = await routerW().buy(addr, amt, withSlippage(expected, slipBps), deadline(), { value: q === ZERO ? amt : 0n });
      } else {
        const expected = await quoteSwap(P, addr, info.quoteIsCurrency0, false, amt);
        const dl = deadline();
        // v1 tokens let their router sell without approval; v2 tokens use a permit signature (or an approval)
        const sig = P.permit ? await authorizeSell(P, addr, P.router, amt, dl) : null;
        toast("Confirm in your wallet…", 8000);
        tx = sig
          ? await routerW().sellWithPermit(addr, amt, withSlippage(expected, slipBps), dl, sig.v, sig.r, sig.s)
          : await routerW().sell(addr, amt, withSlippage(expected, slipBps), dl);
      }
      toast("Transaction sent…", 15000);
      await tx.wait();
      toast(tradeSide === "buy" ? "Bought" : "Sold");
      renderToken(addr);
    } catch (e) { toast(errMsg(e), 7000); }
    btn.disabled = false;
  };

  $("#claim").onclick = async () => {
    try {
      await requireWallet();
      const tx = await new ethers.Contract(addr, TOKEN_ABI, signer).claim();
      toast("Claiming…", 15000);
      await tx.wait();
      toast("Rewards claimed");
      loadPosition();
    } catch (e) { toast(errMsg(e), 7000); }
  };

  setSide(tradeSide);
  loadPosition().catch(() => {});
  loadTrades(P, addr, info).catch((e) => ($("#trades").innerHTML = `<tr><td colspan="5" class="muted">${esc(errMsg(e))}</td></tr>`));
}

/// Trade logs for `addr`, oldest first. Blockscout's API has full history and CORS; the RPC is a fallback
/// because free RPCs cap eth_getLogs ranges (a few minutes of blocks on this fast chain).
async function fetchTradeLogs(P, addr, createdBlock) {
  const padC = P.c;
  const tradeTopic = padC.interface.getEvent("Trade").topicHash;
  try {
    const url = `${CONFIG.blockscoutApi}/addresses/${P.pad}/logs?topic=${ethers.zeroPadValue(addr, 32)}`;
    const items = [];
    let next = null;
    for (let page = 0; page < 6; page++) {
      const q = next ? "&" + new URLSearchParams(next).toString() : "";
      const r = await fetch(url + q, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("blockscout " + r.status);
      const j = await r.json();
      items.push(...j.items);
      if (!j.next_page_params) break;
      next = j.next_page_params;
    }
    return items
      .filter((i) => i.topics[0] === tradeTopic && i.topics[1]?.toLowerCase() === ethers.zeroPadValue(addr, 32).toLowerCase())
      .map((i) => ({ ...padC.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args.toObject(), hash: i.transaction_hash }))
      .reverse();
  } catch (e) {
    console.warn("Blockscout unavailable, using RPC for recent trades", e);
    const latest = await reader.getBlockNumber();
    const CHUNK = 900, MAX_CHUNKS = 8;
    const from = Math.max(Number(createdBlock), latest - CHUNK * MAX_CHUNKS);
    const logs = [];
    for (let start = from; start <= latest; start += CHUNK) {
      logs.push(...(await padC.queryFilter(padC.filters.Trade(addr), start, Math.min(start + CHUNK - 1, latest))));
    }
    return logs.map((l) => ({ ...l.args.toObject(), hash: l.transactionHash }));
  }
}

async function loadTrades(P, addr, info) {
  const trades = await fetchTradeLogs(P, addr, info.createdBlock);
  $("#trades").innerHTML = trades.length ? trades.slice(-50).reverse().map((t) => `
    <tr><td class="${t.isBuy ? "b" : "s"}">${t.isBuy ? "Buy" : "Sell"}</td>
    <td class="mono"><a href="${CONFIG.explorer}/address/${t.trader}" target="_blank" rel="noopener">${short(t.trader)}</a></td>
    <td title="${fmt(t.quoteAmount, 6)} ${qsym(info.quote)}">${usd(t.quoteAmount, info.quote)}</td><td>${fmt(t.tokenAmount)}</td>
    <td><a href="${CONFIG.explorer}/tx/${t.hash}" target="_blank" rel="noopener">↗</a></td></tr>`).join("")
    : `<tr><td colspan="5" class="muted">No trades yet</td></tr>`;

  // price series: launch price, then price after each trade
  const startSqrt = trades.length ? null : info.sqrtPriceX96;
  const pts = startSqrt ? [priceOf(startSqrt, info.quoteIsCurrency0)] : trades.map((t) => priceOf(t.sqrtPriceX96, info.quoteIsCurrency0));
  drawChart(pts.map((x) => x * (quoteUsd(info.quote) || 1)));
}

function drawChart(pts) {
  const svg = $("#chart"); if (!svg) return;
  if (pts.length < 2) pts = [pts[0], pts[0]];
  const W = 600, H = 200, pad = 10;
  const min = Math.min(...pts), max = Math.max(...pts), span = max - min || max || 1;
  const xy = pts.map((v, i) => [pad + (i * (W - 2 * pad)) / (pts.length - 1), H - pad - ((v - min) / span) * (H - 2 * pad)]);
  const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  const up = pts[pts.length - 1] >= pts[0];
  const c = up ? "var(--accent)" : "var(--down)";
  svg.innerHTML = `<path d="${d}L${W - pad},${H - pad}L${pad},${H - pad}Z" fill="${c}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

Promise.all([loadPads(), loadPrices()]).finally(() => {
  route();
  // status bar totals on every page (the home page also loads them for its cards)
  if (location.hash.slice(1).replace(/^$/, "/") !== "/") loadTotals().catch(() => {});
});
setInterval(loadPrices, 60_000);
