# Cloudflare deploys this from the GitHub repo (Workers Builds, root directory hall-server/), or `npx wrangler deploy`
# here. deploy.sh does the same with curl.
name = "pepesfamily"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HALL"
class_name = "Hall"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hall"]
