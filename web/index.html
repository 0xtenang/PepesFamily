<style>
/* PepesFamily app. Style: true-black flat (tasteskill app sheet, seed 1669543942).
   Elevation by lightness alone: #000 ground, #111 card, #2a2a2a nested panel; no borders or shadows on cards.
   The one data hue is Pepe's green, on data only (prices up, the chart line, a buy); never on buttons, tabs or nav.
   Primary actions are inverted: a white pill with black text. Grid: 220px sidebar + canvas with 28px gutters,
   one 14px gap everywhere. */
:root {
  --ground: #000000; --surface: #111111; --raised: #1c1c1c; --nested: #2a2a2a;
  --border: #1a1a1a; --rule: #1a1a1a; --control: #444444;
  --text: #ffffff; --muted: #b4b4b4; --faint: #949494; --nav: #bbbbbb;
  --accent: #8fd66a; --positive: #8fd66a; --negative: #ff5c61; --warning: #e5a93b;
  --pill-positive-bg: #1d2a14; --pill-negative-bg: #2c1a1c; --pill-warning-bg: #2b2414;
  --radius-card: 20px; --radius-nested: 12px; --radius-control: 999px;
  --gap: 14px; --pad: 22px; --gutter: 28px; --control-height: 36px; --sidebar: 220px; --topbar: 64px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ground); }
body { margin: 0; color: var(--text); font: 14px/20px var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--font); font-variant-numeric: tabular-nums; }
.num, .v, .r, td, .mc, .amt, .pv { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; line-height: 24px; font-weight: 600; margin: 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
a, button, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2 { text-wrap: balance; }
.skip { position: fixed; left: 12px; top: -48px; z-index: 50; background: #fff; color: #000; padding: 8px 14px; border-radius: 999px; font-weight: 600; }
.skip:focus { top: 12px; }
.modal .card { overscroll-behavior: contain; }

/* controls: pills; secondary = outlined, primary = inverted white */
button, .btn {
  font: inherit; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--control-height); padding: 7px 16px; border-radius: var(--radius-control);
  border: 1px solid var(--control); background: transparent; color: var(--text); white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}
button:hover, .btn:hover { border-color: #6a6a6a; background: var(--raised); }
button:active, .btn:active { transform: scale(.98); }
button.primary, .btn.primary { background: #fff; border-color: #fff; color: #000; font-weight: 600; }
button.primary:hover, .btn.primary:hover { background: #e6e6e6; border-color: #e6e6e6; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button.icon { border: 0; min-height: 0; padding: 6px; }
.full { width: 100%; margin-top: 8px; }
input, textarea, select {
  font: inherit; width: 100%; min-height: 40px; padding: 9px 14px; border: 1px solid var(--control); background: var(--ground); color: var(--text); border-radius: var(--radius-nested);
}
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus { outline: none; border-color: #fff; }
textarea { min-height: 96px; resize: vertical; }
label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin: 16px 0 8px; }

/* shell: ruled T-frame */
.side { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 0 12px 16px; z-index: 10; background: var(--ground); }
.brand { display: flex; align-items: center; gap: 10px; height: var(--topbar); padding: 0 10px; font-weight: 600; font-size: 16px; }
.brand svg { width: 28px; height: 28px; flex: none; }
.navs { display: flex; flex-direction: column; gap: 0; margin-top: 12px; }
.navs a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; color: var(--nav); border-radius: 8px; }
.navs a svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
.navs a:hover { color: #fff; }
.navs a.on { color: #fff; font-weight: 500; }
.side .glabel { font-size: 12px; color: var(--faint); padding: 0 10px; margin: 28px 0 6px; }
.side .chainrow { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; color: var(--nav); }
.side .foot { margin-top: auto; display: flex; flex-direction: column; }
.side .foot a { height: 30px; display: flex; align-items: center; padding: 0 10px; color: var(--faint); font-size: 13px; }
.side .foot a:hover { color: #fff; }
.top { position: sticky; top: 0; z-index: 9; margin-left: var(--sidebar); height: var(--topbar); display: flex; align-items: center; gap: 16px; padding: 0 var(--gutter); background: var(--ground); border-bottom: 1px solid var(--rule); }
.top .mark { display: none; }
.search { flex: 1; max-width: 520px; position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); stroke: var(--faint); fill: none; stroke-width: 1.8; pointer-events: none; }
.search input { min-height: 36px; padding: 7px 14px 7px 38px; border-radius: var(--radius-control); background: var(--surface); border-color: var(--surface); }
.search input:focus { border-color: var(--control); }
.top .acct { margin-left: auto; display: flex; align-items: center; gap: 12px; height: 100%; padding-left: 16px; border-left: 1px solid var(--rule); }
#connect.addr { font-variant-numeric: tabular-nums; }
main#app { margin-left: var(--sidebar); padding: 24px var(--gutter) 64px; max-width: calc(var(--sidebar) + 1320px); }
.tabbar { display: none; }
@media (max-width: 1000px) {
  .side { display: none; }
  .top, main#app { margin-left: 0; }
  .top { height: 56px; padding: 0 16px; gap: 10px; }
  .top .mark { display: block; width: 30px; height: 30px; flex: none; }
  .top .acct { border-left: 0; padding-left: 0; }
  main#app { padding: 16px 16px 96px; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--ground);
    border-top: 1px solid var(--rule); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 12px; color: var(--nav); }
  .tabbar a svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .tabbar a.on { color: #fff; }
}
@media (max-width: 420px) { #connect { padding: 7px 12px; } #connect .a1 { display: none; } }

/* title row */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.hero p { color: var(--muted); margin: 4px 0 0; }
.trow-title { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.trow-title .sub { color: var(--muted); margin-top: 4px; }
.stamp { color: var(--faint); font-size: 12px; }
.hsec { display: flex; align-items: baseline; gap: 12px; margin: 32px 0 10px; }
.hsec .stat { margin-left: auto; }

/* surfaces */
.card { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); border: 0; }
.card + .card { margin-top: var(--gap); }
.two > .card + .card { margin-top: 0; }
.stats + .card, .stats + div > .card:first-child { margin-top: var(--gap); }
.card.empty, .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.nested { background: var(--nested); border-radius: var(--radius-nested); padding: 14px 16px; }
.stat { font-size: 13px; color: var(--muted); }
.stat b { color: var(--text); font-weight: 500; }
.stat.ok { color: var(--positive); } .stat.warn { color: var(--warning); }
.h { display: block; font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.desc { white-space: pre-wrap; word-break: break-word; color: var(--muted); margin: 14px 0 0; }
.links { display: flex; gap: 14px; margin-top: 8px; }
.links a, a.lnk { color: var(--text); text-decoration: underline; text-decoration-color: var(--control); text-underline-offset: 3px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); z-index: 40; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); } /* taste-skill-ignore: the toast floats */
@media (max-width: 1000px) { .toast { bottom: 84px; } }
.pill { display: inline-flex; align-items: center; flex: none; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--nested); color: var(--text); white-space: nowrap; }
.pill.pos { background: var(--pill-positive-bg); color: var(--positive); }
.pill.neg { background: var(--pill-negative-bg); color: var(--negative); }
.pill.warn { background: var(--pill-warning-bg); color: var(--warning); }
.up { color: var(--positive); } .dn { color: var(--negative); } .flat { color: var(--faint); }
.chg { font-weight: 500; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.skel { background: var(--raised); border-radius: 6px; }

/* avatars: tokens are circles */
.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; background: var(--nested); display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--muted); overflow: hidden; }
.avatar.lg { width: 64px; height: 64px; font-size: 18px; }

/* segmented track and underline tabs (selection = brightness, never the hue) */
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none; flex: none; }
.seg.wrap { flex-wrap: wrap; border-radius: 18px; overflow: visible; } /* pickers whose every choice must stay visible (five chains) */
.card .seg { background: var(--ground); }
.seg button { border: 0; min-height: 30px; padding: 5px 14px; color: var(--nav); font-size: 13px; background: transparent; }
.seg button:hover { color: #fff; background: transparent; }
.seg button.on { background: var(--nested); color: #fff; }
.utabs { display: flex; gap: 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.utabs::-webkit-scrollbar, .seg::-webkit-scrollbar, .trend::-webkit-scrollbar { display: none; }
.utabs button { border: 0; border-radius: 0; min-height: 44px; padding: 0; color: var(--nav); background: transparent; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utabs button:hover { background: transparent; color: #fff; }
.utabs button.on { color: #fff; border-bottom-color: #fff; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; margin-bottom: 16px; background: var(--ground); border-radius: 999px; }
.tabs button { border: 0; color: var(--nav); min-height: 34px; }
.tabs button:hover { background: transparent; color: #fff; }
.tabs button.on { background: var(--nested); color: #fff; }
.quick { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.quick button { min-height: 30px; padding: 4px 12px; font-size: 13px; }
#from, #ibfrom { width: auto; max-width: 100%; min-height: 34px; padding: 6px 12px; border-radius: 999px; font-size: 13px; background: var(--ground); }

/* KPI strip: one container split by dividers */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-radius: var(--radius-card); }
.kpis > div { padding: 18px var(--pad); min-width: 0; }
.kpis > div + div { border-left: 1px solid var(--border); }
.kpis .k { font-size: 13px; color: var(--muted); }
.kpis .v { font-size: 24px; line-height: 32px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis .s { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 700px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpis > div + div { border-left: 0; }
  .kpis > div:nth-child(even) { border-left: 1px solid var(--border); }
  .kpis > div:nth-child(n+3) { border-top: 1px solid var(--border); }
  .kpis .v { font-size: 20px; line-height: 28px; }
}
/* generic stats grid (token page, rewards, admin) uses the same divided container */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--surface); border-radius: var(--radius-card); margin-top: var(--gap); overflow: hidden; }
.stats .card { background: transparent; border-radius: 0; padding: 16px var(--pad); margin: 0; border-left: 1px solid var(--border); }
.stats .card:first-child { border-left: 0; }
.stats.q { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1280px) { .stats.q { grid-template-columns: 1fr 1fr; } .stats.q .card:nth-child(odd) { border-left: 0; } .stats.q .card:nth-child(n+3) { border-top: 1px solid var(--border); } }
.stats .k { font-size: 13px; color: var(--muted); }
.stats .v { font-size: 20px; line-height: 28px; font-weight: 600; margin-top: 2px; }

/* Trending: peer token cards, one row */
.trend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); }
@media (max-width: 1300px) { .trend { grid-template-columns: repeat(3, minmax(0, 1fr)); } .trend > :nth-child(n+4) { display: none; } }
@media (max-width: 700px) { .trend { grid-template-columns: 1fr 1fr; gap: 10px; } .trend > :nth-child(n+3) { display: none; } .tc { padding: 14px; gap: 10px; } .tc .avatar { width: 36px; height: 36px; } .tc .mc { font-size: 20px; line-height: 28px; } .tc > .meta, .tc .ch { display: none; } }
.tc { scroll-snap-align: start; display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: var(--radius-card); background: var(--surface); min-width: 0; transition: background .12s; }
.tc:hover { background: var(--raised); }
.tc .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.tc .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.tc .mc { font-size: 24px; line-height: 32px; font-weight: 600; }

/* Discover: list + live trades rail */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: var(--gap); align-items: stretch; }
.dgrid > .listcard { display: flex; flex-direction: column; }
.dgrid > .listcard #list { flex: 1; }
.rail { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
.rail .tapecard { flex: 1 1 0; min-height: 420px; display: flex; flex-direction: column; padding: 0; }
.rail .tapecard .tape { flex: 1 1 0; min-height: 0; max-height: none; }
@media (max-width: 1180px) { .dgrid { grid-template-columns: 1fr; } .rail .tapecard { flex: none; } .rail .tapecard .tape { max-height: 460px; flex: none; } }
.listcard { padding: 4px 0 6px; }
.listcard .tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 var(--pad); }
.listcard .tools .utabs { flex: 1 1 340px; min-width: 0; }
.thead, .lrow { display: grid; grid-template-columns: 26px 48px minmax(0, 1fr) 112px 104px 76px 72px; gap: 12px; align-items: center; padding: 0 var(--pad); }
.thead { height: 40px; font-size: 12px; color: var(--faint); }
.thead span:nth-child(n+4), .lrow .r { text-align: right; }
.lrow { min-height: 72px; transition: background .1s; }
.lrow:hover { background: var(--raised); }
.lrow .rk { color: var(--faint); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.lrow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow .nm b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pfmark { width: 16px; height: 16px; flex: none; vertical-align: -3px; margin-left: 2px; }
.lrow .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.lrow .r { font-weight: 500; }
.lrow .r.dim { color: var(--muted); font-weight: 400; }
.lrow .act { justify-self: end; min-height: 32px; padding: 5px 16px; border: 1px solid var(--control); border-radius: 999px; font-size: 13px; font-weight: 500; }
.lrow:hover .act { background: #fff; color: #000; border-color: #fff; }
.more { display: flex; justify-content: center; padding: 10px; }
@media (max-width: 700px) {
  .thead { display: none; }
  .lrow { grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px; min-height: 68px; padding: 10px 16px; }
  .lrow .rk, .lrow .vol, .lrow .act { display: none; }
  .lrow .avatar { grid-row: 1 / 3; width: 44px; height: 44px; }
  .lrow .tn { grid-row: 1 / 3; }
  .lrow .mcc { grid-column: 3; grid-row: 1; }
  .lrow .chgc { grid-column: 3; grid-row: 2; font-size: 13px; }
  .listcard .tools { padding: 0 16px; flex-direction: column; align-items: stretch; gap: 10px; }
  .listcard .tools .seg { align-self: flex-start; }
}
.rail h2 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.tape { padding: 6px 0; max-height: 820px; overflow-y: auto; scrollbar-width: thin; }
.fi { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 0 18px; transition: background .1s; }
.fi:hover { background: var(--raised); }
.fi.new { animation: arrive .9s ease-out; }
@keyframes arrive { from { background: var(--nested); } }
@media (prefers-reduced-motion: reduce) { .fi.new { animation: none; } }
.fi .avatar { width: 36px; height: 36px; font-size: 11px; }
.fi .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi .w { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi .amt { text-align: right; font-weight: 500; }
.fi .amt .w { text-align: right; }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--positive); }
.official { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.official .ca { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--muted); }
.official .ca code { font-family: var(--font); word-break: break-all; }
.pfoot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--faint); font-size: 13px; }
.pfoot a:hover { color: #fff; }

/* two-column pages (token, launch, rewards): the side panel sticks */
.two { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: var(--gap); align-items: start; }
.two > .mside, .two > aside { position: sticky; top: calc(var(--topbar) + 16px); }
@media (max-width: 1000px) {
  .two { grid-template-columns: 1fr; }
  .two > .mside, .two > aside { position: static; }
  .mfirst { display: flex; flex-direction: column; gap: 0; }
  .mfirst .mflat { display: contents; }
  .mfirst .mflat > *, .mfirst > .mrest { order: 3; }
  .mfirst .mflat > .mlead { order: 1; }
  .mfirst .mside { order: 2; margin: var(--gap) 0; }
}
.thead-token { display: flex; gap: 16px; align-items: center; }
.price-big { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -.01em; }
.chart { width: 100%; height: 240px; display: block; margin-top: 8px; }
.preview { margin: 14px 0 4px; font-size: 14px; }
.fees { font-size: 13px; color: var(--muted); margin-top: 16px; }
.safety { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; font-size: 14px; }
.safety li { display: flex; align-items: center; gap: 8px; }
.safety li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.safety li.dn { color: var(--negative); } .safety li.dn::before { background: var(--negative); }
.safety li.wn { color: var(--warning); } .safety li.wn::before { background: var(--warning); }
.safety li.okk::before { background: var(--positive); }
.ext { gap: 8px; }
.ext .btn { min-height: 30px; padding: 4px 12px; font-size: 13px; }

/* tables: rules and alignment */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th { color: var(--faint); font-weight: 400; font-size: 12px; border-bottom-color: #262626; padding-top: 8px; padding-bottom: 8px; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; }
.b { color: var(--positive); } .s { color: var(--negative); }
.scroll-x { overflow-x: auto; }

/* grids of cards on other pages */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--gap); }
.tcard { display: flex; gap: 12px; transition: background .12s; }
.tcard:hover { background: var(--raised); }
.tcard .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; font-size: 12px; font-weight: 500; padding: 0 9px 0 8px; border-radius: 999px; background: var(--nested); white-space: nowrap; flex: none; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* launch form */
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.presets button { display: block; text-align: left; white-space: normal; border: 1px solid transparent; background: var(--nested); color: var(--text); padding: 12px 14px; border-radius: var(--radius-nested); min-height: 0; }
.presets button:hover { background: #333; }
.presets button.on { border-color: #fff; }
.splitrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.splitrow > div { flex: 1; min-width: 100px; }
.imgrow { display: flex; gap: 12px; align-items: flex-start; }
.imgprev { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--nested); display: grid; place-items: center; color: var(--faint); overflow: hidden; }
.imgprev img { width: 100%; height: 100%; object-fit: cover; }
.imgrow.drag .imgprev { outline: 2px dashed #fff; }
.warn-box { margin-top: 8px; padding: 10px 14px; border-radius: var(--radius-nested); background: var(--pill-warning-bg); color: var(--warning); font-size: 13px; }
.card.warnbox { background: var(--pill-warning-bg); }
.warn-box.neg { background: var(--pill-negative-bg); color: var(--negative); }

/* rewards, share cards */
.sharegrid { grid-template-columns: minmax(0, 600px) 1fr; }
@media (max-width: 1000px) { .sharegrid { grid-template-columns: 1fr; } }
.share-img { width: 100%; aspect-ratio: 1200 / 675; display: block; border-radius: var(--radius-nested); background: #000; }
.sharebtn { margin-top: 6px; min-height: 28px; padding: 3px 10px; font-size: 12px; }
#rf input { flex: 1; min-width: 0; }

/* mint */
.mint-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--gap); align-items: start; }
.mint-pics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mint-pics img, .mint-mine img { width: 100%; aspect-ratio: 1; display: block; background: var(--nested); border-radius: var(--radius-nested); }
.mint-bar { height: 8px; background: var(--nested); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.mint-bar i { display: block; height: 100%; background: var(--accent); }
.mint-mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.mint-mine figure { margin: 0; font-size: 13px; }
@media (max-width: 760px) { .mint-top { grid-template-columns: 1fr; } }

/* wallet picker */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .7); display: grid; place-items: center; }
.modal .card { width: min(360px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; background: var(--raised); box-shadow: 0 20px 60px rgba(0,0,0,.6); } /* taste-skill-ignore: a dialog floats */
.modal .card.big { width: min(480px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; }
.wopt { justify-content: flex-start; gap: 12px; width: 100%; min-height: 48px; border-radius: var(--radius-nested); }
.wopt img { width: 24px; height: 24px; }
</style>

/// withdrawnDividends counts them too, so "claimed" = withdrawnDividends - this. Null if the history can't be read.
const RECYCLED_TOPIC = ethers.id("RewardsRecycled(address,uint256)");
async function recycledOf(token, holder, ch = CHAINS.robinhood, attempt = 0) {
  if (!ch.blockscoutApi) return null; // no event history on this chain (BSC, HyperEVM): unknown
  const want = ethers.zeroPadValue(holder, 32).toLowerCase();
  try {
    let total = 0n, next = null;
    for (let page = 0; page < 20; page++) {
      const r = await fetch(`${ch.blockscoutApi}/addresses/${token}/logs?topic=${RECYCLED_TOPIC}` + (next ? "&" + new URLSearchParams(next) : ""),
        { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("blockscout " + r.status);
      const j = await r.json();
      for (const i of j.items) if (i.topics[0] === RECYCLED_TOPIC && i.topics[1]?.toLowerCase() === want) total += BigInt(i.data);
      if (!j.next_page_params) return total;
      next = j.next_page_params;
    }
    return total;
  } catch {
    // Blockscout rate-limits bursts (the Rewards page asks for every token at once): retry a couple of times.
    if (attempt < 2) {
      await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
      return recycledOf(token, holder, ch, attempt + 1);
    }
    // Fallback: the RPC, filtered by holder (works where the node allows the whole range).
    try {
      const logs = await ch.reader.getLogs({ address: token, topics: [RECYCLED_TOPIC, want], fromBlock: 0, toBlock: "latest" });
      return logs.reduce((t, l) => t + BigInt(l.data), 0n);
    } catch { return null; }
  }
}

      const [name, nonce] = await Promise.all([tok.name(), tok.nonces(account)]);
      toast("Sign the approval in your wallet (no gas)…", 8000);
      const sig = await signer.signTypedData(
        { name, version: "1", chainId: P.ch.chainId, verifyingContract: token },
        { Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }] },
        { owner: account, spender, value: amount, nonce, deadline: dl },
      );
      const s = ethers.Signature.from(sig);
      return { v: s.v, r: s.r, s: s.s };
    } catch (e) {
      if (e?.code === "ACTION_REJECTED" || e?.code === 4001) throw e; // user said no
      // wallet can't sign typed data: fall back to a normal approval

  toast("Approve the token for selling in your wallet…", 8000);
  await (await tok.approve(spender, amount)).wait();
  return null;
}

// ---------------------------------------------------------------- Pay from any chain (Relay)
// A launch or buy on one chain, paid with ETH, HYPE or a dollar coin on another: Relay's solver delivers the coin to
// that chain's PepesFamilyRemote and calls it with the user's address in the same transaction (launchFor / buyFor),
// paid back from the deposit the user signs on their own chain. The user gets the tokens, the creator role and a
// little gas on the destination chain, without bridging or switching networks.
const REMOTE_IFACE = new ethers.Interface([
  "function launchFor(address pad, address creator, string name, string symbol, string metadata, (uint16 creatorBps, uint16 holderBps, uint16 burnBps) split, uint256 buyValue, uint256 minTokens, uint256 gasDrop) payable returns (address token, uint256 tokens)",
  "function buyFor(address pad, address token, address buyer, uint256 minTokens, uint256 gasDrop) payable returns (uint256 tokens)",
  "event LaunchedFor(address indexed pad, address indexed token, address indexed creator, uint256 spent, uint256 tokens)",
  "event BoughtFor(address indexed pad, address indexed token, address indexed buyer, uint256 spent, uint256 tokens)",
  "function creatorOf(address token) view returns (address)",

/// Gas left on the destination chain when the user has (almost) none there: enough to claim and sell a few times.
/// PepesFamily's own fees, all paid to `recipient` (the owner wallet):
///   swapBps  on buys and sells of tokens from other launchpads and DEXes, through Relay (100 = 1%)
///   xcBps    on payments made from another chain for our own launches and buys, through Relay (50 = 0.5%)
///   launchUsd  a flat launch fee, pump.fun style, in the launch chain's coin (none on testnets)
/// Relay keeps the app fees for `recipient` in USDC until claimed (relay.link app, free to claim on Base).
const FEES = { recipient: "0x3c8A4d94B3219F6633F2cC94094f4765b30c691C", swapBps: 100, xcBps: 50, launchUsd: 2 };

const nativeUsd = (ch) => (ch.testnet ? 0 : { ETH: prices.ethUsd, BNB: prices.bnbUsd, HYPE: prices.hypeUsd }[ch.native?.symbol || "ETH"] || 0);

/// `dest`'s own coin on `dest` (that is the direct way). Each: { id, ch, sym, addr, dec }.
function payOptions(dest) {
  const out = [];
  for (const c of Object.values(CHAINS)) for (const [sym, addr, dec] of c.pay || []) {
    if (c.key === dest.key && addr === ZERO_ADDR) continue;
    out.push({ id: `${c.key}:${addr}`, ch: c, sym, addr, dec });

const payFromSelect = (id, dest) => `<select id="${id}" aria-label="Pay from"><option value="">${esc(dest.native?.symbol || "ETH")} on ${esc(dest.short)} (your wallet there)</option>${payOptions(dest).map((o) => `<option value="${o.id}">${esc(o.sym)} on ${esc(o.ch.short)}</option>`).join("")}</select>`;
const payOptionById = (dest, id) => payOptions(dest).find((o) => o.id === id) || null;

/// Relay's API: through this site's proxy when it has one (it adds the API key), else Relay directly.
async function relayApi(path, body) {
  const opt = body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {};
  let r = null;
  try { r = await fetch("/api/relay?p=" + encodeURIComponent(path), { ...opt, signal: AbortSignal.timeout(20000) }); } catch {}
  if (!r || r.status === 404 || r.status === 405) r = await fetch("https://api.relay.link/" + path, { ...opt, signal: AbortSignal.timeout(20000) });
  const j = await r.json().catch(() => ({}));

}
/// A quote for running `data` with `value` of the destination coin on `dest`'s PepesFamilyRemote, paid with `o`.
/// `pre`: plain coin transfers on `dest` delivered in the same fill (the launch fee). Carries the app fee FEES.xcBps.
async function xcQuote(o, dest, value, data, pre = []) {
  const extra = pre.reduce((t, x) => t + x.value, 0n);
  return relayApi("quote/v2", {
    user: account || "0x000000000000000000000000000000000000dEaD", recipient: account || undefined,
    originChainId: o.ch.chainId, destinationChainId: dest.chainId, originCurrency: o.addr, destinationCurrency: ZERO_ADDR,
    amount: (value + extra).toString(), tradeType: "EXACT_OUTPUT", appFees: appFees(FEES.xcBps),
    txs: [...pre.map((x) => ({ to: x.to, value: x.value.toString(), data: "0x" })), { to: dest.remote, value: value.toString(), data }],
  });
}
/// "You pay ≈ 0.0123 ETH on Robinhood · fees ≈ $0.03 · ~2 s" for a quote.
function xcSummary(q) {
  const i = q.details?.currencyIn, f = q.fees || {};
  const fee = ["gas", "relayer", "app"].reduce((t, k) => t + Number(f[k]?.amountUsd || 0), 0);
  return `You pay ≈ ${Number(i?.amountFormatted || 0).toPrecision(4)} ${i?.currency?.symbol || ""} on ${esc(Object.values(CHAINS).find((c) => c.chainId === i?.currency?.chainId)?.short || "")}` +
    ` · fees ≈ ${fmtUsd(fee)}${q.details?.timeEstimate ? ` · ~${q.details.timeEstimate} s` : ""}`;
}
/// Signs the quote's steps on the paying chain, then waits for Relay to run the call; returns the destination
/// transaction hashes.
async function xcExecute(q, o, onStatus) {
  let check = null;
  for (const step of q.steps || []) {
    if (step.kind !== "transaction") throw new Error("This payment needs a signature type the site doesn't support yet: pay with the chain's coin instead.");
    for (const item of step.items || []) {
      if (item.status === "complete") continue;
      await requireWallet(o.ch);
      const d = item.data;
      onStatus?.(step.action || "Confirm in your wallet…");
      const tx = await signer.sendTransaction({ to: d.to, data: d.data, value: BigInt(d.value || 0), ...(d.gas ? { gasLimit: (BigInt(d.gas) * 13n) / 10n } : {}) });
      await tx.wait();
      if (item.check) check = item.check.endpoint;
    }
  }
  if (!check) throw new Error("Relay gave no way to follow this payment");
  onStatus?.("Paid. Delivering on the other chain…");
  for (let i = 0; i < 120; i++) {
    await new Promise((r) => setTimeout(r, 2500));
    const st = await relayApi(check.replace(/^\//, "")).catch(() => null);
    if (!st) continue;
    if (st.status === "success") return st.txHashes || [];
    if (st.status === "failure" || st.status === "refund" || st.status === "refunded") throw new Error(`The delivery didn't go through (${st.status}); Relay refunds the payment.`);
  }
  throw new Error("Still delivering after 5 minutes: check your wallet on the other chain shortly.");
}
/// Gas to leave the user on `dest`: GAS_DROP when they have less than that there, else none.
async function gasDropFor(dest) {
  const want = ethers.parseEther(GAS_DROP[dest.key] || "0");
  if (!want || !account) return want;
  try { return (await dest.reader.getBalance(account)) < want ? want : 0n; } catch { return want; }
}

const STATEVIEW_ABI = ["function getSlot0(bytes32 poolId) view returns (uint160 sqrtPriceX96, int24 tick, uint24 protocolFee, uint24 lpFee)"];
const prices = { ethUsd: 0, imdEth: 0, pepeEth: 0, cashcatEth: 0, hypeUsd: 0, bnbUsd: 0 };
/// ETH per token, from a Uniswap v4 ETH/token pool's price (both 18 decimals), read on its chain.
async function ethPerToken(ch, poolId) {
  const [sq] = await new ethers.Contract(ch.stateView, STATEVIEW_ABI, ch.reader).getSlot0(poolId);
  const r = Number(sq) / 2 ** 96;

async function loadPrices() {

  await Promise.all([

/// The USD price of `chainId`'s own coin: Relay first, then CoinGecko (`cgId`); 0 if neither answers.
async function coinUsd(chainId, cgId) {

const quoteUsd = (q) => {

function fmtUsd(n) {

const esc = (s) => str(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/// A token's creator-supplied metadata, keeping only plain string fields: anything else (objects, numbers, arrays)

function meta(json) {

function ipfsPath(u) {

  else {
    try {
      const x = new URL(u);
      const sub = x.hostname.match(/^([a-z0-9]{46,})\.ipfs\./i);
      p = x.pathname.startsWith("/ipfs/") ? x.pathname.slice(6) : sub ? sub[1] + x.pathname.replace(/^\/$/, "") : "";
    } catch {}
  }

}
function avatar(info, cls = "") {

// ---------------------------------------------------------------- Wallet
// Wallet discovery via EIP-6963, so MetaMask, Phantom, Rabby, OKX, ... can all be installed side by side and the
// visitor picks one. Falls back to window.ethereum for wallets that don't announce themselves.
const WALLETS = [];
window.addEventListener("eip6963:announceProvider", (e) => {
  const { info, provider } = e.detail || {};
  if (info?.uuid && provider && !WALLETS.some((w) => w.info.uuid === info.uuid)) WALLETS.push({ info, provider });
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

let WALLET = null, walletName = "Your wallet", listening = null;

/// Name of an injected (pre-EIP-6963) provider from its flags.
function legacyName(p) {
  if (p.isRabby) return "Rabby";
  if (p.isPhantom) return "Phantom";
  if (p.isOkxWallet || p.isOKExWallet) return "OKX Wallet";
  if (p.isCoinbaseWallet) return "Coinbase Wallet";
  if (p.isBraveWallet) return "Brave Wallet";
  if (p.isTrust || p.isTrustWallet) return "Trust Wallet";
  if (p.isMetaMask) return "MetaMask";
  return "Browser wallet";
}
/// Every wallet we can offer: EIP-6963 announcements first, then injected providers that didn't announce themselves
/// (window.ethereum and the `providers` list some extensions add), so older or late-loading wallets still show up.
async function walletOptions() {
  window.dispatchEvent(new Event("eip6963:requestProvider")); // wallets that loaded after the page
  await new Promise((ok) => setTimeout(ok, 250));
  const out = [...WALLETS];
  const injected = [...(Array.isArray(window.ethereum?.providers) ? window.ethereum.providers : []), window.ethereum].filter(Boolean);
  for (const p of injected) {
    if (out.some((w) => w.provider === p)) continue;
    const name = legacyName(p);
    // a wallet that announced itself under the same name is the same wallet (its injected object can differ)
    if (name !== "Browser wallet" && out.some((w) => w.info.name.toLowerCase().includes(name.toLowerCase()))) continue;
    out.push({ provider: p, info: { name, icon: "" } });
  }
  return out;
}

async function pickWallet() {
  const opts = await walletOptions();
  if (opts.length <= 1) return opts[0] || null;
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="card"><span class="h">Connect a wallet</span>
      ${opts.map((w, i) => `<button class="wopt" data-i="${i}">${/^data:image\//.test(w.info.icon || "") ? `<img src="${esc(w.info.icon)}" alt="" />` : ""}<span>${esc(w.info.name)}</span></button>`).join("")}
      <button class="wopt" data-cancel="1">Cancel</button></div>`;
    m.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b && ev.target !== m) return; // click inside the card, not on a button
      m.remove();
      resolve(b && b.dataset.i != null ? opts[Number(b.dataset.i)] : null);
    };
    document.body.appendChild(m);
  });
}

function listen(eth) {
  if (listening === eth) return;
  listening = eth;
  eth.on?.("accountsChanged", (accs) => {
    signer = null; account = null; $("#connect").textContent = "Connect wallet"; $("#connect").classList.remove("addr"); $("#adminlink").hidden = true;
    IS_ADMIN = false; 
    if (accs?.length) connect().catch(() => {});
  });
  // Switching network inside the wallet: the signer is rebuilt for the new network before the next action.
  eth.on?.("chainChanged", () => { signer = null; });

/// Connects the wallet and switches it to `ch` (Robinhood Chain by default). `quiet` skips the page re-render
/// (used when an action switches the network in the middle of a flow).
async function connect(ch = CHAINS.robinhood, quiet = false) {
  const picked = WALLET ? { provider: WALLET, info: { name: walletName } } : await pickWallet();
  if (!picked) {
    if (!WALLETS.length && !window.ethereum) toast("No wallet found. Install a browser wallet such as MetaMask, Rabby or Phantom.");
    return;
  }
  const eth = picked.provider;
  walletName = picked.info?.name || "Your wallet";
  // Ask for the account first: some wallets (Phantom) reject every other request until the site is authorized.
  await eth.request({ method: "eth_requestAccounts" });
  const hex = "0x" + ch.chainId.toString(16);
  if ((await eth.request({ method: "eth_chainId" })) !== hex) {
    try {
      await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
    } catch (e) {
      const code = e?.code ?? e?.data?.originalError?.code;
      if (code === 4001) throw e; // user said no
      try {
        await eth.request({ method: "wallet_addEthereumChain", params: [{
          chainId: hex, chainName: ch.name, rpcUrls: [ch.walletRpc],
          nativeCurrency: { ...(ch.native || { name: "Ether", symbol: "ETH" }), decimals: 18 }, blockExplorerUrls: [ch.explorer],
        }] });
        // Adding a network doesn't always select it (EIP-3085): ask to switch again.
        if ((await eth.request({ method: "eth_chainId" })) !== hex) {
          await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
        }
      } catch (e2) {
        if ((e2?.code ?? 0) === 4001) throw e2;
        throw new Error(`${walletName} couldn't switch to ${ch.name}. Select ${ch.name} in ${walletName} (chain ID ${ch.chainId}) and try again.`);
      }
    }
    // Never continue on another network: every wallet write that follows assumes `ch`.
    if ((await eth.request({ method: "eth_chainId" })) !== hex) {
      signer = null;
      throw new Error(`Your wallet is still on another network. Select ${ch.name} in ${walletName} (chain ID ${ch.chainId}) and try again.`);
    }
  }
  WALLET = eth;
  listen(eth);
  const provider = new ethers.BrowserProvider(eth);
  signer = await provider.getSigner();
  account = await signer.getAddress();

  $("#connect").innerHTML = `<span class="a1">${account.slice(0, 6)}</span>…${account.slice(-4)}`;

}
/// Makes sure a wallet is connected on `ch` (switching networks if needed) before an action there. Quiet: the page
/// isn't re-rendered, so the action in progress keeps its form. Ends by asking the wallet itself which network it is
/// on, and refuses to go on unless it is `ch`, so no transaction is ever requested on the wrong network.
async function requireWallet(ch = CHAINS.robinhood) {
  if (!signer) await connect(ch, true);
  if (!signer) throw new Error("Connect a wallet first");
  const want = "0x" + ch.chainId.toString(16);
  if ((await WALLET.request({ method: "eth_chainId" })) !== want) await connect(ch, true);
  if (!signer || (await WALLET.request({ method: "eth_chainId" })) !== want) {
    signer = null;
    throw new Error(`Switch your wallet to ${ch.name} (chain ID ${ch.chainId}) and try again.`);
  }
  // The signer must be bound to `ch` too (it is rebuilt by connect after a switch).
  if (Number((await signer.provider.getNetwork()).chainId) !== ch.chainId) {
    signer = await new ethers.BrowserProvider(WALLET).getSigner();
  }
}

async function ensureImdAllowance(amount, spender, imdAddr = CONFIG.imd) {
  const imd = new ethers.Contract(imdAddr, ERC20_ABI, signer);
  const current = await imd.allowance(account, spender);
  if (current >= amount) return;
  toast(`Approve ${qsym(imdAddr)} in your wallet…`, 8000);
  const tx = await imd.approve(spender, amount);
  await tx.wait();
}

function route() {

/// A 24 h change as text: sign, one decimal (none from ±1000%), the good direction in the data hue, a fall in red,
/// no change or no trades in grey.
const chgText = (x) => (x == null ? `<span class="chg flat">—</span>`
  : `<span class="chg ${x > 0.0005 ? "up" : x < -0.0005 ? "dn" : "flat"}">${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(x * 100).toLocaleString("en-US", { maximumFractionDigits: Math.abs(x) >= 10 ? 0 : 1, minimumFractionDigits: Math.abs(x) >= 10 ? 0 : 1 })}%</span>`);
/// Change since the earliest trade in the last 24 h (its average price), from the price now. No trades: null.
const pctOf = (t, m) => {
  if (!m?.first) return null;
  const now = priceOf(t.sqrtPriceX96, t.quoteIsCurrency0);
  const then = Number(ethers.formatUnits(m.first.quoteAmount, 18)) / Number(ethers.formatUnits(m.first.tokenAmount, 18));
  return then > 0 && Number.isFinite(now) ? now / then - 1 : null;
};

    listed = (await allTokenInfos()).map((x) => x.t).filter(isListed);

    try { mk = await market24h(); } catch (e) { console.warn("market data", e); }
    showList(); showTrend(); showFeed(); showFinding();
  };

}

// ---------------------------------------------------------------- Every chain
// Tokens from other launchpads and DEXes on our chains: prices and trending lists from GeckoTerminal (free, about
// 30 requests a minute, so cached), trades through Relay with the PepesFamily app fee (FEES.swapBps).
const GT = "https://api.geckoterminal.com/api/v2";
const gtCache = new Map();
async function gtGet(path, ttl = 120_000) {
  const hit = gtCache.get(path);
  if (hit && Date.now() - hit.at < ttl) return hit.p;
  const p = fetch(GT + path, { headers: { accept: "application/json" }, signal: AbortSignal.timeout(10000) }).then(async (r) => {
    if (r.status === 429) throw new Error("price data is busy, try again in a minute");
    if (!r.ok) throw new Error("price data answered " + r.status);
    return r.json();
  });
  gtCache.set(path, { at: Date.now(), p });
  p.catch(() => gtCache.delete(path));
  return p;
}
const gtChains = () => Object.values(CHAINS).filter((c) => c.gt && !c.testnet);
// coins, wrapped coins and stablecoins: trending pools are full of them, they are not what people come to find
const MAJORS = new Set(["ETH", "WETH", "BNB", "WBNB", "HYPE", "WHYPE", "KHYPE", "STHYPE", "USDC", "USDT", "USDT0", "USD₮0", "USDG",
  "USDE", "USDS", "DAI", "FDUSD", "USD1", "USDH", "BTC", "WBTC", "BTCB", "UBTC", "CBBTC", "STETH", "WSTETH", "CBETH", "UETH"]);
/// Trending tokens on every chain (one entry per token, its busiest pool): { ch, address, name, symbol, image, price,
/// mc, vol, chg, liq, created, pool }. Our own launches are left out (they have their own list).
async function marketTokens() {
  const lists = await Promise.all(gtChains().map(async (ch) => {
    const j = await gtGet(`/networks/${ch.gt}/trending_pools?page=1&include=base_token`).catch(() => null);
    if (!j?.data) return [];
    const toks = new Map((j.included || []).map((t) => [t.id, t.attributes]));
    return j.data.map((p) => {
      const a = p.attributes, t = toks.get(p.relationships?.base_token?.data?.id);
      if (!t || MAJORS.has(String(t.symbol).toUpperCase()) || TOKEN_PAD.has(t.address.toLowerCase())) return null;
      return { ch, address: ethers.getAddress(t.address), name: t.name, symbol: t.symbol, image: t.image_url && t.image_url !== "missing.png" ? t.image_url : "",
        price: Number(a.base_token_price_usd) || 0, mc: Number(a.market_cap_usd || a.fdv_usd) || 0, vol: Number(a.volume_usd?.h24) || 0,
        chg: a.price_change_percentage?.h24 != null ? Number(a.price_change_percentage.h24) / 100 : null, liq: Number(a.reserve_in_usd) || 0,
        created: a.pool_created_at ? Date.parse(a.pool_created_at) / 1000 : 0, pool: a.address };
    }).filter(Boolean);
  }));
  const best = new Map();
  for (const x of lists.flat()) { const k = x.ch.key + x.address.toLowerCase(), o = best.get(k); if (!o || x.vol > o.vol) best.set(k, x); }
  if (!best.size && lists.every((l) => !l.length)) throw new Error("no chain answered");
  return [...best.values()];
}
/// A token's picture from the market data (falls back to its ticker letters like our own tokens).
const mAvatar = (x, cls = "") => (x.image ? `<img class="avatar ${cls}" width="${cls === "lg" ? 64 : 48}" height="${cls === "lg" ? 64 : 48}" src="${esc(x.image)}" alt="${esc(String(x.symbol).slice(0, 2))}" loading="lazy" referrerpolicy="no-referrer">`
  : `<div class="avatar ${cls}">${esc(String(x.symbol || "?").slice(0, 2))}</div>`);
/// Which of our chains `addr` trades on (DexScreener; the most liquid pair wins): the chain key, or null.
async function findMarketChain(addr) {
  const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`, { signal: AbortSignal.timeout(10000) });
  const ids = new Map(gtChains().filter((c) => c.dex).map((c) => [c.dex, c.key]));
  const pairs = ((await r.json())?.pairs || []).filter((p) => ids.has(p.chainId)).sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
  return pairs.length ? ids.get(pairs[0].chainId) : null;
}
/// One token's market data on `ch`: DexScreener first (its most liquid pair), GeckoTerminal if DexScreener has
/// nothing. { name, symbol, image, price, mc, liq, vol, chg, chart (an embeddable chart URL or "") }.
async function marketToken(ch, addr) {
  try {
    const r = await fetch(`https://api.dexscreener.com/tokens/v1/${ch.dex}/${addr}`, { signal: AbortSignal.timeout(10000) });
    const p = (await r.json()).filter?.((x) => x.baseToken?.address?.toLowerCase() === addr.toLowerCase())
      .sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];
    if (p) return { name: p.baseToken.name, symbol: p.baseToken.symbol, image: p.info?.imageUrl || "", price: Number(p.priceUsd) || 0,
      mc: Number(p.marketCap || p.fdv) || 0, liq: Number(p.liquidity?.usd) || 0, vol: Number(p.volume?.h24) || 0,
      chg: p.priceChange?.h24 != null ? Number(p.priceChange.h24) / 100 : null,
      chart: `https://dexscreener.com/${p.chainId}/${p.pairAddress}?embed=1&loadChartSettings=0&trades=0&tabs=0&info=0&chartLeftToolbar=0&chartTheme=dark&theme=dark&chartStyle=1&chartType=usd&interval=15` };
  } catch {}
  const j = await gtGet(`/networks/${ch.gt}/tokens/${addr.toLowerCase()}?include=top_pools`, 60_000);
  const t = j.data.attributes, pool = (j.included || []).find((x) => x.type === "pool")?.attributes;
  return { name: t.name, symbol: t.symbol, image: t.image_url && t.image_url !== "missing.png" ? t.image_url : "", price: Number(t.price_usd) || 0,
    mc: Number(t.market_cap_usd || t.fdv_usd) || 0, liq: Number(t.total_reserve_in_usd) || 0, vol: Number(t.volume_usd?.h24) || 0,
    chg: pool?.price_change_percentage?.h24 != null ? Number(pool.price_change_percentage.h24) / 100 : null,
    chart: pool ? `https://www.geckoterminal.com/${ch.gt}/pools/${pool.address}?embed=1&info=0&swaps=0&light_chart=0&chart_type=price&resolution=15m` : "" };
}
/// A Relay quote for a swap at `swapBps`: `amount` of `from` (on `fromCh`) into `to` (on `toCh`), exact in.
function swapQuote(fromCh, from, toCh, to, amount) {
  return relayApi("quote/v2", {
    user: account || "0x000000000000000000000000000000000000dEaD", recipient: account || undefined,
    originChainId: fromCh.chainId, destinationChainId: toCh.chainId, originCurrency: from, destinationCurrency: to,
    amount: amount.toString(), tradeType: "EXACT_INPUT", appFees: appFees(FEES.swapBps),
  });
}
const swapSummary = (q) => {
  const o = q.details?.currencyOut, f = q.fees || {};
  const fee = ["gas", "relayer", "app"].reduce((t, k) => t + Number(f[k]?.amountUsd || 0), 0);
  return `You get ≈ ${Number(o?.amountFormatted || 0).toLocaleString("en-US", { maximumSignificantDigits: 6 })} ${esc(o?.currency?.symbol || "")}`
    + ` · fees ≈ ${fmtUsd(fee)} (incl. ${FEES.swapBps / 100}% PepesFamily fee)${q.details?.timeEstimate ? ` · ~${q.details.timeEstimate} s` : ""}`;
};

/// GoPlus token security for `addr` on `ch` (Ethereum, BSC, Base and Robinhood Chain; not HyperEVM yet).
/// { supported, danger: [..], warn: [..], ok: [..], honeypot } as plain sentences; danger blocks nothing by itself.
const GOPLUS_CHAINS = new Set([1, 56, 8453, 4663]);
async function safetyCheck(ch, addr) {
  if (!GOPLUS_CHAINS.has(ch.chainId)) return { supported: false };
  const r = await fetch(`https://api.gopluslabs.io/api/v1/token_security/${ch.chainId}?contract_addresses=${addr.toLowerCase()}`, { signal: AbortSignal.timeout(10000) });
  const j = await r.json();
  const v = j?.result?.[addr.toLowerCase()];
  if (!v) return { supported: true, unknown: true };
  const yes = (k) => v[k] === "1", pct = (k) => (v[k] === "" || v[k] == null ? null : Number(v[k]) * 100);
  const danger = [], warn = [], ok = [];
  const owner = v.owner_address || "";
  const renounced = !owner || /^0x0{40}$/i.test(owner) || owner.toLowerCase() === "0x000000000000000000000000000000000000dead";
  if (yes("is_honeypot")) danger.push("Honeypot: buyers can't sell");
  if (yes("cannot_sell_all")) danger.push("Holders can't sell their whole balance");
  const bt = pct("buy_tax"), st = pct("sell_tax");
  if (st != null && st >= 10) danger.push(`Sell tax ${st.toFixed(1)}%`); else if (st) warn.push(`Sell tax ${st.toFixed(1)}%`);
  if (bt != null && bt >= 10) danger.push(`Buy tax ${bt.toFixed(1)}%`); else if (bt) warn.push(`Buy tax ${bt.toFixed(1)}%`);
  if (bt === 0 && st === 0) ok.push("No buy or sell tax");
  if (yes("can_take_back_ownership")) danger.push("The owner can take back ownership");
  if (yes("hidden_owner")) danger.push("Hidden owner");
  if (yes("selfdestruct")) danger.push("The contract can self-destruct");
  if (yes("owner_change_balance")) danger.push("The owner can change balances");
  if (!renounced) {
    if (yes("is_mintable")) warn.push("The owner can mint more");
    if (yes("transfer_pausable")) warn.push("The owner can pause transfers");
    if (yes("is_blacklisted")) warn.push("The owner can blacklist wallets");
    if (yes("slippage_modifiable")) warn.push("The owner can change the tax");
    if (yes("is_proxy")) warn.push("Upgradeable contract (proxy)");
  }
  if (renounced) ok.push("Ownership renounced");
  if (v.is_open_source === "0") danger.push("Contract source not verified");
  else if (yes("is_open_source")) ok.push("Verified source");
  if (v.holder_count) ok.push(`${Number(v.holder_count).toLocaleString("en-US")} holders`);
  if (yes("trust_list")) ok.push("On GoPlus's trusted list");
  return { supported: true, danger, warn, ok, honeypot: yes("is_honeypot") || yes("cannot_sell_all") };
}

// ---------------------------------------------------------------- Market data
/// The last 24 h on every launchpad with trade history (Blockscout): per token, volume, trade count and the earliest
/// trade in the window (for the 24 h change); plus the most recent trades, newest first, for the live feed.
/// Cached for 15 s.
let MARKET = null;
function market24h() {
  if (MARKET && Date.now() - MARKET.at < 15_000) return MARKET.p;
  const p = (async () => {
    const since = Date.now() / 1000 - 86400;
    const per = new Map(), recent = [];
    await Promise.all(livePads().map(async (P) => {
      if (!P.ch.blockscoutApi) return; // no trade history on this chain's explorer
      const topic = P.c.interface.getEvent("Trade").topicHash;
      let next = null;
      for (let page = 0; page < 10; page++) {
        const r = await fetch(`${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic}` + (next ? "&" + new URLSearchParams(next) : ""),
          { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return;
        const j = await r.json();
        let older = false;
        for (const i of j.items) {
          if (i.topics[0] !== topic) continue;
          const ts = Date.parse(i.block_timestamp) / 1000;
          const a = P.c.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args;
          if (page === 0 || ts >= since) recent.push({ key: i.transaction_hash + ":" + i.index, ts, a });
          if (ts < since) { older = true; continue; }
          const k = a.token.toLowerCase();
          const m = per.get(k) ?? { vol: 0n, n: 0, first: null };
          m.vol += a.quoteAmount; m.n++; m.first = a; // newest first: the last one seen is the earliest
          per.set(k, m);
        }
        if (older || !j.next_page_params) break;
        next = j.next_page_params;
      }
    }));
    recent.sort((x, y) => y.ts - x.ts);
    return { per, recent: recent.slice(0, 60) };
  })();
  MARKET = { at: Date.now(), p };
  p.catch(() => { MARKET = null; });
  return p;
}

// ---------------------------------------------------------------- Platform totals
/// All-time totals across every launchpad version, summed per quote asset (ETH / IMD) and shown in USD.
///   Holders:  for each token, dividends already distributed + holder fees still waiting to be flushed.
///   Protocol: fees already collected (ProtocolFeesCollected events) + fees pending in each launchpad.
async function loadTotals() {
  const holders = {};
  const proto = {};
  const add = (m, q, w) => { m[q] = (m[q] ?? 0n) + w; };
  let protocolExact = true;

  await Promise.all(livePads().map(async (P) => {
    const n = Number(await P.c.tokenCount());
    // Per quote asset, for this launchpad: holder earnings, and the protocol fees they imply (an estimate used only
    // if the collection history can't be read). The protocol fee is 1% of each trade; holders get h% of it per the
    // token's split (3% before v5), so protocol = holder earnings x 1 / h. Tokens paying holders nothing can't be
    // estimated this way and count as zero there.
    const estimate = {};
    for (let off = 0; off < n; off += 100) {
      const list = await P.v.getTokens(off, 100);
      const splits = await Promise.all(list.map((t) => splitOf(P, t.token).catch(() => null)));
      list.forEach((t, i) => {
        const earned = t.totalDividendsDistributed + t.pendingHolderFees;
        add(holders, t.quote, earned);
        const hBps = BigInt(splits[i] ? splits[i].h : 300);
        if (hBps > 0n) add(estimate, t.quote, (earned * 100n) / hBps);
      });
    }
    const pending = {};
    const assets = padAssets(P);
    (await Promise.all(assets.map((q) => P.c.pendingProtocolFees(q)))).forEach((w, i) => add(pending, assets[i], w));
    try {
      const collected = {};
      for (const ev of await fetchPadLogs(P, P.c.interface.getEvent("ProtocolFeesCollected").topicHash)) {
        const { quote, amount } = P.c.interface.parseLog(ev).args;
        add(collected, quote, amount);
      }
      for (const [q, w] of Object.entries(pending)) add(proto, q, w);
      for (const [q, w] of Object.entries(collected)) add(proto, q, w);
    } catch {
      // History unavailable: use the estimate, but never less than the pending fees already read.
      protocolExact = false;
      for (const q of new Set([...Object.keys(pending), ...Object.keys(estimate)])) {
        const e = estimate[q] ?? 0n, p = pending[q] ?? 0n;
        add(proto, q, e > p ? e : p);
      }
    }
  }));

  const toUsd = (m) => Object.entries(m).reduce((s, [q, wei]) => s + Number(ethers.formatUnits(wei, 18)) * quoteUsd(q), 0);
  // per asset symbol (IMD on Robinhood and IMD on Ethereum are one line)
  const parts = (m) => {
    const bySym = {};
    for (const [q, w] of Object.entries(m)) if (w > 0n) bySym[qsym(q)] = (bySym[qsym(q)] ?? 0n) + w;
    return Object.entries(bySym).map(([sym, w]) => `${fmt(w)} ${sym}`).join(" + ") || "nothing yet";
  };
  // The protocol fee is exactly 1% of each trade's quote amount, so volume = protocol fees × 100.
  const volume = Object.fromEntries(Object.entries(proto).map(([q, w]) => [q, w * 100n]));
  const approx = protocolExact ? "" : "≈ ";

  if (!$("#tot-holders")) return; // not on the home page
  $("#tot-holders").textContent = fmtUsd(toUsd(holders));
  $("#tot-holders-sub").textContent = parts(holders);
  $("#tot-volume").textContent = approx + fmtUsd(toUsd(volume));
  $("#tot-volume-sub").textContent = parts(volume);
}

/// All logs a launchpad emitted with `topic0`, via Blockscout's API (paginated).
async function fetchPadLogs(P, topic0) {
  if (!P.ch.blockscoutApi) throw new Error("no event history on " + P.ch.name); // callers fall back
  const url = `${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic0}`;
  const items = [];
  let next = null;
  for (let page = 0; page < 20; page++) {
    const r = await fetch(url + (next ? "&" + new URLSearchParams(next).toString() : ""), { signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error("blockscout " + r.status);
    const j = await r.json();
    items.push(...j.items.filter((i) => i.topics[0] === topic0).map((i) => ({ topics: i.topics.filter(Boolean), data: i.data })));
    if (!j.next_page_params) break;
    next = j.next_page_params;
  }
  return items;
}

/// v4 admin: every address that ever sent or received `token` (Blockscout token transfers), so wallets that sold
/// everything but left rewards unclaimed are found too. Excluded system accounts report 0 expired and drop out.
async function tokenParticipants(token, ch = CHAINS.robinhood) {
  if (!ch.blockscoutApi) return []; // no transfer history on this chain's explorer: can't be scanned here
  const seen = new Set();
  let next = null;
  for (let page = 0; page < 200; page++) {
    const r = await fetch(`${ch.blockscoutApi}/tokens/${token}/transfers` + (next ? "?" + new URLSearchParams(next) : ""),
      { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error(`Blockscout answered ${r.status}`);
    const j = await r.json();
    for (const it of j.items || []) for (const a of [it.from?.hash, it.to?.hash]) if (a && ethers.isAddress(a)) seen.add(ethers.getAddress(a));
    next = j.next_page_params;
    if (!next) break;
  }
  return [...seen];
}

/// A token's logo for drawing on a canvas: the site's own image, else its IPFS image through each gateway, else its
/// https image. Loaded with CORS so the canvas stays exportable; null when none loads (the card shows the ticker).
async function cardLogo(info) {
  const own = CONFIG.images[String(info.token || "").toLowerCase()];
  const raw = own ? "" : meta(info.metadata).image;
  const ipfs = typeof raw === "string" ? ipfsPath(raw.trim()) : "";
  const urls = own ? [own] : ipfs ? IPFS_GATEWAYS.map((g) => g + ipfs) : safeUrl(raw) ? [safeUrl(raw)] : [];
  for (const u of urls) {
    const im = await new Promise((res) => {
      const i = new Image();
      const t = setTimeout(() => res(null), 7000);
      i.crossOrigin = "anonymous";
      i.referrerPolicy = "no-referrer";
      i.onload = () => { clearTimeout(t); res(i); };
      i.onerror = () => { clearTimeout(t); res(null); };
      i.src = u;
    });
    if (im && im.naturalWidth) return im;
  }
  return null;
}

/// Black grid, floor and the frog crowd: the background every share card shares. Returns the drawing helpers.
async function cardBase() {
  const W = 1200, H = 675, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  try { await Promise.all([400, 500, 600].map((w) => document.fonts.load(`${w} 24px "Inter"`))); } catch {}
  const F = (w, s) => `${w} ${s}px "Inter", system-ui, sans-serif`;
  const fit = (txt, w, size, max) => { g.font = F(w, size); while (g.measureText(txt).width > max && size > 14) g.font = F(w, (size -= 2)); };
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "#0d170d"; g.lineWidth = 1;
  for (let x = 40; x < W; x += 40) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
  for (let y = 40; y < H; y += 40) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
  const floor = H - 70;
  g.fillStyle = "#0b0f0b"; g.fillRect(0, floor, W, H - floor);
  g.fillStyle = "#3ddc84"; g.fillRect(0, floor, W, 2);
  const frog = await new Promise((res) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(FROG_SVG.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="122" '));
  });
  if (frog) {
    for (const [x, w, lift] of [[800, 92, 34], [905, 98, 38], [1012, 90, 32], [1100, 84, 36], [745, 118, 0], [858, 128, 4], [985, 122, 0], [1095, 112, 2]]) {
      g.drawImage(frog, x, floor + 22 - lift - w * 1.22, w, w * 1.22);
    }
  }
  g.textBaseline = "middle";
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(60, 56, 44, 44);
  g.fillStyle = "#fff"; g.fillRect(104, 56, 214, 44);
  g.font = F(600, 22); g.textAlign = "center"; g.fillText("P", 82, 79);
  g.fillStyle = "#000"; g.font = F(500, 18); g.fillText("PEPESFAMILY", 211, 79);
  g.textAlign = "left";
  return { c, g, F, fit, W, H, floor };
}

/// One token's card: its launch logo, ticker, what this wallet earned holding it, and its share of the supply.
async function tokenShareCard(r, amt, holderPct) {
  const { c, g, F, fit, W, floor } = await cardBase();
  const x0 = 60, y0 = 150, S = 230;
  const logo = await cardLogo(r.t);
  g.save();
  g.beginPath(); g.roundRect(x0, y0, S, S, 28); g.clip();
  if (logo) {
    // cover-fit the logo into the square
    const k = Math.max(S / logo.naturalWidth, S / logo.naturalHeight), w = logo.naturalWidth * k, h = logo.naturalHeight * k;
    g.drawImage(logo, x0 + (S - w) / 2, y0 + (S - h) / 2, w, h);
  } else {
    g.fillStyle = "#16301a"; g.fillRect(x0, y0, S, S);
    g.fillStyle = "#3ddc84"; g.font = F(600, 96); g.textAlign = "center";
    g.fillText((r.t.symbol || "?").slice(0, 2).toUpperCase(), x0 + S / 2, y0 + S / 2 + 4);
    g.textAlign = "left";
  }
  g.restore();
  g.strokeStyle = "#3ddc84"; g.lineWidth = 3; g.beginPath(); g.roundRect(x0, y0, S, S, 28); g.stroke();

  const tx = x0 + S + 44, maxW = W - tx - 60;
  g.fillStyle = "#fff"; fit("$" + r.t.symbol, 600, 56, maxW); g.fillText("$" + r.t.symbol, tx, y0 + 30);
  g.fillStyle = "#8c8c8c"; fit(r.t.name, 400, 24, maxW); g.fillText(r.t.name, tx, y0 + 78);
  g.fillStyle = "#8c8c8c"; g.font = F(500, 20); g.fillText("HOLDER REWARDS EARNED", tx, y0 + 132);
  g.fillStyle = "#3ddc84"; fit(amt, 600, 76, maxW); g.fillText(amt, tx, y0 + 188);
  const parts = [`${fmt(r.earned, 4)} ${qsym(r.t.quote)}`];
  const pct = Number((r.bal * 1000000n) / SUPPLY) / 10000;
  if (pct > 0) parts.push(`holding ${pct}% of supply`);
  g.fillStyle = "#fff"; fit(parts.join(" · "), 400, 22, maxW); g.fillText(parts.join(" · "), tx, y0 + 244);
  const chain = r.P.ch.name.toUpperCase();
  g.font = F(500, 16); const cw = g.measureText(chain).width + 24;
  g.strokeStyle = "#3ddc84"; g.lineWidth = 1.5; g.strokeRect(x0, y0 + S + 34, cw, 32);
  g.fillStyle = "#3ddc84"; g.fillText(chain, x0 + 12, y0 + S + 51);

  g.fillStyle = "#8c8c8c"; fit(`${holderPct}% of every $${r.t.symbol} trade goes to holders`, 400, 20, 640);
  g.fillText(`${holderPct}% of every $${r.t.symbol} trade goes to holders`, 60, floor + 36);
  g.fillStyle = "#fff"; g.font = F(600, 20); g.textAlign = "right"; g.fillText("pepesimd.fun", W - 60, floor + 36);
  return c.toDataURL("image/png");
}

/// 1200×675 PNG (X's large-image size) as a data: URL: big total, top tokens, and the frog crowd from behind.
async function shareCard(total, sub, top) {
  const { c, g, F, fit, W, floor } = await cardBase();

// ---------------------------------------------------------------- Pepes Family mint
const NFT_ABI = [
  "function mint(uint256 quantity) payable",
  "function price() view returns (uint256)",
  "function saleOpen() view returns (bool)",
  "function totalMinted() view returns (uint256)",
  "function walletLimit() view returns (uint256)",
  "function mintedBy(address) view returns (uint256)",
  "function MAX_SUPPLY() view returns (uint256)",
  "function MAX_PER_TX() view returns (uint256)",
  "function tokensOfOwner(address) view returns (uint256[])",
  "function tokenURI(uint256) view returns (string)",
  "function seed() view returns (uint256)",
  "function traitSetOf(uint256) view returns (uint256)",
];
const NFT_ART_ABI = ["function render(uint256) view returns (string)", "function sealedSvg() view returns (string)", "function specOf(uint256) view returns (uint256)"];
const svgUrl = (svg) => "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
/// The image of a token from its on-chain tokenURI (a data: JSON with a data: SVG image).
function nftImage(uri) {
  try {
    const json = JSON.parse(uri.startsWith("data:application/json;base64,") ? decodeURIComponent(escape(atob(uri.slice(29)))) : decodeURIComponent(uri.slice(uri.indexOf(",") + 1)));
    const img = String(json.image || "");
    return img.startsWith("data:image/") ? img : "";
  } catch { return ""; }
}

async function renderMint() {
  const app = $("#app"), gen = routeGen;
  const ch = CHAINS.robinhood;
  const nftR = new ethers.Contract(CONFIG.pepesNft, NFT_ABI, ch.reader);
  const artR = new ethers.Contract(CONFIG.pepesArt, NFT_ART_ABI, ch.reader);
  app.innerHTML = `<div class="mint-top"><div class="mint-pics">${`<div class="skel" style="aspect-ratio:1"></div>`.repeat(4)}</div>
    <div><h1>Pepes Family</h1><div class="stat" style="margin-top:4px">Reading the collection…</div><div class="card" style="margin-top:16px"><div class="skel" style="height:60px"></div></div>
    <div class="card"><div class="skel" style="height:90px"></div></div></div></div>`;
  let st;
  try {
    const [price, open, minted, limit, max, perTx, seed, mine] = await Promise.all([
      nftR.price(), nftR.saleOpen(), nftR.totalMinted(), nftR.walletLimit(), nftR.MAX_SUPPLY(), nftR.MAX_PER_TX(), nftR.seed(),
      account ? nftR.mintedBy(account) : Promise.resolve(0n),
    ]);
    st = { price, open, minted: Number(minted), limit: Number(limit), max: Number(max), perTx: Number(perTx), revealed: seed !== 0n, mine: Number(mine) };
  } catch (e) { if (gen === routeGen) app.innerHTML = `<div class="card empty">Couldn't read the collection: ${esc(errMsg(e))}</div>`; return; }
  if (gen !== routeGen) return;
  const left = st.max - st.minted;
  const canMint = Math.max(0, Math.min(st.perTx, st.limit - st.mine, left));
  const usdEach = Number(ethers.formatEther(st.price)) * quoteUsd(ZERO);
  let qty = Math.min(1, canMint);
  const state = !st.open ? (st.minted >= st.max ? "Sold out" : "The mint is closed") : left === 0 ? "Sold out" : "";

// ---------------------------------------------------------------- Launch image
/// Turns common share links into direct image links (IPFS gateway links -> ipfs://, Dropbox -> raw file, GitHub
/// file page -> raw file, Google Drive file -> image). Anything else is returned as typed.
function fixImageLink(u) {
  u = u.trim();
  if (!u) return "";
  const ipfs = ipfsPath(u);
  if (ipfs) return "ipfs://" + ipfs;
  try {
    const x = new URL(u);
    if (/(^|\.)dropbox\.com$/.test(x.hostname) && x.searchParams.has("dl")) {
      x.searchParams.delete("dl"); x.searchParams.set("raw", "1"); return x.href;
    }
    if (x.hostname === "github.com") {
      const m = x.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
      if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
    }
    if (x.hostname === "drive.google.com") {
      const id = x.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || x.searchParams.get("id");
      if (id && /^[\w-]+$/.test(id)) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    }
  } catch {}
  return u;
}
function loadImage(src, ms = 15000) {
  return new Promise((resolve) => {
    const im = new Image();
    im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => { im.src = ""; resolve(false); }, ms);
    im.onload = () => { clearTimeout(t); resolve(im.naturalWidth > 0); };
    im.onerror = () => { clearTimeout(t); resolve(false); };
    im.src = src;
  });
}
/// The URL the site will show for `link` if it really is an image (IPFS: first gateway that serves it), else "".
async function imageLoads(link) {
  const p = ipfsPath(link);
  if (p) { for (const g of IPFS_GATEWAYS) if (await loadImage(g + p)) return g + p; return ""; }
  const s = safeUrl(link);
  return s && (await loadImage(s)) ? s : "";
}
/// Reads an image file and scales it to fit 512×512 (small GIFs are kept as they are, so they stay animated).
async function shrinkImage(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) throw new Error("Use a PNG, JPG, GIF or WEBP image");
  const dataUrl = await new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(r.result); r.onerror = () => bad(new Error("Couldn't read that file"));
    r.readAsDataURL(file);
  });
  if (file.type === "image/gif" && file.size <= 1024 * 1024) return dataUrl;
  const im = new Image();
  await new Promise((ok, bad) => { im.onload = ok; im.onerror = () => bad(new Error("That file isn't a valid image")); im.src = dataUrl; });
  const k = Math.min(1, 512 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  let out = c.toDataURL("image/webp", 0.88);
  if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png"); // browsers without WEBP encoding
  if (out.length > 1.3e6) out = c.toDataURL("image/jpeg", 0.85);
  return out;
}

/// The launch form's image field: live preview and check of pasted links, plus upload to IPFS (file picker, drag and
/// drop, or paste) when /api/upload is configured. ready() resolves to an error message, or "" when it's fine to launch.
function setupImageField() {
  const inp = $("#img"), prev = $("#imgprev"), msg = $("#imgmsg");
  const HINT = "Tip: open the image (an X profile picture, any picture online), right-click it and choose \"Copy image address\", then paste it here.";
  let st = { link: "", ok: true, busy: null };
  const say = (text, cls = "") => { msg.textContent = text; msg.className = "stat" + (cls ? " " + cls : ""); };
  const show = (src) => { prev.innerHTML = src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : "?"; };
  say(HINT);

  function check() {
    const link = fixImageLink(inp.value);
    if (link !== inp.value.trim()) inp.value = link;
    if (link === st.link) return st.busy || Promise.resolve();
    if (!link) { st = { link: "", ok: true, busy: null }; show(""); say(HINT); return Promise.resolve(); }
    if (!ipfsPath(link) && !/^https:\/\//i.test(link)) {
      st = { link, ok: false, busy: null }; show(""); say("Use a link that starts with https:// or ipfs://", "warn");
      return Promise.resolve();
    }
    say("Checking the image…");
    const busy = imageLoads(link).then((src) => {
      if (st.link !== link) return;
      st = { link, ok: !!src, busy: null };
      show(src);
      if (src) say("Image found", "ok");
      else say("This link isn't an image, it's probably a web page. " + HINT, "warn");
    });
    st = { link, ok: false, busy };
    return busy;
  }
  let timer = 0;
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(check, 600); };
  inp.onchange = () => { clearTimeout(timer); check(); };

  let canUpload = false;
  async function upload(file) {
    if (!canUpload) return say("Uploading isn't available right now: paste an image link instead.", "warn");
    const job = (async () => {
      try {
        say("Preparing the image…");
        const dataUrl = await shrinkImage(file);
        show(dataUrl);
        say("Uploading to IPFS…");
        const [, type, data] = dataUrl.match(/^data:([^;]+);base64,(.*)$/);
        const r = await fetch("/api/upload", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type, data }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || typeof j.url !== "string" || !ipfsPath(j.url)) throw new Error(j.error || "Upload failed, please try again");
        inp.value = j.url;
        st = { link: j.url, ok: true, busy: null };
        say("Uploaded to IPFS", "ok");
      } catch (e) {
        st = { link: "", ok: true, busy: null }; // whatever link is left in the field gets checked again on launch
        show(""); say(errMsg(e), "warn");
      }
    })();
    st = { ...st, busy: job };
    return job;
  }
  fetch("/api/upload", { signal: AbortSignal.timeout(8000) }).then((r) => r.json()).then((j) => {
    if (!j?.enabled || !$("#imgupbox")) {
      return;
    }
    canUpload = true;
    $("#imgupbox").hidden = false;
    $("#imgup").onclick = () => $("#imgfile").click();
    $("#imgfile").onchange = () => { const f = $("#imgfile").files[0]; if (f) upload(f); $("#imgfile").value = ""; };
    const row = $("#imgrow");
    row.ondragover = (e) => { e.preventDefault(); row.classList.add("drag"); };
    row.ondragleave = () => row.classList.remove("drag");
    row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drag"); const f = e.dataTransfer?.files?.[0]; if (f) upload(f); };
  }).catch(() => {});
  // Pasting a copied image (not a link) anywhere in the form uploads it.
  $("#cf").addEventListener("paste", (e) => {
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
    if (f) { e.preventDefault(); upload(f); }
  });

  return {
    async ready() {
      await check();
      if (st.busy) await st.busy;
      if (st.link && !st.ok) return "The image doesn't load. Fix the link, upload an image, or leave the field empty.";
      return "";
    },
  };
}

    } catch { if (seq === pvSeq) $("#ibp").textContent = "Can't quote this amount"; }

      ? `Two wallet confirmations: the launch, then your buy with ${NAT} (${LAUNCH.wrapped ? "wrapped" : "swapped to " + QS} automatically). Someone could buy in the few seconds between them; pay with ${QS} to buy inside the launch itself.`
      : "Bought in the same transaction as the launch, so nobody can buy before you.";
    updPreview();
  };
  document.querySelectorAll("#ibpay button").forEach((b) => b.onclick = () => setPay(b.dataset.p));
  setPay(pay);
  if ($("#ibfrom")) $("#ibfrom").onchange = () => {
    from = payOptionById(ch, $("#ibfrom").value);
    $("#ibpayrow").hidden = !!from;
    if (from) {
      pay = "eth"; // the buy is in the destination chain's coin, delivered by Relay
      $("#ibl").textContent = `Amount in ${NAT} to buy with (optional)`;
      $("#ibnote").textContent = `One confirmation on ${from.ch.short}: it pays for the launch on ${ch.short}, your buy in the same transaction (nobody can buy before you) and a little ${NAT} for gas there if you have none. Delivered by Relay in a few seconds; your token, tokens and creator role are yours on ${ch.short}.`;
      updPreview();
    } else setPay(LAUNCH.ethLive ? "eth" : "imd");
  };
  $("#ib").oninput = updPreview;
  updStart();
  { const fee = launchFeeWei(ch); $("#lfee").textContent = fee ? `Launch fee: $${FEES.launchUsd} (≈ ${fmt(fee, 6)} ${NAT}), paid to PepesFamily when you launch.` : ""; }

  $("#cf").onsubmit = async (ev) => {
    ev.preventDefault();

      if (imgErr) throw new Error(imgErr);
      // Read everything from the form before the wallet is asked anything: connecting must never launch from an
      // emptied form.
      const m = {};
      const put = (k, id) => { const v = $(id).value.trim(); if (v) m[k] = v; };
      put("image", "#img"); put("description", "#d"); put("website", "#w"); put("x", "#x"); put("telegram", "#tg");
