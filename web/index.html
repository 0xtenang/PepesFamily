      if ($("#ib").value.trim() && !amt) throw new Error("Enter a valid amount for the initial buy, or leave it empty");
      const form = { name: $("#n").value.trim(), symbol: $("#s").value.trim() };
      if (!form.name || !form.symbol) throw new Error("Enter a name and a ticker");
      if (from) {
        // paid from another chain: launchFor on this chain's PepesFamilyRemote, delivered by Relay
        if (LAUNCH.split && split.c + split.h + split.b !== 300) throw new Error("The fee shares must add up to 3%");
        const o = from;
        await requireWallet(o.ch); // connects too
        const { amt: buy, value } = await xcValue();
        const drop = value - buy;
        let minOut = 0n;
        if (buy > 0n) {
          const imdIn = LAUNCH.wrapped ? buy : await quoteExact(LAUNCH.ethKey, true, buy, ch);
          minOut = withSlippage(tokensFor(imdIn, await padR.startTick(quote)), 1000);
        }
        const data = REMOTE_IFACE.encodeFunctionData("launchFor", [LAUNCH.pad, account, form.name, form.symbol, JSON.stringify(m), [split.c, split.h, split.b], buy, minOut, drop]);
        toast("Getting the price…", 6000);
        const fee = launchFeeWei(ch);
        const q = await xcQuote(o, ch, value, data, fee ? [{ to: FEES.recipient, value: fee }] : []);
        $("#ibcost").innerHTML = xcSummary(q);
        const hashes = await xcExecute(q, o, (m2) => toast(m2, 30000));
        let token = null;
        for (const h of hashes) {
          for (let i = 0; i < 6 && !token; i++) {
            const rc = await ch.reader.getTransactionReceipt(h).catch(() => null);
            if (!rc) { await new Promise((r) => setTimeout(r, 1500)); continue; }
            for (const l of rc.logs) { try { const e = REMOTE_IFACE.parseLog(l); if (e?.name === "LaunchedFor") token = e.args.token; } catch {} }
            break;
          }
        }
        toast(`Token launched on ${ch.short}`, 8000);
        location.hash = token ? "#/t/" + token : "#/tokens";
        btn.disabled = false;
        return;
      }
      await requireWallet(ch);
      if (!$("#cf")) throw new Error("The page changed. Try again.");
      const ethBuy = pay === "eth" ? amt : 0n, imdBuy = pay === "imd" ? amt : 0n;
      // IMD buy inside the launch: 10% below the previewed amount, so a changed start price can't fill it far worse.
      let minOut = 0n;
      if (imdBuy > 0n) {
        minOut = withSlippage(tokensFor(imdBuy, await padR.startTick(quote)), 1000);
        await ensureImdAllowance(imdBuy, LAUNCH.router, quote);
      }
      const router = new ethers.Contract(LAUNCH.router, ROUTER_ABI, signer);
      if (LAUNCH.split && split.c + split.h + split.b !== 300) throw new Error("The fee shares must add up to 3%");
      const fee = launchFeeWei(ch);
      if (fee > 0n) {
        if ((await signer.provider.getBalance(account)) < fee + ethBuy) throw new Error(`Not enough ${NAT}: the launch fee is ${fmt(fee, 6)} ${NAT}${ethBuy ? ", plus your buy" : ""}`);
        toast(`Confirm the $${FEES.launchUsd} launch fee (${fmt(fee, 6)} ${NAT}) in your wallet…`, 10000);
        await (await signer.sendTransaction({ to: FEES.recipient, value: fee })).wait();
      }
      toast(ethBuy ? "Confirm the launch in your wallet (your buy comes next)…" : "Confirm the launch in your wallet…", 8000);
      const tx = LAUNCH.split
        ? await router.launchWithSplit(form.name, form.symbol, JSON.stringify(m), quote, [split.c, split.h, split.b], imdBuy, minOut, { value: 0n })
        : await router.launch(form.name, form.symbol, JSON.stringify(m), quote, imdBuy, minOut, { value: 0n });
      toast("Launching…", 15000);
      const rc = await tx.wait();
      const ev2 = rc.logs.map((l) => { try { return padR.interface.parseLog(l); } catch { return null; } }).find((l) => l?.name === "TokenLaunched");
      const token = ev2?.args.token;
      if (ethBuy > 0n && token) {
        try {
          let info = null; // the read RPC can be a block behind the wallet's: retry briefly
          for (let i = 0; i < 6 && !info; i++) { try { info = await LAUNCH.v.getTokenInfo(token); } catch { await new Promise((r) => setTimeout(r, 1500)); } }
          if (!info) throw new Error("the new token isn't visible yet");
          const expected = await quoteSwapEth(LAUNCH, token, info.quoteIsCurrency0, true, ethBuy);
          toast(`Token launched! Now confirm your ${NAT} buy…`, 10000);
          const tx2 = await new ethers.Contract(LAUNCH.ethRouter, ETH_ROUTER_ABI, signer)
            .buyWithEth(token, withSlippage(expected, 500), deadline(), { value: ethBuy });
          toast("Buying…", 15000);
          await tx2.wait();
          toast("Token launched and bought");
        } catch (e) {
          toast(`Token launched, but the ${NAT} buy didn't go through (${errMsg(e)}). You can buy it on the token page.`, 10000);
        }
      } else toast("Token launched");
      location.hash = token ? "#/t/" + token : "#/tokens";
    } catch (e) { toast(errMsg(e), 7000); }
    btn.disabled = false;
  };
}

    $("#quick").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const t = b.dataset.v;
      $("#amt").value = t.endsWith("%") ? ethers.formatUnits((tokBal * BigInt(parseInt(t))) / 100n, 18) : t;
      preview();
    });
    preview();
  }
  app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { $("#amt").value = ""; setSide(b.dataset.s); });
  app.querySelectorAll("#via button").forEach((b) => b.onclick = () => { viaEth = b.dataset.v === "eth"; $("#amt").value = ""; setSide(tradeSide); });

  let pvSeq = 0;
  // the price of a buy paid on another chain (debounced: Relay quotes are rate-limited)
  let costSeq = 0, costTimer = 0;
  function updCost(amt) {
    clearTimeout(costTimer);
    if (!from || tradeSide !== "buy" || !amt) return ($("#pvcost").textContent = "");
    $("#pvcost").textContent = "Getting a price…";
    costTimer = setTimeout(async () => {
      const seq = ++costSeq;
      try {
        const drop = await gasDropFor(P.ch);
        const data = REMOTE_IFACE.encodeFunctionData("buyFor", [P.pad, addr, account || "0x000000000000000000000000000000000000dEaD", 0, drop]);
        const qt = await xcQuote(from, P.ch, amt + drop, data);
        if (seq === costSeq && !stale()) $("#pvcost").innerHTML = xcSummary(qt) + (drop ? ` · includes ${fmt(drop, 6)} ${esc(NAT)} for gas on ${esc(P.ch.short)}` : "");
      } catch (e) { if (seq === costSeq && !stale()) $("#pvcost").textContent = "Can't get a price from this chain right now: " + errMsg(e); }
    }, 600);
  }
  if ($("#from")) $("#from").onchange = () => { from = payOptionById(P.ch, $("#from").value); $("#amt").value = ""; setSide(tradeSide); };
  async function preview() {
    const seq = ++pvSeq;
    let amt = 0n; try { amt = ethers.parseUnits($("#amt").value.trim() || "0", 18); } catch {}
    updCost(amt);
    if (!amt) return ($("#pv").innerHTML = "&nbsp;");
    try {
      const buying = tradeSide === "buy";
      const out = q !== ZERO && (viaEth || (from && buying))
        ? await quoteSwapEth(P, addr, info.quoteIsCurrency0, buying, amt)
        : await quoteSwap(P, addr, info.quoteIsCurrency0, buying, amt);
      if (seq === pvSeq && !stale()) $("#pv").textContent = `You receive ≈ ${fmt(out, 6)} ${buying ? "$" + info.symbol : payUnit()}`;
    } catch (e) { if (seq === pvSeq && !stale()) $("#pv").textContent = "Can't quote this amount"; }
  }
  $("#amt").oninput = preview;

  $("#trade").onclick = async () => {
    const btn = $("#trade"); btn.disabled = true;
    try {
      if (from && tradeSide === "buy") {
        // paid on another chain: buyFor on this chain's PepesFamilyRemote, delivered by Relay
        const o = from;
        const amt = ethers.parseUnits($("#amt").value.trim() || "0", 18);
        if (!amt) throw new Error("Enter an amount");
        const slipBps = Math.round(Math.min(50, Math.max(0, parseFloat($("#slip").value) || 0)) * 100);
        await requireWallet(o.ch); // connects too
        const expected = await quoteSwapEth(P, addr, info.quoteIsCurrency0, true, amt);
        const drop = await gasDropFor(P.ch);
        const data = REMOTE_IFACE.encodeFunctionData("buyFor", [P.pad, addr, account, withSlippage(expected, slipBps), drop]);
        toast("Getting the price…", 6000);
        const qt = await xcQuote(o, P.ch, amt + drop, data);
        $("#pvcost").innerHTML = xcSummary(qt);
        await xcExecute(qt, o, (m2) => toast(m2, 30000));
        toast(`Bought $${info.symbol} on ${P.ch.short}`, 8000);
        $("#amt").value = "";
        await loadPosition().catch(() => {});
        btn.disabled = false;
        return;
      }
      await requireWallet(P.ch);
      const amt = ethers.parseUnits($("#amt").value.trim() || "0", 18);
      if (!amt) throw new Error("Enter an amount");
      const slipBps = Math.round(Math.min(50, Math.max(0, parseFloat($("#slip").value) || 0)) * 100);
      let tx;
      if (q !== ZERO && viaEth) {
        const buying = tradeSide === "buy";
        const expected = await quoteSwapEth(P, addr, info.quoteIsCurrency0, buying, amt);
        if (buying) {
          toast("Confirm in your wallet…", 8000);
          tx = await ethRouterW().buyWithEth(addr, withSlippage(expected, slipBps), deadline(), { value: amt });
        } else {
          const dl = deadline();
          const sig = await authorizeSell(P, addr, P.ethRouter, amt, dl);
          toast("Confirm in your wallet…", 8000);
          tx = sig
            ? await ethRouterW().sellForEthWithPermit(addr, amt, withSlippage(expected, slipBps), dl, sig.v, sig.r, sig.s)
            : await ethRouterW().sellForEth(addr, amt, withSlippage(expected, slipBps), dl);
        }
      } else if (tradeSide === "buy") {
        const expected = await quoteSwap(P, addr, info.quoteIsCurrency0, true, amt);
        if (q !== ZERO) await ensureImdAllowance(amt, P.router, q);
        toast("Confirm in your wallet…", 8000);
        tx = await routerW().buy(addr, amt, withSlippage(expected, slipBps), deadline(), { value: q === ZERO ? amt : 0n });
      } else {
        const expected = await quoteSwap(P, addr, info.quoteIsCurrency0, false, amt);
        const dl = deadline();
        // v1 tokens let their router sell without approval; later tokens use a permit signature or an approval
        const sig = P.version === 1 ? null : await authorizeSell(P, addr, P.router, amt, dl);
        toast("Confirm in your wallet…", 8000);
        tx = sig
          ? await routerW().sellWithPermit(addr, amt, withSlippage(expected, slipBps), dl, sig.v, sig.r, sig.s)
          : await routerW().sell(addr, amt, withSlippage(expected, slipBps), dl);
      }
      toast("Transaction sent…", 15000);
      await tx.wait();
      toast(tradeSide === "buy" ? "Bought" : "Sold");
      if (!stale()) renderToken(addr);
    } catch (e) { toast(errMsg(e), 7000); }
    btn.disabled = false;
  };

  $("#claim").onclick = async () => {
    try {
      await requireWallet(P.ch);
      const tx = await new ethers.Contract(addr, TOKEN_ABI, signer).claim();
      toast("Claiming…", 15000);
      await tx.wait();
      toast("Rewards claimed");
      loadPosition();
    } catch (e) { toast(errMsg(e), 7000); }
  };

  setSide(tradeSide);
  loadPosition().catch(() => {});
  loadTrades(P, addr, info, stale).catch((e) => { if (!stale()) $("#trades").innerHTML = `<tr><td colspan="5" class="muted">${esc(errMsg(e))}</td></tr>`; });
}

/// Trade logs for `addr`, oldest first. Blockscout's API has full history and CORS; the RPC is a fallback
/// because free RPCs cap eth_getLogs ranges (a few minutes of blocks on this fast chain).
async function fetchTradeLogs(P, addr, createdBlock, pages = 6) {
  const padC = P.c;
  const tradeTopic = padC.interface.getEvent("Trade").topicHash;
  try {
    if (!P.ch.blockscoutApi) throw new Error("no Blockscout"); // the RPC below instead
    const url = `${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${ethers.zeroPadValue(addr, 32)}`;
    const items = [];
    let next = null;
    for (let page = 0; page < pages; page++) {
      const q = next ? "&" + new URLSearchParams(next).toString() : "";
      const r = await fetch(url + q, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("blockscout " + r.status);
      const j = await r.json();
      items.push(...j.items);
      if (!j.next_page_params) break;
      next = j.next_page_params;
    }
    return items
      .filter((i) => i.topics[0] === tradeTopic && i.topics[1]?.toLowerCase() === ethers.zeroPadValue(addr, 32).toLowerCase())
      .map((i) => ({ ...padC.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args.toObject(), hash: i.transaction_hash }))
      .reverse();
  } catch (e) {
    console.warn("Blockscout unavailable, using RPC for recent trades", e);
    const latest = await P.ch.reader.getBlockNumber();
    const CHUNK = 900, MAX_CHUNKS = 8;
    const from = Math.max(Number(createdBlock), latest - CHUNK * MAX_CHUNKS);
    const logs = [];
    for (let start = from; start <= latest; start += CHUNK) {
      logs.push(...(await padC.queryFilter(padC.filters.Trade(addr), start, Math.min(start + CHUNK - 1, latest))));
    }
    return logs.map((l) => ({ ...l.args.toObject(), hash: l.transactionHash }));
  }
}

/// `stale` says the visitor has left this token's page: then nothing is written.
async function loadTrades(P, addr, info, stale = () => false, pages = 6) {
  // the newest page first, so the list and chart appear in a second or two; then the full history
  if (pages > 1 && P.ch.blockscoutApi) await loadTrades(P, addr, info, stale, 1).catch(() => {});
  const trades = await fetchTradeLogs(P, addr, info.createdBlock, pages);
  if (stale()) return;
  $("#trades").innerHTML = trades.length ? trades.slice(-50).reverse().map((t) => `
    <tr><td class="${t.isBuy ? "b" : ""}">${t.isBuy ? "Buy" : "Sell"}</td>
    <td class="mono"><a href="${P.ch.explorer}/address/${t.trader}" target="_blank" rel="noopener">${short(t.trader)}</a></td>
    <td class="n" title="${fmt(t.quoteAmount, 6)} ${qsym(info.quote)}">${usd(t.quoteAmount, info.quote)}</td><td class="n">${fmt(t.tokenAmount)}</td>
    <td class="n"><a href="${P.ch.explorer}/tx/${t.hash}" target="_blank" rel="noopener">↗</a></td></tr>`).join("")
    : `<tr><td colspan="5" class="muted">No trades yet</td></tr>`;

  // price series: launch price, then price after each trade
  const startSqrt = trades.length ? null : info.sqrtPriceX96;
  const pts = startSqrt ? [priceOf(startSqrt, info.quoteIsCurrency0)] : trades.map((t) => priceOf(t.sqrtPriceX96, info.quoteIsCurrency0));
  drawChart(pts.map((x) => x * (quoteUsd(info.quote) || 1)));
}

function drawChart(pts) {
  const svg = $("#chart"); if (!svg) return;
  svg.classList.remove("skel");
  if (pts.length < 2) pts = [pts[0], pts[0]];
  const W = 600, H = 200, pad = 10;
  const min = Math.min(...pts), max = Math.max(...pts), span = max - min || max || 1;
  const xy = pts.map((v, i) => [pad + (i * (W - 2 * pad)) / (pts.length - 1), H - pad - ((v - min) / span) * (H - 2 * pad)]);
  const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  const up = pts[pts.length - 1] >= pts[0];
  const c = up ? "var(--accent)" : "var(--down)";
  svg.innerHTML = `<path d="${d}L${W - pad},${H - pad}L${pad},${H - pad}Z" fill="${c}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

// The screen's frame paints at once (its title and grey bars where the figures will go); the chains fill it in.
(() => {
  const h = location.hash.slice(1) || "/";
  const page = h.startsWith("/t/") ? "/t" : h.startsWith("/rewards") ? "/rewards" : h;
  const bar = (w, ht) => `<div class="skel" style="height:${ht}px;width:${w}"></div>`;
  const chains = Object.values(CHAINS).filter((c) => PADS.some((P) => P.ch === c && !c.testnet));
  if (page === "/" || page === "/tokens") $("#app").innerHTML = discoverFrame(chains);
  else $("#app").innerHTML = `<div class="trow-title"><div><h1>${esc(TITLES[page] || "Token")}</h1><div class="sub">Loading…</div></div></div>
    <div class="kpis">${`<div>${bar("40%", 13)}<div style="height:8px"></div>${bar("60%", 24)}</div>`.repeat(4)}</div>
    <div class="hsec"><h2>${page === "/" || page === "/tokens" ? "Trending now" : "&nbsp;"}</h2></div>
    <div class="card">${`<div style="display:flex;gap:12px;align-items:center;height:72px"><div class="avatar"></div><div style="flex:1">${bar("30%", 14)}<div style="height:6px"></div>${bar("18%", 12)}</div></div>`.repeat(5)}</div>`;
  for (const a of document.querySelectorAll("#nav a, #tabbar a")) a.classList.toggle("on", a.dataset.r === (page === "/tokens" ? "/" : page));
})();
Promise.all([loadPads(), loadPrices()]).finally(() => {
  route();
  // A chain whose RPC failed: its tokens are missing for now, so say so rather than hide them silently.
  const down = [...new Set(PADS.filter((P) => P.readErr).map((P) => P.ch.name))];
  if (LAUNCH && down.length) toast(`${down.join(" and ")} couldn't be reached: its tokens are missing until you reload.`, 9000);
  // the sidebar's networks: where tokens launch, and where else people can pay from
  const launchOn = Object.values(CHAINS).filter((c) => livePads().some((P) => P.ch === c));
  const payFrom = Object.values(CHAINS).filter((c) => !launchOn.includes(c) && !c.testnet && c.remote);
  $("#netlist").innerHTML = launchOn.map((c) => `<div class="chainrow"><i class="livedot" aria-hidden="true"></i>${esc(c.name)}</div>`).join("")
    + (payFrom.length ? `<div class="chainrow" style="color:var(--faint);font-size:13px">Pay from ${payFrom.map((c) => esc(c.short)).join(", ")}</div>` : "");
});
setInterval(loadPrices, 60_000);
</script>
