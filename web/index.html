<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https: wss: http://127.0.0.1:8545 http://localhost:8545; base-uri 'none'; form-action 'none'; object-src 'none'" />

<title>PepesFamily</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<script>
  // theme before first paint: saved choice, else the system setting
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #ffffff; --panel: #fafafa; --panel-2: #f1f1f1; --line: #dcdcdc; --strong: #000000;
  --text: #000000; --muted: #666666; --dim: #9a9a9a; --inv: #ffffff;
  --accent: #0a8f3c; --down: #d23c3c; --warn: #b8860b;
  --frame: #e8e8e5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --panel: #070707; --panel-2: #111111; --line: #2a2a2a; --strong: #ffffff;
    --text: #ffffff; --muted: #8c8c8c; --dim: #555555; --inv: #000000;
    --accent: #3ddc84; --down: #ff5a4f; --warn: #f5c542;
    --frame: #1c221c;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --panel: #070707; --panel-2: #111111; --line: #2a2a2a; --strong: #ffffff;
  --text: #ffffff; --muted: #8c8c8c; --dim: #555555; --inv: #000000;
  --accent: #3ddc84; --down: #ff5a4f; --warn: #f5c542;
  --frame: #1c221c;
}
* { box-sizing: border-box; border-radius: 0 !important; }
[hidden] { display: none !important; } /* layout classes like .row must not override the hidden attribute */
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 13px/1.6 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; padding-bottom: 44px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: inherit; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); }
header .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; border: 1.5px solid var(--strong); font-size: 13px; letter-spacing: .18em; height: 32px; }
.logo .mk { display: grid; place-items: center; width: 32px; border-right: 1.5px solid var(--strong); font-weight: 600; letter-spacing: 0; }
.logo .nm { display: grid; place-items: center; padding: 0 12px; background: var(--strong); color: var(--inv); font-weight: 500; }
nav.top { display: flex; gap: 4px; }
nav.top a { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; }
nav.top a:hover { color: var(--muted); }
nav.top a.on { background: var(--strong); color: var(--inv); }
.spacer { flex: 1; }
#connect { white-space: nowrap; }
button.icon { border: 0; background: none; color: var(--text); font-size: 15px; padding: 6px; cursor: pointer; }
@media (max-width: 600px) {
  /* phones: logo, theme and wallet on the first row; the tabs get their own full-width row below */
  header .wrap { gap: 8px; flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 8px; }
  nav.top { order: 3; width: 100%; overflow-x: auto; justify-content: space-between; }
  nav.top a { white-space: nowrap; }
  nav.top a { padding: 5px 6px; font-size: 11px; }
  #connect { padding: 7px 10px; }
  #connect.addr { text-transform: none; letter-spacing: 0; }
  h1 { font-size: 24px; }
  .stats:not(.q) { grid-template-columns: 1fr; }
}
@media (max-width: 360px) {
  .logo .nm { display: none; }
  .logo .mk { border-right: 0; }
  header .wrap { gap: 4px; }
  nav.top { gap: 0; }
  nav.top a { padding: 4px 3px; font-size: 10px; }
  button.icon { padding: 4px; }
  #connect { padding: 6px 7px; font-size: 11px; }
  #connect .a1 { display: none; }
}

/* controls */
button, .btn {
  font: inherit; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  border: 1px solid var(--strong); background: var(--bg); color: var(--text); padding: 8px 14px; display: inline-block;
}
button:hover, .btn:hover { background: var(--panel-2); }
button.primary, .btn.primary { background: var(--strong); color: var(--inv); }
button.primary:hover, .btn.primary:hover { opacity: .85; }
button:disabled { opacity: .35; cursor: not-allowed; }
input, textarea {
  font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input:focus, textarea:focus { outline: none; border-color: var(--strong); }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }

/* layout */
main { padding: 30px 0 60px; }
h1 { font-weight: 400; font-size: 30px; letter-spacing: -.01em; margin: 0; }
h2 { font-weight: 500; font-size: 20px; margin: 0; }
h3 { font-weight: 500; font-size: 14px; }
.hero { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; margin-bottom: 26px; }
.hero p { margin: 8px 0 0; color: var(--muted); }
.sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.sec .n { color: var(--muted); }
.sec .t { font-weight: 600; }
.sec .rule { flex: 1; height: 1px; background: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); }
.seg button.on { background: var(--strong); color: var(--inv); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.grid > .card { border-top: 0; border-left: 0; }
.card { background: var(--bg); border: 1px solid var(--line); padding: 16px; }
.tcard { display: flex; gap: 12px; transition: background .12s; }
.tcard:hover { background: var(--panel-2); }
.avatar { width: 60px; height: 60px; background: var(--panel-2); object-fit: cover; flex: none; border: 1px solid var(--line);
  display: grid; place-items: center; font-weight: 600; color: var(--muted); overflow: hidden; }
.avatar.lg { width: 88px; height: 88px; }
.tcard .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border: 1px solid currentColor; text-transform: uppercase; }
.pill.eth { color: var(--text); } .pill.imd { color: var(--muted); } .pill.chain { color: var(--text); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--text); font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 360px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
/* Phones: the trade panel comes right after the page header, before stats, charts and lists. */
@media (max-width: 860px) {
  .mfirst { display: flex; flex-direction: column; gap: 0; }
  .mfirst .mflat { display: contents; }
  .mfirst .mflat > *, .mfirst > .mrest { order: 3; }
  .mfirst .mflat > .mlead { order: 1; }
  .mfirst .mside { order: 2; margin: 14px 0; }
  .mfirst .mside > .card:first-child { margin-top: 0 !important; }
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; margin-top: 16px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.stats .card { padding: 14px 16px; border-top: 0; border-left: 0; }
.stats.q { grid-template-columns: repeat(2, 1fr); }
.stats .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stats .v { font-weight: 500; font-size: 20px; margin-top: 2px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 14px; border: 1px solid var(--line); }
.tabs button { border: 0; color: var(--muted); }
.tabs button.on.buy { background: var(--accent); color: #000; }
.tabs button.on.sell { background: var(--down); color: #fff; }
.quick { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.quick button { padding: 3px 9px; font-size: 11px; border-color: var(--line); }
.preview { margin: 12px 0; font-size: 12px; color: var(--muted); }
.full { width: 100%; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.b { color: var(--accent); } .s { color: var(--down); }
.chart { width: 100%; height: 200px; display: block; }
.toast { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); background: var(--strong); color: var(--inv);
  padding: 10px 16px; font-size: 12px; max-width: calc(100% - 32px); z-index: 20; display: none; }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); }
.fees { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.desc { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.links a { text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.ext .btn { padding: 4px 10px; font-size: 11px; }
.scroll-x { overflow-x: auto; }
.sharebtn { margin-top: 4px; padding: 2px 8px; font-size: 11px; }
.share-img { width: 100%; aspect-ratio: 1200 / 675; display: block; border: 1px solid var(--line); background: #000; }
#rf input { flex: 1; min-width: 0; }
/* Pepes Earn IMD NFT */
.nftgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.nftc { padding: 0; display: flex; flex-direction: column; text-align: left; text-transform: none; letter-spacing: 0; border-color: var(--line); }
.nftc:hover { border-color: var(--strong); background: var(--bg); }
.nftc .nimg, .nbig { display: block; width: 100%; aspect-ratio: 1; background: var(--panel-2); }
.nftc .nimg img, .nbig img { width: 100%; height: 100%; display: block; }
.nftc .cap { display: flex; flex-direction: column; padding: 6px 8px; font-size: 12px; line-height: 1.4; }
.modal .card.big { width: min(480px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; }
.warn-box { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--warn); color: var(--text); font-size: 12px; }
@media (max-width: 860px) { nav.top .nl { display: none; } }
.koth { border: 1.5px solid var(--strong); margin: 6px 0 14px; }
.koth-main { display: flex; gap: 16px; align-items: center; padding: 16px; transition: background .12s; }
.koth-main:hover { background: var(--panel-2); }
.koth .crown { display: inline-block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; background: var(--accent); color: #000; padding: 2px 8px; }
.koth .name { font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.koth-stats { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.koth-stats b { color: var(--text); font-weight: 500; }
.koth-rest { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; border-top: 1px solid var(--line); padding: 8px 16px; font-size: 12px; }
.koth-rest a:hover { text-decoration: underline; }
@media (max-width: 600px) { .koth-main { flex-wrap: wrap; } .koth-main .btn { width: 100%; text-align: center; } }
.official .crown { background: var(--strong); color: var(--inv); }
.official .ca { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
.official .ca code { font-family: inherit; color: var(--muted); word-break: break-all; }
.official .ca button { padding: 2px 8px; font-size: 11px; }
.sortbar { display: flex; align-items: center; gap: 10px; margin: -4px 0 12px; }
.imgrow { display: flex; gap: 12px; align-items: flex-start; }
.imgprev { width: 60px; height: 60px; flex: none; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--dim); overflow: hidden; }
.imgprev img { width: 100%; height: 100%; object-fit: cover; }
.imgrow.drag .imgprev { border-color: var(--accent); }
.stat.ok { color: var(--accent); } .stat.warn { color: var(--warn); }
.card.warnbox { border-color: var(--warn); }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.presets button { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 12px; font: inherit; cursor: pointer; }
.presets button.on { border-color: var(--strong); box-shadow: inset 0 0 0 1px var(--strong); }
.splitrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.splitrow > div { flex: 1; min-width: 100px; }
.sharegrid { grid-template-columns: minmax(0, 600px) 1fr; }
@media (max-width: 860px) { .sharegrid { grid-template-columns: 1fr; } }
.h { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }

/* bottom status bar */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .6); display: grid; place-items: center; }
.modal .card { width: min(340px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
.wopt { display: flex; align-items: center; gap: 10px; text-align: left; text-transform: none; letter-spacing: 0; font-size: 13px; }
.wopt img { width: 22px; height: 22px; }
.status { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; align-items: center; font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.status > span { padding: 0 16px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; gap: 6px; }
.status > span:last-child { border-right: 0; border-left: 1px solid var(--line); margin-left: auto; }
.status b { color: var(--text); font-weight: 500; }
.status .dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; }
/* home scene: control wall + live screen + frog */
.scene { position: relative; height: clamp(380px, 50vw, 560px); margin: 6px 0 28px; border: 1.5px solid var(--strong); overflow: hidden; background: var(--panel-2); }
.scene canvas.wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.screen { position: absolute; left: 50%; top: 6%; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); height: 60%;
  background: #050605; border: 5px solid var(--frame); outline: 1.5px solid #1b1b1b; color: #9aa79a; font-size: 12px;
  display: flex; flex-direction: column; z-index: 1; }
.scr-head { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #1d261d; color: #6f7d6f; white-space: nowrap; overflow: hidden; }
.scr-head b { color: #3ddc84; font-weight: 500; }
.scr-head .pulse { color: #3ddc84; animation: blink 2s steps(1) infinite; }
.scr-log { flex: 1; overflow: hidden; padding: 6px 12px; display: flex; flex-direction: column; justify-content: flex-end; }
.scr-log .ln { display: grid; grid-template-columns: 12px 44px 50px minmax(72px, max-content) 1fr; gap: 8px; white-space: nowrap; line-height: 24px; min-height: 24px; flex-shrink: 0; align-items: center; color: #8e9b8e; }
.scr-log a.ln:hover { background: #0e170e; }
.scr-log .ln > span { overflow: hidden; text-overflow: ellipsis; }
.scr-log .gt { color: #3ddc84; }
.scr-log .ev.launch { color: #ffffff; } .scr-log .ev.buy { color: #3ddc84; } .scr-log .ev.sell { color: #ff7b72; }
.scr-log .sym { color: #e6ede6; }
.scr-log .new { animation: appear .5s ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.scr-input { margin: 0 12px 10px; border: 1px solid #1f5e35; padding: 5px 10px; color: #3ddc84; font-size: 12px; }
.scr-input:hover { background: #0e170e; }
.cur { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.crowd { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pepe { position: absolute; }
.pepe svg { width: 100%; height: auto; display: block; transform-origin: 50% 100%; animation: bob var(--dur, 5s) ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-2px) rotate(1.5deg); } }
@media (prefers-reduced-motion: reduce) { .pepe svg, .cur, .scr-head .pulse, .scr-log .new { animation: none; } }
@media (max-width: 600px) {
  .screen { top: 4%; height: 64%; font-size: 11px; }
  .scr-log .ln { grid-template-columns: 40px 38px minmax(60px, max-content) 1fr; gap: 6px; }
  .scr-log .ln .gt { display: none; }
  .scr-head .wide { display: none; }
}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#/" aria-label="PepesFamily home"><span class="mk">P</span><span class="nm">PEPESFAMILY</span></a>
    <nav class="top">
      <a href="#/" data-nav="/">Tokens</a>
      <a href="#/create" data-nav="/create">Launch</a>
      <a href="#/rewards" data-nav="/rewards">Rewards</a>
      <a href="#/nft" data-nav="/nft"><span class="nl">Pepes Earn IMD </span>NFT</a>
      <a href="/world/">World</a>
      <a href="#/admin" data-nav="/admin" id="adminlink" style="display:none">Admin</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon" id="theme" aria-label="Toggle light / dark">◐</button>
    <button id="connect">Connect</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<footer class="status">
  <span><b id="sb-vol">…</b> volume</span>
  <span><b id="sb-hold">…</b> paid to holders</span>
  <span>ETH <b id="sb-eth">…</b></span>
  <span>IMD <b id="sb-imd">…</b></span>
  <span><i class="dot"></i> Robinhood · Ethereum</span>
</footer>

<script>
// ---------------------------------------------------------------- Config
// Robinhood Chain mainnet deployments (see contracts/deployments/).
const CONFIG = {
  chainId: 4663,
  chainName: "Robinhood Chain",
  rpc: "https://robinhood-rpc.publicnode.com",       // reads; swap in a paid RPC for heavy traffic
  walletRpc: "https://rpc.mainnet.chain.robinhood.com", // added to wallets that don't know the chain yet
  explorer: "https://robinhoodchain.blockscout.com",
  blockscoutApi: "https://robinhoodchain.blockscout.com/api/v2", // trade history
  // Launchpads, newest first. New tokens launch on the first one that is live on-chain; tokens from every
  // version stay listed and tradable. v2+: owner() = 0x0 (renounced), standard approvals + permit; v3 also blocks flash-held reward capture.
  // admin: false hides a version on the Admin page (v2 only has a test token, with no fees).
  // v4: rewards a wallet leaves unclaimed for more than 7 days of inactivity expire (expiry: true).
  // v5: the creator chooses where the 3% goes (split: true); token lists are read from its lens contract.
  // `chain` picks the network from CHAINS below (default: Robinhood Chain).
  pads: [
    { version: 5, chain: "ethereum", pad: "0xa89083083119B70c06b372dC85Dc6155a8F568CC", router: "0x28d22B5Ea3631D7f4d5157134DFf09b94d015D16", ethRouter: "0x3cC32f0ff08109D75AC86A9fE7da85DE51C00A3C", lens: "0xfda1aD95068d23b8491D0787Cc374767b0c67864", permit: true, expiry: true, split: true },
    { version: 5, pad: "0xC26003787503b978033427F77047fAF5551Ca8CC", router: "0x515aC666729a73761DA06b323133286C8a968CDf", ethRouter: "0x349059fc128bEe463C1Ee6a732F8201907a78035", lens: "0xd43CE11019393b4C60304978E3d789D316414B20", permit: true, expiry: true, split: true },
    { version: 4, pad: "0x6C08cfB2aB8Dab6d4Bc22ab8F1C248a0268D28cc", router: "0xDB202196E62413c0eFB59e926EA1BD4817dB7226", ethRouter: "0x19f112328cFb44191704Dba441050008Fe85C361", permit: true, expiry: true },

/// Expiry status of a v4 holding: { expired (wei), left (seconds until older rewards start expiring) }.
/// Rewards of `holder` that expired and were sent away (v4+ tokens and $EARN: RewardsRecycled events). The token's
/// withdrawnDividends counts them too, so "claimed" = withdrawnDividends - this. Null if the history can't be read.
const RECYCLED_TOPIC = ethers.id("RewardsRecycled(address,uint256)");
async function recycledOf(token, holder, ch = CHAINS.robinhood, attempt = 0) {
  const want = ethers.zeroPadValue(holder, 32).toLowerCase();
  try {
    let total = 0n, next = null;
    for (let page = 0; page < 20; page++) {
      const r = await fetch(`${ch.blockscoutApi}/addresses/${token}/logs?topic=${RECYCLED_TOPIC}` + (next ? "&" + new URLSearchParams(next) : ""),
        { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("blockscout " + r.status);
      const j = await r.json();
      for (const i of j.items) if (i.topics[0] === RECYCLED_TOPIC && i.topics[1]?.toLowerCase() === want) total += BigInt(i.data);
      if (!j.next_page_params) return total;
      next = j.next_page_params;
    }
    return total;
  } catch {
    // Blockscout rate-limits bursts (the Rewards page asks for every token at once): retry a couple of times.
    if (attempt < 2) {
      await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
      return recycledOf(token, holder, ch, attempt + 1);
    }
    // Fallback: the RPC, filtered by holder (works where the node allows the whole range).
    try {
      const logs = await ch.reader.getLogs({ address: token, topics: [RECYCLED_TOPIC, want], fromBlock: 0, toBlock: "latest" });
      return logs.reduce((t, l) => t + BigInt(l.data), 0n);
    } catch { return null; }
  }
}

  const [last, expired] = await Promise.all([t.lastActive(who), t.expiredRewardsOf(who)]);
  return { expired, last: Number(last), left: Number(last) ? Number(last) + EXPIRY_PERIOD - Date.now() / 1000 : null };
}

/// Gets `spender` allowed to pull `amount` of `token` for a sale. Returns permit {v,r,s} when the user signed one
/// (v2 tokens: no extra transaction), or null when an allowance is in place (existing, or via an approve tx).
async function authorizeSell(P, token, spender, amount, dl) {
  const tok = new ethers.Contract(token, ERC20_ABI, signer);
  if ((await tok.allowance(account, spender)) >= amount) return null;
  if (P.permit) {
    try {
      const [name, nonce] = await Promise.all([tok.name(), tok.nonces(account)]);
      toast("Sign the approval in your wallet (no gas)…", 8000);
      const sig = await signer.signTypedData(
        { name, version: "1", chainId: P.ch.chainId, verifyingContract: token },
        { Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }] },
        { owner: account, spender, value: amount, nonce, deadline: dl },
      );
      const s = ethers.Signature.from(sig);
      return { v: s.v, r: s.r, s: s.s };
    } catch (e) {
      if (e?.code === "ACTION_REJECTED" || e?.code === 4001) throw e; // user said no
      // wallet can't sign typed data: fall back to a normal approval
    }
  }
  toast("Approve the token for selling in your wallet…", 8000);
  await (await tok.approve(spender, amount)).wait();
  return null;
}

  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";

function fmt(wei, max = 4) {
  const n = Number(ethers.formatUnits(wei, 18));
  if (n === 0) return "0";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";

/// Quote per token from a v4 sqrtPriceX96 (price = currency1 per currency0).

  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";

/// A token's creator-supplied metadata, keeping only plain string fields: anything else (objects, numbers, arrays)
/// is dropped, so one odd launch can never break a page.
function meta(json) {
  let m;
  try { m = JSON.parse(json); } catch { return {}; }
  if (typeof m !== "object" || !m || Array.isArray(m)) return {};
  const out = {};
  for (const k of ["image", "description", "website", "x", "telegram"]) if (typeof m[k] === "string") out[k] = m[k];
  return out;
}
function safeUrl(u) {
  if (typeof u !== "string") return "";
  if (u.startsWith("ipfs://")) return IPFS_GATEWAYS[0] + u.slice(7);
  return /^https:\/\//i.test(u) ? u : "";
}
// ipfs.io no longer serves files to other websites, so IPFS images load through these public gateways in order.
const IPFS_GATEWAYS = ["https://ipfs.filebase.io/ipfs/", "https://gateway.pinata.cloud/ipfs/", "https://ipfs.io/ipfs/"];
/// "<cid>[/path]" from ipfs://… or any https gateway link (…/ipfs/<cid> or <cid>.ipfs.host), else "".
function ipfsPath(u) {
  let p = "";
  if (u.startsWith("ipfs://")) p = u.slice(7).replace(/^ipfs\//, "");
  else {
    try {
      const x = new URL(u);
      const sub = x.hostname.match(/^([a-z0-9]{46,})\.ipfs\./i);
      p = x.pathname.startsWith("/ipfs/") ? x.pathname.slice(6) : sub ? sub[1] + x.pathname.replace(/^\/$/, "") : "";
    } catch {}
  }
  return /^[A-Za-z0-9]{46,}(\/[A-Za-z0-9._~%-]+)*$/.test(p) ? p : "";
}
function avatar(info, cls = "") {

  const own = CONFIG.images[String(info.token || "").toLowerCase()];
  const raw = own ? "" : meta(info.metadata).image;
  const ipfs = typeof raw === "string" ? ipfsPath(raw.trim()) : "";
  const img = own || (ipfs ? IPFS_GATEWAYS[0] + ipfs : safeUrl(raw));

             : `<div class="avatar ${cls}">${letter}</div>`;
}
// Broken images try the next IPFS gateway, then fall back to the ticker letters (no inline handlers: names and

document.addEventListener("error", (e) => {

// ---------------------------------------------------------------- Wallet
// Wallet discovery via EIP-6963, so MetaMask, Phantom, Rabby, OKX, ... can all be installed side by side and the
// visitor picks one. Falls back to window.ethereum for wallets that don't announce themselves.
const WALLETS = [];
window.addEventListener("eip6963:announceProvider", (e) => {
  const { info, provider } = e.detail || {};
  if (info?.uuid && provider && !WALLETS.some((w) => w.info.uuid === info.uuid)) WALLETS.push({ info, provider });
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

let WALLET = null, walletName = "Your wallet", listening = null;

/// Name of an injected (pre-EIP-6963) provider from its flags.
function legacyName(p) {
  if (p.isRabby) return "Rabby";
  if (p.isPhantom) return "Phantom";
  if (p.isOkxWallet || p.isOKExWallet) return "OKX Wallet";
  if (p.isCoinbaseWallet) return "Coinbase Wallet";
  if (p.isBraveWallet) return "Brave Wallet";
  if (p.isTrust || p.isTrustWallet) return "Trust Wallet";
  if (p.isMetaMask) return "MetaMask";
  return "Browser wallet";
}
/// Every wallet we can offer: EIP-6963 announcements first, then injected providers that didn't announce themselves
/// (window.ethereum and the `providers` list some extensions add), so older or late-loading wallets still show up.
async function walletOptions() {
  window.dispatchEvent(new Event("eip6963:requestProvider")); // wallets that loaded after the page
  await new Promise((ok) => setTimeout(ok, 250));
  const out = [...WALLETS];
  const injected = [...(Array.isArray(window.ethereum?.providers) ? window.ethereum.providers : []), window.ethereum].filter(Boolean);
  for (const p of injected) {
    if (out.some((w) => w.provider === p)) continue;
    const name = legacyName(p);
    // a wallet that announced itself under the same name is the same wallet (its injected object can differ)
    if (name !== "Browser wallet" && out.some((w) => w.info.name.toLowerCase().includes(name.toLowerCase()))) continue;
    out.push({ provider: p, info: { name, icon: "" } });
  }
  return out;
}

async function pickWallet() {
  const opts = await walletOptions();
  if (opts.length <= 1) return opts[0] || null;
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="card"><span class="h">Connect a wallet</span>
      ${opts.map((w, i) => `<button class="wopt" data-i="${i}">${/^data:image\//.test(w.info.icon || "") ? `<img src="${esc(w.info.icon)}" alt="" />` : ""}<span>${esc(w.info.name)}</span></button>`).join("")}
      <button class="wopt" data-cancel="1">Cancel</button></div>`;
    m.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b && ev.target !== m) return; // click inside the card, not on a button
      m.remove();
      resolve(b && b.dataset.i != null ? opts[Number(b.dataset.i)] : null);
    };
    document.body.appendChild(m);
  });
}

function listen(eth) {
  if (listening === eth) return;
  listening = eth;
  eth.on?.("accountsChanged", (accs) => {
    signer = null; account = null; $("#connect").textContent = "Connect"; $("#connect").classList.remove("addr");
    if (accs?.length) connect().catch(() => {});
  });
  // Switching network inside the wallet: the signer is rebuilt for the new network before the next action.
  eth.on?.("chainChanged", () => { signer = null; });
}

/// Connects the wallet and switches it to `ch` (Robinhood Chain by default). `quiet` skips the page re-render
/// (used when an action switches the network in the middle of a flow).
async function connect(ch = CHAINS.robinhood, quiet = false) {
  const picked = WALLET ? { provider: WALLET, info: { name: walletName } } : await pickWallet();
  if (!picked) {
    if (!WALLETS.length && !window.ethereum) toast("No wallet found. Install a browser wallet such as MetaMask, Rabby or Phantom.");
    return;
  }
  const eth = picked.provider;
  walletName = picked.info?.name || "Your wallet";
  // Ask for the account first: some wallets (Phantom) reject every other request until the site is authorized.
  await eth.request({ method: "eth_requestAccounts" });
  const hex = "0x" + ch.chainId.toString(16);
  if ((await eth.request({ method: "eth_chainId" })) !== hex) {
    try {
      await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
    } catch (e) {
      const code = e?.code ?? e?.data?.originalError?.code;
      if (code === 4001) throw e; // user said no
      try {
        await eth.request({ method: "wallet_addEthereumChain", params: [{
          chainId: hex, chainName: ch.name, rpcUrls: [ch.walletRpc],
          nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, blockExplorerUrls: [ch.explorer],
        }] });
        // Adding a network doesn't always select it (EIP-3085): ask to switch again.
        if ((await eth.request({ method: "eth_chainId" })) !== hex) {
          await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
        }
      } catch (e2) {
        if ((e2?.code ?? 0) === 4001) throw e2;
        throw new Error(`${walletName} couldn't switch to ${ch.name}. Select ${ch.name} in ${walletName} (chain ID ${ch.chainId}) and try again.`);
      }
    }
    // Never continue on another network: every wallet write that follows assumes `ch`.
    if ((await eth.request({ method: "eth_chainId" })) !== hex) {
      signer = null;
      throw new Error(`Your wallet is still on another network. Select ${ch.name} in ${walletName} (chain ID ${ch.chainId}) and try again.`);
    }
  }
  WALLET = eth;
  listen(eth);
  const provider = new ethers.BrowserProvider(eth);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  // account is a checksummed hex address (safe as HTML); the first part is hidden on very narrow screens
  $("#connect").innerHTML = `<span class="a1">${account.slice(0, 6)}</span>…${account.slice(-4)}`;
  $("#connect").classList.add("addr");
  showAdminLink().catch(() => {});
  if (!quiet) route();
}
/// Makes sure a wallet is connected on `ch` (switching networks if needed) before an action there. Quiet: the page
/// isn't re-rendered, so the action in progress keeps its form. Ends by asking the wallet itself which network it is
/// on, and refuses to go on unless it is `ch`, so no transaction is ever requested on the wrong network.
async function requireWallet(ch = CHAINS.robinhood) {
  if (!signer) await connect(ch, true);
  if (!signer) throw new Error("Connect a wallet first");
  const want = "0x" + ch.chainId.toString(16);
  if ((await WALLET.request({ method: "eth_chainId" })) !== want) await connect(ch, true);
  if (!signer || (await WALLET.request({ method: "eth_chainId" })) !== want) {
    signer = null;
    throw new Error(`Switch your wallet to ${ch.name} (chain ID ${ch.chainId}) and try again.`);
  }
  // The signer must be bound to `ch` too (it is rebuilt by connect after a switch).
  if (Number((await signer.provider.getNetwork()).chainId) !== ch.chainId) {
    signer = await new ethers.BrowserProvider(WALLET).getSigner();
  }
}
$("#connect").onclick = () => connect().catch((e) => toast(errMsg(e), 7000));

async function ensureImdAllowance(amount, spender, imdAddr = CONFIG.imd) {
  const imd = new ethers.Contract(imdAddr, ERC20_ABI, signer);
  const current = await imd.allowance(account, spender);
  if (current >= amount) return;
  toast("Approve IMD in your wallet…", 8000);
  const tx = await imd.approve(spender, amount);
  await tx.wait();
}

  // A failed read means the chain's RPC is down or unreachable, which is not the same as no launchpad.
  if (PADS.some((P) => P.readErr)) {
    $("#app").innerHTML = `<div class="card empty"><h2>Can't reach the chain right now</h2>

    $("#reloadchain").onclick = async () => {

}

const Scene = (() => {

        ctx.textBaseline = "middle";
        const d = new Date(), txt = s < 0.5
          ? [d.getHours(), d.getMinutes(), d.getSeconds()].map((v) => String(v).padStart(2, "0")).join(":")
          : String(Math.floor(s * 900000 + t * 3)).slice(-6);
        ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip(); ctx.fillText(txt, ix + 4, iy + ih / 2 + 1); ctx.restore();
        break;
      }
      case "sliders": {
        const n = Math.max(2, Math.floor(iw / 12));
        for (let i = 0; i < n; i++) {
          const sx = ix + (i + 0.5) * (iw / n);
          ctx.beginPath(); ctx.moveTo(sx, iy); ctx.lineTo(sx, iy + ih); ctx.stroke();
          const ky = iy + ih * (0.15 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 2.1 + s * 9)));
          ctx.fillRect(sx - 4, ky - 2, 8, 4);
        }
        break;
      }
      case "grill": for (let yy = iy + 2; yy < iy + ih; yy += 5) { ctx.beginPath(); ctx.moveTo(ix, yy); ctx.lineTo(ix + iw, yy); ctx.stroke(); } break;
      case "dial": {
        const cx = ix + iw / 2, cy = iy + ih / 2, r = Math.min(iw, ih) / 2 - 1;
        circle(cx, cy, r);
        for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.82); ctx.stroke(); }
        const a = t * 0.6 + s * 10;
        ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7); ctx.stroke();
        break;
      }
      case "buttons": {
        const bw = 12, n = Math.max(1, Math.floor(iw / (bw + 4))), on = Math.floor(h01(s * 77 + Math.floor(t / 3)) * n);
        for (let i = 0; i < n; i++) {
          const bx = ix + i * (bw + 4), bh = Math.min(10, ih);
          if (i === on) { ctx.fillStyle = m.hl ? C.green : C.lit; ctx.fillRect(bx, iy + (ih - bh) / 2, bw, bh); }
          else ctx.strokeRect(bx + 0.5, iy + (ih - bh) / 2 + 0.5, bw - 1, bh - 1);
        }
        break;
      }
    }
  }

  function draw(t) {
    C = isDark() ? DARK : LIGHT;
    const wallH = H - floorH();
    ctx.fillStyle = C.wall; ctx.fillRect(0, 0, W, wallH);
    for (const m of mods) mod(m, t);
    // a dark baseboard, then a speckled floor
    ctx.fillStyle = "#121212"; ctx.fillRect(0, wallH, W, Math.max(8, floorH() * 0.3));
    const fy = wallH + Math.max(8, floorH() * 0.3);
    ctx.fillStyle = "#f2f2ef"; ctx.fillRect(0, fy, W, H - fy);
    ctx.fillStyle = "#2a2a2a";
    for (const [a, b, c] of specks) ctx.fillRect(a * W, fy + b * (H - fy), 1 + c * 2, 1);
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!visible || document.hidden || now - last < 110) return;
    last = now;
    draw(now / 1000);
  }

  function size() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(); crowd(); draw(performance.now() / 1000);
  }

  // The Pepes: two rows of frogs on the floor, back row smaller, each swaying on its own rhythm.
  function crowd() {
    if (!crowdEl) return;
    const r = rng(11), base = Math.max(38, Math.min(80, W * 0.062)), out = [];
    for (const [row, scale, lift] of [[0, 0.8, 0.07], [1, 1, 0.008]]) {
      const w = base * scale;
      for (let x = -w * 0.35 + r() * w * 0.4 + row * w * 0.6; x < W - w * 0.45; x += w * (1.12 + r() * 0.4)) {
        const s = scale * (0.9 + r() * 0.2);
        out.push(`<div class="pepe" style="left:${(x + (r() - 0.5) * w * 0.2).toFixed(1)}px;bottom:${(lift * H + r() * 3).toFixed(1)}px;width:${(base * s).toFixed(1)}px;--d:-${(r() * 5).toFixed(2)}s;--dur:${(4 + r() * 3).toFixed(2)}s">${FROG_SVG}</div>`);
      }
    }
    crowdEl.innerHTML = out.join("");
  }

  function mount(root) {
    unmount();
    canvas = root.querySelector("canvas.wall");
    crowdEl = root.querySelector(".crowd");
    ctx = canvas.getContext("2d");
    size();
    ro = new ResizeObserver(() => size()); ro.observe(canvas);
    io = new IntersectionObserver(([e]) => (visible = e.isIntersecting)); io.observe(canvas);
    if (!reduce) raf = requestAnimationFrame(frame);
  }

  function unmount() {
    cancelAnimationFrame(raf); raf = 0;
    ro?.disconnect(); io?.disconnect(); ro = io = null;
  }

  return { mount, unmount };
})();

/// Live terminal: recent launches and trades across every launchpad version, polled every 20 s.
const Feed = (() => {
  let timer = 0, seen = new Set(), tokens = new Map();
  const hhmm = (sec) => new Date(sec * 1000).toTimeString().slice(0, 5);

  async function loadTokens() {
    const lists = await Promise.all(livePads().map(async (P) => {
      const n = Number(await P.c.tokenCount());
      const out = [];
      for (let off = 0; off < n; off += 100) out.push(...(await P.v.getTokens(off, 100)));
      return out;
    }));
    for (const t of lists.flat().filter(isListed)) tokens.set(t.token.toLowerCase(), t);
    const n = $("#scr-n"); if (n) n.textContent = String(tokens.size);
  }

  async function recentTrades() {
    const out = [];
    await Promise.all(livePads().map(async (P) => {
      const topic = P.c.interface.getEvent("Trade").topicHash;
      try {
        const r = await fetch(`${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic}`, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return;
        for (const i of (await r.json()).items) {
          if (i.topics[0] !== topic) continue;
          const a = P.c.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args;
          out.push({ key: i.transaction_hash + ":" + i.index, ts: Date.parse(i.block_timestamp) / 1000, kind: a.isBuy ? "buy" : "sell", token: a.token, a });
        }
      } catch {}
    }));
    return out;
  }

  function line(e, fresh) {
    const t = tokens.get(e.token.toLowerCase());
    if (!t) return "";
    const sym = "$" + esc(t.symbol);
    const detail = e.kind === "launch"
      ? `${qsym(t.quote)} pair · MC ${usd(t.marketCap, t.quote)}`
      : `${fmt(e.a.tokenAmount)} · ${usd(e.a.quoteAmount, t.quote)}`;
    return `<a class="ln${fresh ? " new" : ""}" href="#/t/${t.token}"><span class="gt">&gt;</span><span>${hhmm(e.ts)}</span><span class="ev ${e.kind}">${e.kind}</span><span class="sym">${sym}</span><span>${esc(detail)}</span></a>`;
  }

  /// Shows only the newest rows that fit completely (24px each), so no row is ever cut in half.
  function wholeRows(log) {
    const room = Math.max(1, Math.floor((log.clientHeight - 12) / 24));
    const rows = [...log.children];
    rows.forEach((el, i) => { el.hidden = i < rows.length - room; });
  }
  addEventListener("resize", () => { const log = $("#scr-log"); if (log) wholeRows(log); });

  async function tick(first) {
    const log = $("#scr-log");
    if (!log) return stop();
    try {
      await loadTokens();
      const events = [
        ...[...tokens.values()].map((t) => ({ key: "launch:" + t.token, ts: Number(t.createdAt), kind: "launch", token: t.token })),
        ...(await recentTrades()),
      ].sort((x, y) => x.ts - y.ts);
      const fresh = events.filter((e) => !seen.has(e.key));
      fresh.forEach((e) => seen.add(e.key));
      if (first) {
        log.innerHTML = events.slice(-28).map((e) => line(e, false)).join("") || `<div class="ln"><span></span><span></span><span class="ev">idle</span><span>no activity yet</span></div>`;
      } else if (fresh.length) {
        log.insertAdjacentHTML("beforeend", fresh.map((e) => line(e, true)).join(""));
        while (log.children.length > 40) log.firstElementChild.remove();
      }
      wholeRows(log);
    } catch (e) {
      if (first) log.innerHTML = `<div class="ln"><span></span><span></span><span class="ev sell">error</span><span>${esc(errMsg(e))}</span></div>`;
    }
  }

  function start() { stop(); seen = new Set(); tick(true); timer = setInterval(() => tick(false), 20000); }
  function stop() { clearInterval(timer); timer = 0; }
  return { start, stop };
})();

// ---------------------------------------------------------------- King of the hill
/// Trade events since `sinceTs` (unix seconds) from the given launchpads, via Blockscout (newest first, paged).
async function tradesSince(sinceTs, pads) {
  const out = [];
  await Promise.all(pads.map(async (P) => {
    const topic = P.c.interface.getEvent("Trade").topicHash;
    let next = null;
    for (let page = 0; page < 20; page++) {
      const r = await fetch(`${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic}` + (next ? "&" + new URLSearchParams(next) : ""),
        { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error("blockscout " + r.status);
      const j = await r.json();
      let reachedOlder = false;
      for (const i of j.items) {
        const ts = Date.parse(i.block_timestamp) / 1000;
        if (ts < sinceTs) { reachedOlder = true; continue; }
        if (i.topics[0] !== topic) continue;
        out.push(P.c.interface.parseLog({ topics: i.topics.filter(Boolean), data: i.data }).args);
      }
      if (reachedOlder || !j.next_page_params) break;
      next = j.next_page_params;
    }
  }));
  return out;
}

// ---------------------------------------------------------------- Platform totals
/// All-time totals across every launchpad version, summed per quote asset (ETH / IMD) and shown in USD.
///   Holders:  for each token, dividends already distributed + holder fees still waiting to be flushed.
///   Protocol: fees already collected (ProtocolFeesCollected events) + fees pending in each launchpad.
async function loadTotals() {
  const holders = { [ZERO]: 0n, [CONFIG.imd]: 0n };
  const proto = { [ZERO]: 0n, [CONFIG.imd]: 0n };
  const add = (m, q, w) => { m[q] = (m[q] ?? 0n) + w; };
  let protocolExact = true;

  await Promise.all(livePads().map(async (P) => {
    const n = Number(await P.c.tokenCount());
    // Per quote asset, for this launchpad: holder earnings, and the protocol fees they imply (an estimate used only
    // if the collection history can't be read). The protocol fee is 1% of each trade; holders get h% of it per the
    // token's split (3% before v5), so protocol = holder earnings x 1 / h. Tokens paying holders nothing can't be
    // estimated this way and count as zero there.
    const estimate = {};
    for (let off = 0; off < n; off += 100) {
      const list = await P.v.getTokens(off, 100);
      const splits = await Promise.all(list.map((t) => splitOf(P, t.token).catch(() => null)));
      list.forEach((t, i) => {
        const earned = t.totalDividendsDistributed + t.pendingHolderFees;
        add(holders, t.quote, earned);
        const hBps = BigInt(splits[i] ? splits[i].h : 300);
        if (hBps > 0n) add(estimate, t.quote, (earned * 100n) / hBps);
      });
    }
    const pending = {};
    const [pe, pi] = await Promise.all([P.c.pendingProtocolFees(ZERO), P.c.pendingProtocolFees(P.ch.imd)]);
    add(pending, ZERO, pe); add(pending, P.ch.imd, pi);
    try {
      const collected = {};
      for (const ev of await fetchPadLogs(P, P.c.interface.getEvent("ProtocolFeesCollected").topicHash)) {
        const { quote, amount } = P.c.interface.parseLog(ev).args;
        add(collected, quote, amount);
      }
      for (const [q, w] of Object.entries(pending)) add(proto, q, w);
      for (const [q, w] of Object.entries(collected)) add(proto, q, w);
    } catch {
      // History unavailable: use the estimate, but never less than the pending fees already read.
      protocolExact = false;
      for (const q of new Set([...Object.keys(pending), ...Object.keys(estimate)])) {
        const e = estimate[q] ?? 0n, p = pending[q] ?? 0n;
        add(proto, q, e > p ? e : p);
      }
    }
  }));

  const toUsd = (m) => Object.entries(m).reduce((s, [q, wei]) => s + Number(ethers.formatUnits(wei, 18)) * quoteUsd(q), 0);
  const parts = (m) => Object.entries(m).filter(([, w]) => w > 0n).map(([q, w]) => `${fmt(w)} ${qsym(q)}`).join(" + ") || "nothing yet";
  // The protocol fee is exactly 1% of each trade's quote amount, so volume = protocol fees × 100.
  const volume = Object.fromEntries(Object.entries(proto).map(([q, w]) => [q, w * 100n]));
  const approx = protocolExact ? "" : "≈ ";

  // bottom status bar (every page)
  $("#sb-vol").textContent = approx + fmtUsd(toUsd(volume));
  $("#sb-hold").textContent = fmtUsd(toUsd(holders));
  if ($("#scr-vol")) { $("#scr-vol").textContent = $("#sb-vol").textContent; $("#scr-hold").textContent = $("#sb-hold").textContent; }

  if (!$("#tot-holders")) return; // not on the home page
  $("#tot-holders").textContent = fmtUsd(toUsd(holders));
  $("#tot-holders-sub").textContent = `holders' share of every trade · ${parts(holders)}`;
  $("#tot-protocol").textContent = approx + fmtUsd(toUsd(proto));
  $("#tot-protocol-sub").textContent = `1% of every trade · ${parts(proto)}`;
  $("#tot-volume").textContent = approx + fmtUsd(toUsd(volume));
  $("#tot-volume-sub").textContent = `all time · ${parts(volume)}`;
}

/// All logs a launchpad emitted with `topic0`, via Blockscout's API (paginated).
async function fetchPadLogs(P, topic0) {
  const url = `${P.ch.blockscoutApi}/addresses/${P.pad}/logs?topic=${topic0}`;
  const items = [];
  let next = null;
  for (let page = 0; page < 20; page++) {
    const r = await fetch(url + (next ? "&" + new URLSearchParams(next).toString() : ""), { signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error("blockscout " + r.status);
    const j = await r.json();
    items.push(...j.items.filter((i) => i.topics[0] === topic0).map((i) => ({ topics: i.topics.filter(Boolean), data: i.data })));
    if (!j.next_page_params) break;
    next = j.next_page_params;
  }
  return items;
}

/// v4 admin: every address that ever sent or received `token` (Blockscout token transfers), so wallets that sold
/// everything but left rewards unclaimed are found too. Excluded system accounts report 0 expired and drop out.
async function tokenParticipants(token, ch = CHAINS.robinhood) {
  const seen = new Set();
  let next = null;
  for (let page = 0; page < 200; page++) {
    const r = await fetch(`${ch.blockscoutApi}/tokens/${token}/transfers` + (next ? "?" + new URLSearchParams(next) : ""),
      { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error(`Blockscout answered ${r.status}`);
    const j = await r.json();
    for (const it of j.items || []) for (const a of [it.from?.hash, it.to?.hash]) if (a && ethers.isAddress(a)) seen.add(ethers.getAddress(a));
    next = j.next_page_params;
    if (!next) break;
  }
  return [...seen];
}

/// A token's logo for drawing on a canvas: the site's own image, else its IPFS image through each gateway, else its
/// https image. Loaded with CORS so the canvas stays exportable; null when none loads (the card shows the ticker).
async function cardLogo(info) {
  const own = CONFIG.images[String(info.token || "").toLowerCase()];
  const raw = own ? "" : meta(info.metadata).image;
  const ipfs = typeof raw === "string" ? ipfsPath(raw.trim()) : "";
  const urls = own ? [own] : ipfs ? IPFS_GATEWAYS.map((g) => g + ipfs) : safeUrl(raw) ? [safeUrl(raw)] : [];
  for (const u of urls) {
    const im = await new Promise((res) => {
      const i = new Image();
      const t = setTimeout(() => res(null), 7000);
      i.crossOrigin = "anonymous";
      i.referrerPolicy = "no-referrer";
      i.onload = () => { clearTimeout(t); res(i); };
      i.onerror = () => { clearTimeout(t); res(null); };
      i.src = u;
    });
    if (im && im.naturalWidth) return im;
  }
  return null;
}

/// Black grid, floor and the frog crowd: the background every share card shares. Returns the drawing helpers.
async function cardBase() {
  const W = 1200, H = 675, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  try { await Promise.all([400, 500, 600].map((w) => document.fonts.load(`${w} 24px "IBM Plex Mono"`))); } catch {}
  const F = (w, s) => `${w} ${s}px "IBM Plex Mono", ui-monospace, Menlo, monospace`;
  const fit = (txt, w, size, max) => { g.font = F(w, size); while (g.measureText(txt).width > max && size > 14) g.font = F(w, (size -= 2)); };
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "#0d170d"; g.lineWidth = 1;
  for (let x = 40; x < W; x += 40) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
  for (let y = 40; y < H; y += 40) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
  const floor = H - 70;
  g.fillStyle = "#0b0f0b"; g.fillRect(0, floor, W, H - floor);
  g.fillStyle = "#3ddc84"; g.fillRect(0, floor, W, 2);
  const frog = await new Promise((res) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(FROG_SVG.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="122" '));
  });
  if (frog) {
    for (const [x, w, lift] of [[800, 92, 34], [905, 98, 38], [1012, 90, 32], [1100, 84, 36], [745, 118, 0], [858, 128, 4], [985, 122, 0], [1095, 112, 2]]) {
      g.drawImage(frog, x, floor + 22 - lift - w * 1.22, w, w * 1.22);
    }
  }
  g.textBaseline = "middle";
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(60, 56, 44, 44);
  g.fillStyle = "#fff"; g.fillRect(104, 56, 214, 44);
  g.font = F(600, 22); g.textAlign = "center"; g.fillText("P", 82, 79);
  g.fillStyle = "#000"; g.font = F(500, 18); g.fillText("PEPESFAMILY", 211, 79);
  g.textAlign = "left";
  return { c, g, F, fit, W, H, floor };
}

/// One token's card: its launch logo, ticker, what this wallet earned holding it, and its share of the supply.
async function tokenShareCard(r, amt, holderPct) {
  const { c, g, F, fit, W, floor } = await cardBase();
  const x0 = 60, y0 = 150, S = 230;
  const logo = await cardLogo(r.t);
  g.save();
  g.beginPath(); g.roundRect(x0, y0, S, S, 28); g.clip();
  if (logo) {
    // cover-fit the logo into the square
    const k = Math.max(S / logo.naturalWidth, S / logo.naturalHeight), w = logo.naturalWidth * k, h = logo.naturalHeight * k;
    g.drawImage(logo, x0 + (S - w) / 2, y0 + (S - h) / 2, w, h);
  } else {
    g.fillStyle = "#16301a"; g.fillRect(x0, y0, S, S);
    g.fillStyle = "#3ddc84"; g.font = F(600, 96); g.textAlign = "center";
    g.fillText((r.t.symbol || "?").slice(0, 2).toUpperCase(), x0 + S / 2, y0 + S / 2 + 4);
    g.textAlign = "left";
  }
  g.restore();
  g.strokeStyle = "#3ddc84"; g.lineWidth = 3; g.beginPath(); g.roundRect(x0, y0, S, S, 28); g.stroke();

  const tx = x0 + S + 44, maxW = W - tx - 60;
  g.fillStyle = "#fff"; fit("$" + r.t.symbol, 600, 56, maxW); g.fillText("$" + r.t.symbol, tx, y0 + 30);
  g.fillStyle = "#8c8c8c"; fit(r.t.name, 400, 24, maxW); g.fillText(r.t.name, tx, y0 + 78);
  g.fillStyle = "#8c8c8c"; g.font = F(500, 20); g.fillText("HOLDER REWARDS EARNED", tx, y0 + 132);
  g.fillStyle = "#3ddc84"; fit(amt, 600, 76, maxW); g.fillText(amt, tx, y0 + 188);
  const parts = [`${fmt(r.earned, 4)} ${qsym(r.t.quote)}`];
  const pct = Number((r.bal * 1000000n) / SUPPLY) / 10000;
  if (pct > 0) parts.push(`holding ${pct}% of supply`);
  g.fillStyle = "#fff"; fit(parts.join(" · "), 400, 22, maxW); g.fillText(parts.join(" · "), tx, y0 + 244);
  const chain = r.P.ch.name.toUpperCase();
  g.font = F(500, 16); const cw = g.measureText(chain).width + 24;
  g.strokeStyle = "#3ddc84"; g.lineWidth = 1.5; g.strokeRect(x0, y0 + S + 34, cw, 32);
  g.fillStyle = "#3ddc84"; g.fillText(chain, x0 + 12, y0 + S + 51);

  g.fillStyle = "#8c8c8c"; fit(`${holderPct}% of every $${r.t.symbol} trade goes to holders`, 400, 20, 640);
  g.fillText(`${holderPct}% of every $${r.t.symbol} trade goes to holders`, 60, floor + 36);
  g.fillStyle = "#fff"; g.font = F(600, 20); g.textAlign = "right"; g.fillText("pepesfamily.fun", W - 60, floor + 36);
  return c.toDataURL("image/png");
}

// ---------------------------------------------------------------- Pepes Earn IMD NFT
const EARN = CONFIG.earn;
const EARN_TOTAL = 2000;
const DAY = 86400;

/// Name, image (SVG data: URI) and traits of NFT `id`, drawn by the on-chain renderer. Works for every id 1..2000,
/// minted or not; cached because each call renders the SVG on-chain.
const nftMetaCache = new Map();
function nftMeta(id) {
  if (!nftMetaCache.has(id)) {
    const p = new ethers.Contract(EARN.renderer, RENDERER_ABI, reader).tokenURI(id).then((uri) => {
      const json = JSON.parse(new TextDecoder().decode(ethers.decodeBase64(uri.slice(uri.indexOf(",") + 1))));
      return {
        name: String(json.name || `Pepes Earn IMD #${id}`),
        image: typeof json.image === "string" && json.image.startsWith("data:image/svg+xml;base64,") ? json.image : "",
        attributes: Array.isArray(json.attributes) ? json.attributes : [],
      };
    });
    p.catch(() => nftMetaCache.delete(id));
    nftMetaCache.set(id, p);
  }
  return nftMetaCache.get(id);
}
const pad4 = (id) => String(id).padStart(4, "0");
/// A clickable NFT tile; the image fills in once the renderer answers.
const nftTile = (id, sub = "") =>
  `<button type="button" class="nftc" data-nft="${id}"><span class="nimg" data-img="${id}"></span><span class="cap"><b>#${pad4(id)}</b>${sub ? `<span class="muted">${esc(sub)}</span>` : ""}</span></button>`;
function hydrateNfts(root) {
  root.querySelectorAll("[data-img]").forEach((el) => {
    const id = Number(el.dataset.img);
    el.removeAttribute("data-img");
    nftMeta(id).then((m) => { if (m.image) el.innerHTML = `<img src="${esc(m.image)}" alt="${esc(m.name)}" loading="lazy">`; }).catch(() => {});
  });
  root.querySelectorAll("button[data-nft]").forEach((b) => (b.onclick = () => showNft(Number(b.dataset.nft))));
}

async function showNft(id) {
  const opener = document.activeElement;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="card big" role="dialog" aria-modal="true" aria-labelledby="nfttitle" tabindex="-1">
    <span class="h" id="nfttitle" style="margin:0 0 8px">Pepes Earn IMD #${id}</span>
    <div class="nbig" data-img="${id}"></div><div id="nftinfo" class="stat">Loading…</div><button type="button" data-close="1">Close</button></div>`;
  const dialog = m.firstElementChild;
  // Everything behind the dialog is inert while it is open; focus moves in, stays in, and returns on close.
  const behind = [...document.body.children];
  behind.forEach((el) => { el.inert = true; });
  const close = () => {
    behind.forEach((el) => { el.inert = false; });
    m.remove();
    document.removeEventListener("keydown", onKey, true);
    if (opener && document.contains(opener)) opener.focus();
  };
  const onKey = (ev) => {
    if (ev.key === "Escape") { ev.preventDefault(); return close(); }
    if (ev.key !== "Tab") return;
    const f = [...dialog.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  };
  m.onclick = (ev) => { if (ev.target === m || ev.target.closest("[data-close]")) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(m);
  dialog.querySelector("[data-close]").focus();
  hydrateNfts(m);
  try {
    const [meta, owner] = await Promise.all([nftMeta(id), new ethers.Contract(EARN.mirror, MIRROR_ABI, reader).ownerAt(id)]);
    const minted = owner !== ZERO;
    $("#nftinfo", m).innerHTML = `<table>${meta.attributes.map((a) => `<tr><td class="muted">${esc(a.trait_type)}</td><td>${esc(a.value)}</td></tr>`).join("")}
      <tr><td class="muted">Owner</td><td>${minted ? `<a class="mono" href="${CONFIG.explorer}/address/${owner}" target="_blank" rel="noopener">${short(owner)} ↗</a>` : "Not minted yet: buy from the pool to mint"}</td></tr></table>
      ${minted ? `<a class="stat" href="${CONFIG.explorer}/token/${EARN.mirror}/instance/${id}" target="_blank" rel="noopener" style="text-decoration:underline">View on explorer ↗</a>` : ""}`;
  } catch (e) { $("#nftinfo", m).textContent = errMsg(e); }
}

/// Community tools, open to every wallet (the contracts cap and pace them so nobody can profit from timing them):
/// $Pepes buyback-and-burn from the expired-rewards reserve and recycling expired rewards.
async function renderNftTools(reserve) {
  const el = $("#nadmin");
  if (!el) return;
  const tokR = new ethers.Contract(EARN.token, EARN_ABI, reader);
  const v1 = PADS.find((p) => p.version === 1 && p.live);
  const now = Date.now() / 1000;
  let maxBuy = 0n, lastBuy = 0n;
  try {
    [maxBuy, lastBuy] = await Promise.all([tokR.maxBuyback(), tokR.lastBuyback()]);
  } catch (e) { return (el.innerHTML = `<span class="h">Community tools</span><div class="stat">${esc(errMsg(e))}</div>`); }
  const buyNow = reserve < maxBuy ? reserve : maxBuy;
  const wait = (last) => Math.max(0, Math.ceil((Number(last) + 3600 - now) / 60));
  const buyWait = wait(lastBuy);
  let pepesQuote = 0n;
  try {
    if (buyNow > 0n && v1) {
      const info = await v1.v.getTokenInfo(CONFIG.pepes);
      pepesQuote = await quoteSwap(v1, CONFIG.pepes, info.quoteIsCurrency0, true, buyNow);
    }
  } catch {}
  el.innerHTML = `<span class="h">Community tools</span>
    <p class="stat" style="margin:0 0 8px">Anyone can run these. The buyback is limited per call and to once an hour, so nobody can profit from timing it, and the reserve can only buy $Pepes for the burn.</p>
    <div class="stat">Buyback reserve: <b>${fmt(reserve, 6)} IMD</b>${buyNow > 0n && buyNow < reserve ? ` · next burn uses ${fmt(buyNow, 6)} IMD` : ""}${pepesQuote ? ` → ≈ ${fmt(pepesQuote)} $Pepes` : ""}</div>
    <button class="full" id="nbuyback" ${buyNow === 0n || buyWait ? "disabled" : ""}>${buyWait && buyNow ? `Next buyback in ${buyWait} min` : "Buy back &amp; burn $Pepes"}</button>
    <label for="nrecycle">Recycle a wallet's expired rewards</label>
    <form id="nrecf" class="row" style="flex-wrap:nowrap"><input id="nrecycle" placeholder="0x…" spellcheck="false"><button type="submit">Recycle</button></form>
    <p class="stat" style="margin:10px 0 0">Nobody can withdraw the reserve. Protocol fees and holder payouts: <a href="#/admin" style="text-decoration:underline">Admin</a>.</p>`;
  const run = async (btn, fn, done) => {
    btn.disabled = true;
    try { await requireWallet(); toast("Confirm in your wallet…", 8000); const tx = await fn(); toast("Sent…", 15000); await tx.wait(); toast(done); renderNft(); }
    catch (e) { toast(errMsg(e), 7000); btn.disabled = false; }
  };
  $("#nbuyback").onclick = () => run($("#nbuyback"), () =>
    new ethers.Contract(EARN.token, EARN_ABI, signer).buybackAndBurnPepes(withSlippage(pepesQuote, 300), deadline()), "$Pepes bought back and burned");
  $("#nrecf").onsubmit = async (e) => {
    e.preventDefault();
    const who = $("#nrecycle").value.trim();
    if (!ethers.isAddress(who)) return toast("Enter a valid address");
    const exp = await tokR.expiredRewardsOf(who).catch(() => 0n);
    if (exp === 0n) return toast("Nothing has expired for this wallet");
    run($("#nrecf button"), () => new ethers.Contract(EARN.token, EARN_ABI, signer).recycle(who), `${fmt(exp, 6)} IMD recycled`);
  };
}

/// Turns common share links into direct image links (IPFS gateway links -> ipfs://, Dropbox -> raw file, GitHub
/// file page -> raw file, Google Drive file -> image). Anything else is returned as typed.
function fixImageLink(u) {
  u = u.trim();
  if (!u) return "";
  const ipfs = ipfsPath(u);
  if (ipfs) return "ipfs://" + ipfs;
  try {
    const x = new URL(u);
    if (/(^|\.)dropbox\.com$/.test(x.hostname) && x.searchParams.has("dl")) {
      x.searchParams.delete("dl"); x.searchParams.set("raw", "1"); return x.href;
    }
    if (x.hostname === "github.com") {
      const m = x.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
      if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
    }
    if (x.hostname === "drive.google.com") {
      const id = x.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || x.searchParams.get("id");
      if (id && /^[\w-]+$/.test(id)) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    }
  } catch {}
  return u;
}
function loadImage(src, ms = 15000) {
  return new Promise((resolve) => {
    const im = new Image();
    im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => { im.src = ""; resolve(false); }, ms);
    im.onload = () => { clearTimeout(t); resolve(im.naturalWidth > 0); };
    im.onerror = () => { clearTimeout(t); resolve(false); };
    im.src = src;
  });
}
/// The URL the site will show for `link` if it really is an image (IPFS: first gateway that serves it), else "".
async function imageLoads(link) {
  const p = ipfsPath(link);
  if (p) { for (const g of IPFS_GATEWAYS) if (await loadImage(g + p)) return g + p; return ""; }
  const s = safeUrl(link);
  return s && (await loadImage(s)) ? s : "";
}
/// Reads an image file and scales it to fit 512×512 (small GIFs are kept as they are, so they stay animated).
async function shrinkImage(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) throw new Error("Use a PNG, JPG, GIF or WEBP image");
  const dataUrl = await new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(r.result); r.onerror = () => bad(new Error("Couldn't read that file"));
    r.readAsDataURL(file);
  });
  if (file.type === "image/gif" && file.size <= 1024 * 1024) return dataUrl;
  const im = new Image();
  await new Promise((ok, bad) => { im.onload = ok; im.onerror = () => bad(new Error("That file isn't a valid image")); im.src = dataUrl; });
  const k = Math.min(1, 512 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  let out = c.toDataURL("image/webp", 0.88);
  if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png"); // browsers without WEBP encoding
  if (out.length > 1.3e6) out = c.toDataURL("image/jpeg", 0.85);
  return out;
}

  const HINT = "Tip: open the image (an X profile picture, any picture online), right-click it and choose \"Copy image address\", then paste it here.";
  let st = { link: "", ok: true, busy: null };
  const say = (text, cls = "") => { msg.textContent = text; msg.className = "stat" + (cls ? " " + cls : ""); };
  const show = (src) => { prev.innerHTML = src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : "?"; };
  say(HINT);

  function check() {
    const link = fixImageLink(inp.value);
    if (link !== inp.value.trim()) inp.value = link;
    if (link === st.link) return st.busy || Promise.resolve();
    if (!link) { st = { link: "", ok: true, busy: null }; show(""); say(HINT); return Promise.resolve(); }
    if (!ipfsPath(link) && !/^https:\/\//i.test(link)) {
      st = { link, ok: false, busy: null }; show(""); say("Use a link that starts with https:// or ipfs://", "warn");
      return Promise.resolve();
    }
    say("Checking the image…");
    const busy = imageLoads(link).then((src) => {
      if (st.link !== link) return;
      st = { link, ok: !!src, busy: null };
      show(src);
      if (src) say("✓ Image found", "ok");
      else say("This link isn't an image, it's probably a web page. " + HINT, "warn");
    });
    st = { link, ok: false, busy };
    return busy;
  }
  let timer = 0;
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(check, 600); };
  inp.onchange = () => { clearTimeout(timer); check(); };

  let canUpload = false;
  async function upload(file) {
    if (!canUpload) return say("Uploading isn't available right now: paste an image link instead.", "warn");
    const job = (async () => {
      try {
        say("Preparing the image…");
        const dataUrl = await shrinkImage(file);
        show(dataUrl);
        say("Uploading to IPFS…");
        const [, type, data] = dataUrl.match(/^data:([^;]+);base64,(.*)$/);
        const r = await fetch("/api/upload", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type, data }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || typeof j.url !== "string" || !ipfsPath(j.url)) throw new Error(j.error || "Upload failed, please try again");
        inp.value = j.url;
        st = { link: j.url, ok: true, busy: null };
        say("✓ Uploaded to IPFS", "ok");
      } catch (e) {
        st = { link: "", ok: true, busy: null }; // whatever link is left in the field gets checked again on launch
        show(""); say(errMsg(e), "warn");
      }
    })();
    st = { ...st, busy: job };
    return job;
  }
  fetch("/api/upload", { signal: AbortSignal.timeout(8000) }).then((r) => r.json()).then((j) => {
    if (!j?.enabled || !$("#imgupbox")) return;
    canUpload = true;
    $("#imgupbox").hidden = false;
    $("#imgup").onclick = () => $("#imgfile").click();
    $("#imgfile").onchange = () => { const f = $("#imgfile").files[0]; if (f) upload(f); $("#imgfile").value = ""; };
    const row = $("#imgrow");
    row.ondragover = (e) => { e.preventDefault(); row.classList.add("drag"); };
    row.ondragleave = () => row.classList.remove("drag");
    row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drag"); const f = e.dataTransfer?.files?.[0]; if (f) upload(f); };
  }).catch(() => {});
  // Pasting a copied image (not a link) anywhere in the form uploads it.
  $("#cf").addEventListener("paste", (e) => {
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
    if (f) { e.preventDefault(); upload(f); }
  });

  return {
    async ready() {
      await check();
      if (st.busy) await st.busy;
      if (st.link && !st.ok) return "The image doesn't load. Fix the link, upload an image, or leave the field empty.";
      return "";
    },
  };
}

            </div>
            <div class="stat" id="imgmsg" style="margin-top:6px"></div>
          </div>
        </div>
        <label for="d">Description</label><textarea id="d" maxlength="500"></textarea>
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:140px"><label for="w">Website</label><input id="w" placeholder="https://" /></div>
          <div style="flex:1;min-width:140px"><label for="x">X</label><input id="x" placeholder="https://x.com/…" /></div>
          <div style="flex:1;min-width:140px"><label for="tg">Telegram</label><input id="tg" placeholder="https://t.me/…" /></div>
        </div>
        ${LAUNCH?.split ? `${sec(3, "Where the 3% goes")}
        <div class="presets" id="presets">${SPLIT_PRESETS.map((p) => `<button type="button" data-p="${p.id}"><b>${p.icon} ${p.name}</b><div class="stat">${p.note}</div></button>`).join("")}<button type="button" data-p="custom"><b>⚙️ Custom</b><div class="stat">Your own mix, in 0.5% steps</div></button></div>
        <div class="splitrow" id="custom" hidden>
          ${[["sc", "Creator", 200], ["sh", "Holders", 300], ["sb", "Burn", 300]].map(([id, l, max]) => `<div><label for="${id}">${l}</label><select id="${id}">${Array.from({ length: max / 50 + 1 }, (_, i) => `<option value="${i * 50}">${i * 0.5}%</option>`).join("")}</select></div>`).join("")}

        <div class="stat" id="splitnote" style="margin-top:8px"></div>` : ""}
        ${sec(LAUNCH?.split ? 4 : 3, "Initial buy")}
        <div class="row" style="margin-bottom:4px"><span class="stat">Pay with</span><div class="seg" id="ibpay"><button type="button" data-p="eth">ETH</button><button type="button" data-p="imd">IMD</button></div></div>
        <label for="ib" id="ibl">Amount (optional)</label><input id="ib" inputmode="decimal" placeholder="0" />
        <div class="preview" id="ibp"></div>
        <div class="stat" id="ibnote"></div>
        ${sec(LAUNCH?.split ? 5 : 4, "Launch")}
        <button class="primary full" id="go" type="submit">Launch token</button>
      </form>
      <div class="card" style="margin-top:26px">
        <span class="h">How it works</span>
        <p class="muted">Your token gets a Uniswap v4 pool against IMD holding the entire supply, tradable from the first block here, in the Uniswap app, or through any v4 router. The liquidity is owned by the launchpad contract, which has no way to remove it: it is locked forever.</p>
        <div class="fees"><b style="color:var(--text)">4% fee on every buy and sell</b><br/>${LAUNCH?.split ? "1% protocol · 3% split as you choose: creator earnings (IMD, up to 2%), holder rewards (IMD, pro rata to balance), and burn (taken in your token on every trade and burned). The split is fixed forever at launch." : "1% protocol · 3% shared by all holders, pro rata to their balance, paid in IMD. Holders claim anytime."}</div>
        <div class="fees" id="startmc"></div>
      </div>
    </div>`;
  const updStart = async () => {
    try {
      const v = startMcap(await padR.startTick(quote));
      $("#startmc").innerHTML = `Starting market cap: <b style="color:var(--text)">≈ ${usd(v, quote)}</b> <span class="muted">(${fmt(v)} ${qsym(quote)})</span>`;
    } catch {}
  };
  // Initial buy: in IMD it happens inside the launch transaction (nobody can buy first). In ETH it is a second
  // transaction right after the launch, through the ETH router (ETH -> IMD -> token), so creators don't need IMD.
  $("#lchain")?.querySelectorAll("button").forEach((b) => b.onclick = () => {
    launchChain = b.dataset.c;
    try { localStorage.setItem("launchChain", launchChain); } catch {}
    renderCreate();
  });
  let pay = LAUNCH.ethLive ? "eth" : "imd";
  if (!LAUNCH.ethLive) $("#ibpay").parentElement.remove();
  const ibAmount = () => { try { const v = $("#ib").value.trim(); return v ? ethers.parseUnits(v, 18) : 0n; } catch { return 0n; } };
  /// Tokens bought at launch for `imdIn` IMD: the new pool behaves like x*y=k with startMcap(tick) of virtual IMD.
  // v5 split: the IMD fee is 4% minus the burn share, and the buyer receives the tokens minus the burn share.
  let split = { c: 0, h: 300, b: 0 };
  const tokensFor = (imdIn, tick) => {
    const b = BigInt(split.b);
    const net = imdIn - (imdIn * (400n - b)) / 10000n;
    const pool = (SUPPLY * net) / (startMcap(tick) + net);
    return pool - (pool * b) / 10000n;
  };
  if (LAUNCH?.split) {
    const showSplit = () => {
      const sum = split.c + split.h + split.b;
      $("#splitnote").innerHTML = sum === 300
        ? `Every trade: <b style="color:var(--text)">${esc(feeText(split))}</b>.${split.c ? " Creator earnings go to your wallet; collect them on the token page." : ""}${split.b ? " Burned tokens are gone forever." : ""}`

      $("#go").disabled = sum !== 300;
    };
    const pick = (id) => {
      $("#presets").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.p === id));
      $("#custom").hidden = id !== "custom";
      const pr = SPLIT_PRESETS.find((x) => x.id === id);
      if (pr) split = { c: pr.c, h: pr.h, b: pr.b };
      else split = { c: Number($("#sc").value), h: Number($("#sh").value), b: Number($("#sb").value) };
      showSplit();
      $("#ib").dispatchEvent(new Event("input")); // refresh the initial-buy preview
    };
    $("#presets").querySelectorAll("button").forEach((b) => (b.onclick = () => pick(b.dataset.p)));
    ["#sc", "#sh", "#sb"].forEach((id) => ($(id).onchange = () => pick("custom")));
    $("#sh").value = "300";
    pick("diamond");
  }
  let pvSeq = 0;
  const updPreview = async () => {
    const seq = ++pvSeq, amt = ibAmount();
    if (!amt) return ($("#ibp").textContent = "");
    try {
      const imdIn = pay === "eth" ? await quoteExact(ch.imdEthKey, true, amt, ch) : amt;
      const out = tokensFor(imdIn, await padR.startTick(quote));
      if (seq !== pvSeq) return;
      $("#ibp").textContent = `≈ ${fmt(out)} tokens (${(Number((out * 10000n) / SUPPLY) / 100).toFixed(2)}% of supply)` + (pay === "eth" ? ` · ≈ ${fmt(imdIn)} IMD` : "");
    } catch { if (seq === pvSeq) $("#ibp").textContent = "Can't quote this amount"; }
  };
  const setPay = (p) => {
    pay = p;
    document.querySelectorAll("#ibpay button").forEach((b) => b.classList.toggle("on", b.dataset.p === p));
    $("#ibl").textContent = `Amount in ${p.toUpperCase()} (optional): buy your token first`;
    $("#ibnote").textContent = p === "eth"
      ? "Two wallet confirmations: the launch, then your buy with ETH (swapped to IMD automatically). Someone could buy in the few seconds between them; pay with IMD to buy inside the launch itself."
      : "Bought in the same transaction as the launch, so nobody can buy before you.";
    updPreview();
  };
  document.querySelectorAll("#ibpay button").forEach((b) => b.onclick = () => setPay(b.dataset.p));
  setPay(pay);
  $("#ib").oninput = updPreview;
  updStart();
  const image = setupImageField();

  $("#cf").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true;
    try {
      const imgErr = await image.ready(); // never launch with an image link that doesn't load: it can't be changed later
      if (imgErr) throw new Error(imgErr);
      // Read everything from the form before the wallet is asked anything: connecting must never launch from an
      // emptied form.
      const m = {};
      const put = (k, id) => { const v = $(id).value.trim(); if (v) m[k] = v; };
      put("image", "#img"); put("description", "#d"); put("website", "#w"); put("x", "#x"); put("telegram", "#tg");
      const amt = ibAmount();
      if ($("#ib").value.trim() && !amt) throw new Error("Enter a valid amount for the initial buy, or leave it empty");
      const form = { name: $("#n").value.trim(), symbol: $("#s").value.trim() };
      if (!form.name || !form.symbol) throw new Error("Enter a name and a ticker");
      await requireWallet(ch);
      if (!$("#cf")) throw new Error("The page changed. Try again.");
      const ethBuy = pay === "eth" ? amt : 0n, imdBuy = pay === "imd" ? amt : 0n;
      // IMD buy inside the launch: 10% below the previewed amount, so a changed start price can't fill it far worse.
      let minOut = 0n;
      if (imdBuy > 0n) {
        minOut = withSlippage(tokensFor(imdBuy, await padR.startTick(quote)), 1000);
        await ensureImdAllowance(imdBuy, LAUNCH.router, ch.imd);
      }
      const router = new ethers.Contract(LAUNCH.router, ROUTER_ABI, signer);
      toast(ethBuy ? "Step 1 of 2: confirm the launch in your wallet…" : "Confirm the launch in your wallet…", 8000);
      if (LAUNCH.split && split.c + split.h + split.b !== 300) throw new Error("The fee shares must add up to 3%");
      const tx = LAUNCH.split
        ? await router.launchWithSplit(form.name, form.symbol, JSON.stringify(m), quote, [split.c, split.h, split.b], imdBuy, minOut, { value: 0n })
        : await router.launch(form.name, form.symbol, JSON.stringify(m), quote, imdBuy, minOut, { value: 0n });
      toast("Launching…", 15000);
      const rc = await tx.wait();
      const ev2 = rc.logs.map((l) => { try { return padR.interface.parseLog(l); } catch { return null; } }).find((l) => l?.name === "TokenLaunched");
      const token = ev2?.args.token;
      if (ethBuy > 0n && token) {
        try {
          let info = null; // the read RPC can be a block behind the wallet's: retry briefly
          for (let i = 0; i < 6 && !info; i++) { try { info = await LAUNCH.v.getTokenInfo(token); } catch { await new Promise((r) => setTimeout(r, 1500)); } }
          if (!info) throw new Error("the new token isn't visible yet");
          const expected = await quoteSwapEth(LAUNCH, token, info.quoteIsCurrency0, true, ethBuy);
          toast("Token launched! Step 2 of 2: confirm your ETH buy…", 10000);
          const tx2 = await new ethers.Contract(LAUNCH.ethRouter, ETH_ROUTER_ABI, signer)
            .buyWithEth(token, withSlippage(expected, 500), deadline(), { value: ethBuy });
          toast("Buying…", 15000);
          await tx2.wait();
          toast("Token launched and bought");
        } catch (e) {
          toast(`Token launched, but the ETH buy didn't go through (${errMsg(e)}). You can buy it on the token page.`, 10000);
        }
      } else toast("Token launched");
      location.hash = token ? "#/t/" + token : "#/";
    } catch (e) { toast(errMsg(e), 7000); }
    btn.disabled = false;
  };
}
